info:
    name: Delete Activity
    type: http
    seq: 2

http:
    method: DELETE
    url: "{{BASE_URL}}/feed/{{ACTIVITY_ID}}"

settings:
    encodeUrl: true

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Delete Activity

    Deletes one of your own activities.

    **Auth:** Bearer token (any authenticated user).
    **Rate Limit:** 300 requests per minute (user limiter).

    ### Path params

    | Param      | Type | Description        |
    |------------|------|--------------------|
    | activityId | uuid | Id of the activity |

    ### Response (204)

    No content.

    ### Errors

    | Status | Type                  | When                                                  |
    |--------|-----------------------|-------------------------------------------------------|
    | 404    | ACTIVITY_NOT_FOUND    | The activity does not exist or belongs to someone else |
    | 422    | COMMON_SCHEMA_INVALID | `activityId` is not a UUID                            |
