docs: |-
    ## Get Feed

    Returns recent activity from users you follow. Activities include adding games to backlog, completing games, adding favorites, etc.

    **Auth:** Bearer token (any authenticated user).

    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    | Param    | Type   | Description                                                                 |
    |----------|--------|-----------------------------------------------------------------------------|
    | limit    | number | Page size (1-100, default 25).                                              |
    | offset   | number | Rows to skip (default 0).                                                    |
    | category | string | Coarse filter: `games`, `lists` or `social`. **Premium only.**              |
    | types    | string | CSV of granular activity types (e.g. `backlog_completed,backlog_abandoned`). **Premium only.** |

    When both `category` and `types` are provided, the result is their intersection. Follow events (`user_followed`, `user_followed_by`) never appear in the feed, so the `social` category effectively surfaces `coop_tagged` only.

    **Premium gate:** free users who send `category` or `types` get `402 ACTIVITY_FEED_FILTER_PREMIUM`. Without those params the feed works for everyone.

    ### Response (200)

    ```json
    {
      "data": {
        "activities": [
          {
            "id": "uuid",
            "type": "backlog_added",
            "metadata": { "platform": "Steam" },
            "createdAt": "2026-01-01T00:00:00.000Z",
            "user": {
              "id": "uuid",
              "username": "johndoe",
              "name": "John Doe",
              "avatarUrl": null
            },
            "game": {
              "id": "uuid",
              "title": "Fez",
              "code": "fez",
              "backgroundUrl": "https://..."
            }
          }
        ]
      }
    }
    ```

    For `coop_tagged`, `target` is the tagged user and `game` carries the co-op game (from a `metadata` snapshot taken when the tag was created, shape `{ type: "game", id, name, code, backgroundUrl }`). This lets the client render "X is playing co-op with Y in [game]". Other activity types omit `game`.

    ### Activity Types

    | Type               | Description                    |
    |--------------------|--------------------------------|
    | backlog_added      | Added a game to backlog        |
    | backlog_playing    | Started playing a game         |
    | backlog_completed  | Completed a game               |
    | backlog_abandoned  | Abandoned a game               |
    | favorite_added     | Added a game to favorites      |
    | list_created       | Created a new list             |
    | game_reviewed      | Reviewed a game                |
    | coop_tagged        | Tagged a friend in a co-op run |
