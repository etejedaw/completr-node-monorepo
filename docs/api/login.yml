info:
    name: Login
    type: http
    seq: 2

http:
    method: POST
    url: "{{BASE_URL}}/auth/login"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "email": "{{process.env.EMAIL}}",
              "password": "{{process.env.PASSWORD}}"
            }

runtime:
    scripts:
        - type: after-response
          code: |-
              bru.setVar("TOKEN", res.body.data.access_token);
              bru.setVar("SESSION_ID", res.body.data.session_id);

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5

docs: |-
    ## Login

    Authenticates a user and returns an access token. The refresh token is set as an HttpOnly cookie.

    **Rate Limit:** 5 requests per minute, 15-minute block after exhaustion.

    ### Request Body

    | Field    | Type   | Required | Description                                        |
    |----------|--------|----------|----------------------------------------------------|
    | email    | string | Yes      | Valid email format                                  |
    | password | string | Yes      | 8-15 chars, uppercase, lowercase, number, special  |

    ### Response (200)

    Sets cookie `refresh_token` with attributes `HttpOnly; SameSite=Lax; Path=/auth; Max-Age=30d` (and `Secure; Domain=.completr.app` in production).

    ```json
    {
      "data": {
        "access_token": "jwt_token",
        "session_id": "uuid"
      }
    }
    ```

    `session_id` identifies the current device session — used by the frontend to mark "this device" in the session list and to call `DELETE /auth/sessions/others/:sessionId`.
