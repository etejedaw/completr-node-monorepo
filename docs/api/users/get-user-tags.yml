info:
    name: Get User Favorite Tags
    type: http
    seq: 20

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/tags"
    params:
        - name: username
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get User Favorite Tags

    Returns the user's favorite tags (up to 5) in the order the owner chose with `PUT /users/me/mood-tags/favorites`, with the description the owner gave each one. Empty list when the user has no favorites.

    The profile must be visible (`profileVisibility`) and then the `tag` section (`tagVisibility`): `friends` only for mutual followers, `private` only for the owner. The owner always sees their own.

    **Authentication:** Optional (used to detect self and mutual follow).
    **Rate Limit:** public limiter.

    ### Path Parameters

    | Param    | Type   | Required | Description  |
    |----------|--------|----------|--------------|
    | username | string | Yes      | The username |

    ### Response (200)

    ```json
    {
      "data": {
        "tags": [
          { "tag": "relajante", "description": "Para una sesión chill" },
          { "tag": "co-op", "description": null }
        ]
      }
    }
    ```

    ### Errors

    - 404 `USER_NOT_FOUND` — Unknown or deactivated user
    - 403 `USER_PRIVATE` — Profile or tag section not visible to the requester
    - 422 `COMMON_SCHEMA_INVALID` — Invalid username
