info:
    name: Get User List Detail
    type: http
    seq: 6

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/lists/:listId"
    params:
        - name: username
          type: path
          value: ""
        - name: listId
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get User's Public List Detail

    Returns a public list owned by `:username` with all its items. Per-item `backlogStatus`, `realDuration`, and `personalRatio` reflect the **viewer's** backlog (not the list owner's) when the request is authenticated. If unauthenticated, these reflect the list owner's backlog instead.

    **Authentication:** Optional (Bearer token). If provided, viewer-specific data is populated.
    **Rate Limit:** 100 requests per minute (public).

    Returns 403 if the profile is private. Returns 404 if user/list not found or list is private.

    ### Path Params

    | Param    | Type   | Required | Description       |
    |----------|--------|----------|-------------------|
    | username | string | Yes      | Profile username  |
    | listId   | uuid   | Yes      | List UUID         |

    ### Response (200)

    ```json
    {
      "data": {
        "list": {
          "id": "uuid",
          "name": "Saga Resident Evil",
          "description": "...",
          "isPublic": true,
          "isOfficial": false,
          "scoreSource": "metacritic",
          "durationSource": "hltb",
          "followerCount": 12,
          "progress": { "completed": 8, "total": 15 },
          "items": [
            {
              "id": "uuid",
              "position": 1,
              "score": 89,
              "duration": 6,
              "ratio": 14.83,
              "game": {
                "id": "uuid",
                "title": "Resident Evil 2",
                "coverUrl": "...",
                "isDlc": false
              },
              "backlogStatus": "completed",
              "realDuration": 14.5,
              "personalRatio": 122.76
            }
          ]
        },
        "profileUser": {
          "username": "andres",
          "name": "Andres"
        }
      }
    }
    ```
