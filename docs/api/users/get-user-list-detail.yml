info:
    name: Get User List Detail
    type: http
    seq: 6

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/lists/:listId"
    params:
        - name: username
          type: path
          value: ""
        - name: listId
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get User's Public List Detail

    Returns a public list with all its items, showing **`:username`'s progress** on it — this is the "see how @username has progressed through this list" view (used when opening a list from a user's profile). Per-item `backlogStatus`, `realDuration`, `personalRatio` and the list `progress` reflect the **profile user's** backlog, not the viewer's.

    Privacy: the profile user's progress is only included when their backlog is public (`isBacklogPublic`) or you are them; for other users only their **public** backlog entries are counted. When their backlog is private, the list is still returned but without progress data (`progress: null`, no per-item `backlogStatus`).

    **Authentication:** Optional (Bearer token). The viewer identity is only used to detect self-view.
    **Rate Limit:** 100 requests per minute (public).

    Returns 403 if the profile is private. Returns 404 if user/list not found or list is private.

    ### Path Params

    | Param    | Type   | Required | Description       |
    |----------|--------|----------|-------------------|
    | username | string | Yes      | Profile username  |
    | listId   | uuid   | Yes      | List UUID         |

    ### Response (200)

    ```json
    {
      "data": {
        "list": {
          "id": "uuid",
          "name": "Saga Resident Evil",
          "description": "...",
          "isPublic": true,
          "isOfficial": false,
          "owner": { "username": "andres" },
          "scoreSource": "metacritic",
          "durationSource": "hltb",
          "followerCount": 12,
          "progress": { "completed": 8, "total": 15 },
          "items": [
            {
              "id": "uuid",
              "position": 1,
              "score": 89,
              "duration": 6,
              "ratio": 14.83,
              "game": {
                "id": "uuid",
                "title": "Resident Evil 2",
                "coverUrl": "...",
                "isDlc": false
              },
              "backlogStatus": "completed",
              "realDuration": 14.5,
              "personalRatio": 122.76
            }
          ]
        },
        "profileUser": {
          "username": "andres",
          "name": "Andres"
        }
      }
    }
    ```
