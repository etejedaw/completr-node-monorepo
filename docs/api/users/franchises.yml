info:
    name: Get User Franchises
    type: http
    seq: 14

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/franchises"
    auth: inherit
    params:
        - name: username
          value: ""
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User Franchises

    Returns the franchises `:username` has **tracked** (opted in via `POST /franchises/:code/track`), each with its count of active games, sorted by name. Powers the "Sagas" section on a profile. The response carries no personal progress.

    For non-self viewers the target's `profile` and `franchise` sections must be visible (`profileVisibility` and `franchiseVisibility`): `friends` only for mutual followers, `private` only for the owner. The backlog visibility does not apply.

    **Authentication:** optional (Bearer token). Required to see a profile whose privacy needs it.
    **Rate Limit:** 100 requests per minute (public).

    ### Path Params

    | Param    | Type   | Required | Description      |
    |----------|--------|----------|------------------|
    | username | string | Yes      | Profile username |

    ### Response (200)

    ```json
    {
      "data": {
        "franchises": [
          {
            "franchise": {
              "id": "uuid",
              "name": "Resident Evil",
              "code": "resident-evil"
            },
            "gameCount": 6
          }
        ],
        "total": 1
      }
    }
    ```

    `gameCount` counts the active games in the franchise.

    ### Errors

    | Status | Code                  | Description                                          |
    |--------|-----------------------|------------------------------------------------------|
    | 403    | USER_PRIVATE          | Profile or its sagas section is not visible          |
    | 404    | USER_NOT_FOUND        | No user with that username                           |
    | 422    | COMMON_SCHEMA_INVALID | `username` fails validation                          |
