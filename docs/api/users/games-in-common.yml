info:
    name: Get Games In Common
    type: http
    seq: 8

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/games-in-common"
    auth: inherit
    params:
        - name: username
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get Games In Common

    Returns the games that **both** the authenticated viewer and `:username` have completed (backlog status `completed`), deduped per game and ordered by the target user's most recent completion. Only the target's **public** completed entries are considered. Powers the "Games in Common" section on another user's public profile.

    When the viewer requests their own profile, an empty list is returned (you have every completed game in common with yourself, so the comparison is meaningless).

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute (public).

    ### Path Params

    | Param    | Type   | Required | Description      |
    |----------|--------|----------|------------------|
    | username | string | Yes      | Profile username |

    ### Response (200)

    ```json
    {
      "data": {
        "games": [
          {
            "id": "uuid",
            "code": "resident-evil-2",
            "title": "Resident Evil 2",
            "backgroundUrl": "https://example.com/bg.jpg"
          }
        ],
        "total": 1
      }
    }
    ```

    `backgroundUrl` may be `null`. `total` equals `games.length`.

    ### Errors

    | Status | Code                  | Description                                           |
    |--------|-----------------------|-------------------------------------------------------|
    | 401    | UNAUTHORIZED          | Missing or invalid Bearer token                       |
    | 403    | USER_PRIVATE          | Target profile is private or its backlog is not public |
    | 404    | USER_NOT_FOUND        | No user with that username                            |
    | 422    | COMMON_SCHEMA_INVALID | `username` fails validation                           |
