info:
    name: Admin List Users
    type: http
    seq: 17

http:
    method: GET
    url: "{{BASE_URL}}/admin/users?q=john&limit=50&offset=0"

settings:
    encodeUrl: true

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Admin List Users

    Lists every account, active or not, from newest to oldest (`createdAt` descending, `id` as tiebreaker). Only accessible by admin; for anyone else the route does not exist.

    `q` filters by `username`, `name` or `email` with the shared text search rules: ignoring case, accents and punctuation, every word must appear in one of the three fields, in any order, and `%`, `_` and `\` are never wildcards. `q` is trimmed; an empty `q`, or one without letters or digits, does not filter. `total` counts every account that matches the filter, without pagination.

    **Auth:** Bearer token (admin only).

    ### Query Parameters

    | Param  | Type    | Required | Description                                       |
    |--------|---------|----------|---------------------------------------------------|
    | q      | string  | No       | Search on username, name and email, up to 100 characters after trimming |
    | limit  | integer | No       | 1-100, defaults to 50                              |
    | offset | integer | No       | From 0, defaults to 0                              |

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          {
            "id": "uuid",
            "username": "johndoe",
            "email": "johndoe@example.com",
            "name": "John Doe",
            "role": "user",
            "isActive": true,
            "profileVisibility": "public",
            "createdAt": "2026-04-15T00:00:00.000Z"
          }
        ],
        "total": 1
      }
    }
    ```

    ### Errors

    | Status | Code                  | Description                                             |
    |--------|-----------------------|---------------------------------------------------------|
    | 404    | AUTH_ROUTE_NOT_FOUND  | Caller is not an active admin, or the token is missing or invalid |
    | 422    | COMMON_SCHEMA_INVALID | `limit` or `offset` out of range, or `q` longer than 100 characters |
