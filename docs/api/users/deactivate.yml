info:
  name: Deactivate User
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/users/me/deactivate"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true

docs: |-
  ## Deactivate User

  Deactivates the authenticated user's account. This is a soft delete.

  **Authentication:** Bearer token required.
  **Rate Limit:** 50 requests per minute.

  ### Response (204)

  No content.
