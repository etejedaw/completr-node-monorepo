info:
    name: Update User
    type: http
    seq: 3

http:
    method: PATCH
    url: "{{BASE_URL}}/users/me"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "name": "John Updated",
              "bio": "Updated bio",
              "profileVisibility": "friends",
              "backlogVisibility": "public"
            }

settings:
    encodeUrl: true

docs: |-
    ## Update User Profile

    Updates the authenticated user's profile. All fields are optional.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Visibility levels

    All `*Visibility` fields use the enum `private | friends | public`:

    - `private` — only the owner can see the section.
    - `friends` — only the owner and viewers that follow each other with the owner (mutual follow) can see.
    - `public` — anyone can see.

    `profileVisibility` gates the whole profile (header, metadata). When it is
    `private` or `friends`, viewers without access only see avatar + username +
    bio + follow buttons; section visibilities then gate the individual tabs.

    ### Request Body

    | Field                 | Type                                | Required | Description                                                       |
    |-----------------------|-------------------------------------|----------|-------------------------------------------------------------------|
    | name                  | string                              | No       | 1-80 characters, must not contain `<` or `>`                      |
    | bio                   | string                              | No       | 1-250 characters, must not contain `<` or `>`                     |
    | avatarUrl             | string                              | No       | Valid URL                                                         |
    | profileVisibility     | `private` \| `friends` \| `public`  | No       | Whole-profile gate                                                |
    | queueVisibility       | `private` \| `friends` \| `public`  | No       | Queue (Up Next) visibility                                        |
    | wishlistVisibility    | `private` \| `friends` \| `public`  | No       | Wishlist visibility                                               |
    | favoriteVisibility    | `private` \| `friends` \| `public`  | No       | Favorites visibility                                              |
    | feedVisibility        | `private` \| `friends` \| `public`  | No       | Activity feed visibility                                          |
    | backlogVisibility     | `private` \| `friends` \| `public`  | No       | Backlog (My Games) visibility                                     |
    | shelfVisibility       | `private` \| `friends` \| `public`  | No       | Shelf visibility                                                  |
    | listVisibility        | `private` \| `friends` \| `public`  | No       | Lists visibility                                                  |
    | acceptFollowRequests  | boolean                             | No       | If `false` on a `private` profile, the Follow button is hidden. Toggling from true to false deletes all pending requests. |
    | theme                 | string                              | No       | Theme id                                                          |

    ### Response (200)

    Returns the updated `userMe` payload (all 8 visibility enums included).
