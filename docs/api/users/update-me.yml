info:
    name: Update User
    type: http
    seq: 3

http:
    method: PATCH
    url: "{{BASE_URL}}/users/me"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "name": "John Updated",
              "bio": "Updated bio",
              "isPublic": true
            }

settings:
    encodeUrl: true

docs: |-
    ## Update User Profile

    Updates the authenticated user's profile. All fields are optional.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field                 | Type    | Required | Description                                                       |
    |-----------------------|---------|----------|-------------------------------------------------------------------|
    | name                  | string  | No       | 1-80 characters                                                   |
    | bio                   | string  | No       | 1-250 characters                                                  |
    | avatarUrl             | string  | No       | Valid URL                                                         |
    | isPublic              | boolean | No       | Profile visibility                                                |
    | isQueuePublic         | boolean | No       | Queue (Up Next) visibility                                        |
    | isWishlistPublic      | boolean | No       | Wishlist visibility                                               |
    | isFavoritePublic      | boolean | No       | Favorites visibility                                              |
    | isFeedPublic          | boolean | No       | Activity feed visibility                                          |
    | isBacklogPublic       | boolean | No       | Backlog (My Games) visibility                                     |
    | isShelfPublic         | boolean | No       | Shelf visibility                                                  |
    | isListPublic          | boolean | No       | Lists visibility                                                  |
    | acceptFollowRequests  | boolean | No       | If false on a private profile, others cannot send follow requests. Toggling from true to false deletes all pending requests. |
    | theme                 | string  | No       | Theme id                                                          |

    ### Response (200)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "email": "johndoe@example.com",
          "role": "user",
          "name": "John Updated",
          "bio": "Updated bio",
          "avatarUrl": "https://example.com/avatar.png"
        }
      }
    }
    ```
