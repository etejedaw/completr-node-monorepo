info:
    name: Get User by Username
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/:username"
    params:
        - name: username
          value: johndoe
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User by Username

    Returns the public profile of a user by their username, including their public backlogs, lists, favorites, queue and wishlist.

    If the user's `isPublic` is `false` and the requester is not the user themselves, the response returns a minimal payload with `isPrivate: true` plus `user` (id, username, name, bio, avatarUrl), `followerCount`, `followingCount`, and `isFollowing` — so the avatar can still be displayed.

    When the authenticated requester is the same as the requested user (self view), all data is returned regardless of `isPublic` and per-section visibility flags.

    Favorites, queue and wishlist are only included if `isFavoritePublic` / `isQueuePublic` / `isWishlistPublic` are `true` (or the requester is self). Backlog, game shelf and lists are only included if `isBacklogPublic` / `isShelfPublic` / `isListPublic` are `true` (or the requester is self).

    **Authentication:** Optional (used to detect self).
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description          |
    |----------|--------|----------|----------------------|
    | username | string | Yes      | The user's username  |

    ### Response (200)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "role": "user",
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png",
          "isQueuePublic": true,
          "isWishlistPublic": true,
          "isFavoritePublic": true,
          "isBacklogPublic": true,
          "isShelfPublic": true,
          "isListPublic": true,
          "createdAt": "2026-01-01T00:00:00.000Z"
        },
        "backlogs": [],
        "lists": [],
        "favorites": [],
        "queue": [],
        "wishlist": []
      }
    }
    ```

    ### Response (200, private profile)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png"
        },
        "isPrivate": true,
        "followerCount": 12,
        "followingCount": 8,
        "isFollowing": false
      }
    }
    ```

    ### Errors

    | Status | Code          | Description               |
    |--------|---------------|---------------------------|
    | 404    | USER_NOT_FOUND| User does not exist       |
