info:
    name: Get User by Username
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/:username"
    params:
        - name: username
          value: johndoe
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User by Username

    Returns a public profile bundle for the given user: their public information plus a backlog preview (up to 6 most recent entries), backlog stats by status, lists total, recent activity (up to 10) and follower counters.

    The `backlogs` array is a preview — it is capped at 6 entries by design. Full paginated browsing of the user backlog lives at `GET /users/:username/backlog`. Other sections (queue, wishlist, favorites, game-shelf, lists) are not embedded here either — they each have their own dedicated endpoint.

    If the user's `profileVisibility` is `private` (or `friends` for a viewer that is not a mutual follower) and the requester is not the user themselves, the response returns a minimal payload with `isPrivate: true` plus `user` (id, username, name, bio, avatarUrl), `profileVisibility`, `acceptFollowRequests`, `followerCount`, `followingCount`, `isFollowing`, and `hasPendingRequest`.

    When the authenticated requester is the same as the requested user (self view), all data is returned regardless of visibility flags.

    Per-section visibility (`backlogVisibility`, `listVisibility`, `feedVisibility`) gates whether the backlog/lists/activity blocks are populated for non-self viewers.

    **Authentication:** Optional (used to detect self, mutual follow, etc.).
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description          |
    |----------|--------|----------|----------------------|
    | username | string | Yes      | The user's username  |

    ### Response (200)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "role": "user",
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png",
          "profileVisibility": "public",
          "queueVisibility": "public",
          "wishlistVisibility": "public",
          "favoriteVisibility": "public",
          "feedVisibility": "public",
          "backlogVisibility": "public",
          "shelfVisibility": "public",
          "listVisibility": "public",
          "createdAt": "2026-01-01T00:00:00.000Z"
        },
        "followerCount": 12,
        "followingCount": 8,
        "isFollowing": false,
        "backlogs": [],
        "backlogTotal": 0,
        "backlogStats": {
          "not_started": 0,
          "playing": 0,
          "completed": 0,
          "abandoned": 0,
          "endless": 0
        },
        "listsTotal": 0,
        "recentActivity": []
      }
    }
    ```

    `backlogs` is capped at 6 entries (preview). Use `GET /users/:username/backlog` for the full paginated list.

    ### Response (200, private profile)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png"
        },
        "isPrivate": true,
        "profileVisibility": "private",
        "acceptFollowRequests": true,
        "followerCount": 12,
        "followingCount": 8,
        "isFollowing": false,
        "hasPendingRequest": false
      }
    }
    ```

    ### Errors

    | Status | Code          | Description               |
    |--------|---------------|---------------------------|
    | 404    | USER_NOT_FOUND| User does not exist       |
