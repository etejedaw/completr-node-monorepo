info:
    name: Get User by Username
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/:username"
    params:
        - name: username
          value: johndoe
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User by Username

    Returns the public profile of a user by their username, including their public backlogs, lists, favorites, queue and wishlist.
    The user must have `isPublic` set to `true` to be visible.
    Favorites, queue and wishlist are only included if the user has `isFavoritePublic` / `isQueuePublic` / `isWishlistPublic` set to `true`.

    **Authentication:** Not required.
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description          |
    |----------|--------|----------|----------------------|
    | username | string | Yes      | The user's username  |

    ### Response (200)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "role": "user",
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png",
          "isQueuePublic": true,
          "isWishlistPublic": true,
          "isFavoritePublic": true,
          "createdAt": "2026-01-01T00:00:00.000Z"
        },
        "backlogs": [],
        "lists": [],
        "favorites": [],
        "queue": [],
        "wishlist": []
      }
    }
    ```

    ### Errors

    | Status | Code          | Description               |
    |--------|---------------|---------------------------|
    | 404    | USER_NOT_FOUND| User does not exist       |
    | 403    | USER_PRIVATE  | User profile is private   |
