info:
    name: Search Users
    type: http
    seq: 6

http:
    method: GET
    url: "{{BASE_URL}}/users/search?q=john"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Search Users

    Search users by username/name (partial, case-insensitive) or by exact email.
    Returns active users (both public and private). Private users appear in results
    but their profile shows limited info.

    **Auth:** Bearer token required.

    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    At least one of `q` or `email` is required.

    | Param | Type    | Required | Description                                |
    |-------|---------|----------|--------------------------------------------|
    | q     | string  | No       | Partial match on username or name (ILIKE)  |
    | email | string  | No       | Exact email match (case-insensitive)       |
    | limit | integer | No       | Max results (1-50, default 20)             |

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          {
            "id": "uuid",
            "username": "johndoe",
            "name": "John Doe",
            "avatarUrl": null,
            "profileVisibility": "public",
            "isSelf": false,
            "followerCount": 12,
            "isFollowing": false,
            "gamesTotal": 609,
            "completedTotal": 214,
            "featuredGame": {
              "title": "Resident Evil 4",
              "backgroundUrl": "https://…/re4.jpg"
            }
          }
        ]
      }
    }
    ```

    Each user includes card insights resolved with the viewer's visibility rules. If the viewer cannot see the profile section, `followerCount`, `gamesTotal`, `completedTotal` and `featuredGame` are `null` (`isFollowing` still reflects the viewer's own follow). `gamesTotal` / `completedTotal` are `null` when the backlog section is not visible (counts only public backlogs for other viewers), and `featuredGame` (the #1 favorite) is `null` when the favorites section is not visible or empty. `isFollowing` is only `true` for an authenticated viewer who follows the user.
