info:
    name: Get Me
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/users/me"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get Current User

    Returns the profile of the authenticated user. `premiumAccess.active` reports effective full premium from the permanent role or a temporary `*` grant; `source` is `role`, `full-grant` or null, and `expiresAt` is the temporary grant expiration. Individual feature grants do not activate this global status and `role` is never changed by a grant.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "email": "johndoe@example.com",
          "role": "user",
          "premiumAccess": {
            "active": true,
            "source": "full-grant",
            "expiresAt": "2026-11-30T12:00:00.000Z"
          },
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png"
        }
      }
    }
    ```
