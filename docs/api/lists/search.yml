http:
    method: GET
    url: "{{BASE_URL}}/lists/search?query=resident"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Search Lists

    Search public lists by name.

    **Auth:** Bearer token required.

    **Rate Limit:** 50 requests per minute.

    Visibility: only lists the viewer may see are returned. A list is visible when its owner's profile (`profileVisibility`) and lists section (`listVisibility`) are visible to the viewer (friend = mutual follow) and the list is public. The filter runs in the query, so the result only holds visible lists.

    ### Query Parameters

    | Param | Type   | Required | Description          |
    |-------|--------|----------|----------------------|
    | query | string | Yes      | List name search: ignores case, accents and punctuation; every word must match, in any order; `%`, `_` and `\` are literal. A term without letters or digits returns an empty list |

    ### Response (200)

    ```json
    {
      "data": {
        "lists": [
          {
            "id": "uuid",
            "name": "Resident Evil",
            "description": "The full saga",
            "isPublic": true,
            "isOfficial": false,
            "scoreSource": "metacritic",
            "durationSource": "hltb",
            "previewItems": [
              {
                "id": "uuid",
                "game": {
                  "id": "uuid",
                  "code": "resident-evil-4",
                  "title": "Resident Evil 4",
                  "backgroundUrl": "https://…/re4.jpg"
                }
              }
            ]
          }
        ]
      }
    }
    ```

    `previewItems` holds the first items of the list by position (up to 4), used for the cover collage. `game` is `null` if the game was removed.
