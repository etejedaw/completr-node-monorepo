info:
    name: Get My Lists
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/lists/me"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Lists

    Returns all lists owned by the authenticated user with a frozen flag.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "lists": [
          {
            "id": "uuid",
            "name": "Saga Resident Evil",
            "description": "...",
            "isPublic": true,
            "isOfficial": false,
            "scoreSource": "metacritic",
            "durationSource": "hltb",
            "previewItems": [
              {
                "id": "uuid",
                "game": {
                  "id": "uuid",
                  "code": "resident-evil-4",
                  "title": "Resident Evil 4",
                  "backgroundUrl": "https://…/re4.jpg"
                }
              }
            ]
          }
        ],
        "frozen": false
      }
    }
    ```

    `frozen: true` means the user has exceeded their list limit and cannot create or edit until they delete the excess.

    `previewItems` holds the first items of the list by position (up to 4), used for the cover collage. `game` is `null` if the game was removed.
