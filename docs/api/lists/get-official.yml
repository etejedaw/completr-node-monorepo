info:
    name: Get Official Lists
    type: http
    seq: 9

http:
    method: GET
    url: "{{BASE_URL}}/lists/official?limit=12"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get Official Lists

    Returns the public lists of admins (official lists), newest first.

    **Auth:** Bearer token required.

    **Rate Limit:** 50 requests per minute.

    Visibility: only lists the viewer may see are returned. A list is visible when its owner's profile (`profileVisibility`) and lists section (`listVisibility`) are visible to the viewer (friend = mutual follow) and the list is public. The filter runs in the query, so `limit` applies to the visible lists.

    ### Query Parameters

    | Param | Type    | Required | Description                                  |
    |-------|---------|----------|----------------------------------------------|
    | limit | integer | No       | Number of lists to return, 1 to 50 (default 12) |

    ### Response (200)

    ```json
    {
      "data": {
        "lists": [
          {
            "id": "uuid",
            "name": "Resident Evil",
            "description": "The full saga",
            "isPublic": true,
            "isOfficial": true,
            "scoreSource": "metacritic",
            "durationSource": "hltb",
            "previewItems": []
          }
        ]
      }
    }
    ```

    ### Errors

    | Status | Type                    | Reason                                      |
    |--------|-------------------------|---------------------------------------------|
    | 422    | `COMMON_SCHEMA_INVALID` | `limit` is not an integer between 1 and 50, or an unknown parameter was sent |
