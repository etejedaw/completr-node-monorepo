info:
    name: Export List
    type: http
    seq: 10

http:
    method: GET
    url: "{{BASE_URL}}/lists/:listId/export?format=csv"
    params:
        - name: listId
          type: path
          value: ""
        - name: format
          value: csv
          type: query
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Export List

    Downloads every item of one of the authenticated user's own lists as a file: no pagination and no filters. `format=csv` is available to every role; `format=json` requires `premium`, `moderator` or `admin`.

    **Authentication:** Bearer token required. Only the owner of the list can export it.
    **Rate Limit:** 50 requests per minute.

    ### Path Params

    | Param  | Type | Required | Description |
    |--------|------|----------|-------------|
    | listId | uuid | Yes      | List UUID   |

    ### Query Params

    | Param  | Type   | Required | Description                         |
    |--------|--------|----------|-------------------------------------|
    | format | string | No       | `csv` (default) or `json` (premium) |

    ### Response (200)

    Headers:

    - `Content-Disposition: attachment; filename="completr-list-<slug-of-the-name>-YYYY-MM-DD.csv (`completr-list-YYYY-MM-DD.csv` when the name has no letters or digits)"` (date in UTC; exposed to the browser through CORS `Access-Control-Expose-Headers`)
    - `Content-Type: text/csv; charset=utf-8` for CSV, `application/json; charset=utf-8` for JSON

    CSV: UTF-8 BOM, a header row with the column names, comma separator, `\r\n` line endings and RFC 4180 quoting (fields with a comma, a quote or a line break are wrapped in double quotes, inner quotes are doubled). Text that starts with `=`, `+`, `-`, `@`, tab or carriage return is prefixed with `'` to prevent formula injection. `null` is an empty field. An empty collection returns only the header row.

    JSON: a bare array (not wrapped in `data`) with one object per row, the same keys as the CSV columns and native types. An empty collection returns `[]`.

    Rows are ordered by item `position` ascending.

    ### Columns

    | Column | Type | Description |
    |--------|------|-------------|
    | position | int | Position in the list, from 1 |
    | gameTitle | string | Game title |
    | gameCode | string | Game slug (`/games/:code`), useful to match the game on reimport |
    | score | number \| null | Score frozen when the game was added (from the list `scoreSource`) |
    | duration | number \| null | Duration frozen when the game was added (from the list `durationSource`) |
    | ratio | number \| null | Ratio of the item |
    | addedAt | string | ISO 8601 date-time the item was added |

    ```json
    [
      {
        "position": 1,
        "gameTitle": "Resident Evil 2",
        "gameCode": "resident-evil-2",
        "score": 4.5,
        "duration": 9,
        "ratio": 10,
        "addedAt": "2026-06-12T17:45:00.000Z"
      }
    ]
    ```

    ### Errors

    - 401 `AUTH_INVALID_TOKEN` — Invalid or expired token
    - 422 `AUTH_SCHEMA_INVALID` — Missing `Authorization` header
    - 422 `COMMON_SCHEMA_INVALID` — `format` is not `csv` or `json`
    - 402 `EXPORT_FORMAT_PREMIUM` — `format=json` requested by a `user` (free) account
    - 404 `LIST_NOT_FOUND` — The list does not exist or belongs to another user (even if it is public)
    - 422 `COMMON_SCHEMA_INVALID` — `listId` is not a UUID
