info:
    name: Export List
    type: http
    seq: 10

http:
    method: GET
    url: "{{BASE_URL}}/lists/:listId/export"
    params:
        - name: listId
          type: path
          value: ""
    headers:
        - name: Accept
          value: text/csv
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Export List

    Downloads every item of one of the authenticated user's own lists as a file. The list detail view has no filters or sort, so there are no query params.

    **Authentication:** Bearer token required. Only the owner of the list can export it.
    **Rate Limit:** 50 requests per minute.

    ### Path Params

    | Param  | Type | Required | Description |
    |--------|------|----------|-------------|
    | listId | uuid | Yes      | List UUID   |

    ### Format (content negotiation)

    The format is negotiated with the `Accept` header (Express `req.accepts(["text/csv", "application/json"])`); there is no `format` query param. Responses always carry `Vary: Accept`.

    | `Accept` | Result |
    |----------|--------|
    | missing, `*/*`, `text/*` or only wildcards | CSV (default) |
    | `text/csv`, or a list where `text/csv` wins | CSV |
    | `application/json`, or a list where it wins | JSON — `premium`, `moderator` or `admin` only |
    | neither acceptable (e.g. `text/html`) | 406 `EXPORT_FORMAT_NOT_ACCEPTABLE` |

    ### Response (200)

    Headers:

    - `Content-Disposition: attachment; filename="completr-list-<slug-of-the-name>-YYYY-MM-DD.csv (`completr-list-YYYY-MM-DD.csv` when the name has no letters or digits)"` (date in UTC; exposed to the browser through CORS `Access-Control-Expose-Headers`)
    - `Content-Type: text/csv; charset=utf-8` for CSV, `application/json; charset=utf-8` for JSON
    - `Vary: Accept`

    CSV: UTF-8 BOM, a header row with the column names, comma separator, `\r\n` line endings and RFC 4180 quoting (fields with a comma, a quote or a line break are wrapped in double quotes, inner quotes are doubled). Text that starts with `=`, `+`, `-`, `@`, tab or carriage return is prefixed with `'` to prevent formula injection. `null` is an empty field. An empty result returns only the header row.

    JSON: a bare array (not wrapped in `data`) with one object per row, the same keys as the CSV columns and native types. An empty result returns `[]`.

    Rows are ordered by item `position` ascending.

    ### Columns

    | Column | Type | Description |
    |--------|------|-------------|
    | position | int | Position in the list, from 1 |
    | gameTitle | string | Game title |
    | score | number \| null | Score frozen when the game was added (from the list `scoreSource`) |
    | duration | number \| null | Duration frozen when the game was added (from the list `durationSource`) |
    | ratio | number \| null | Ratio of the item |
    | addedAt | string | ISO 8601 date-time the item was added |

    ```json
    [
      {
        "position": 1,
        "gameTitle": "Resident Evil 2",
        "score": 4.5,
        "duration": 9,
        "ratio": 10,
        "addedAt": "2026-06-12T17:45:00.000Z"
      }
    ]
    ```

    ### Errors

    - 401 `AUTH_INVALID_TOKEN` — Invalid or expired token
    - 422 `AUTH_SCHEMA_INVALID` — Missing `Authorization` header
    - 422 `COMMON_SCHEMA_INVALID` — `listId` is not a UUID
    - 402 `EXPORT_FORMAT_PREMIUM` — JSON negotiated by a `user` (free) account
    - 406 `EXPORT_FORMAT_NOT_ACCEPTABLE` — `Accept` allows neither `text/csv` nor `application/json`
    - 404 `LIST_NOT_FOUND` — The list does not exist or belongs to another user (even if it is public)
