info:
    name: Get List by ID
    type: http
    seq: 3

http:
    method: GET
    url: "{{BASE_URL}}/lists/:listId"
    params:
        - name: listId
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get List by ID

    Returns a list with all its items, scores, ratios, and follower data. If the user is authenticated, includes `backlogStatus` per item and `isFollowing`.

    **Authentication:** Optional (Bearer token). Unauthenticated users get `backlogStatus: null` and `isFollowing: false`.
    **Rate Limit:** 100 requests per minute (public).

    Visibility: a viewer who is not the owner sees the list only when the owner's profile is visible to them (`profileVisibility`; friend = mutual follow), the lists section is visible to them (`listVisibility`) and the list is public (`isPublic`). The owner always sees their own lists. Otherwise it answers 404 `LIST_NOT_FOUND`, the same as a list that does not exist.

    ### Path Params

    | Param  | Type | Required | Description |
    |--------|------|----------|-------------|
    | listId | uuid | Yes      | List UUID   |

    ### Response (200)

    ```json
    {
      "data": {
        "list": {
          "id": "uuid",
          "name": "Saga Resident Evil",
          "description": "...",
          "isPublic": true,
          "isOfficial": false,
          "owner": { "username": "andres" },
          "scoreSource": "metacritic",
          "durationSource": "hltb",
          "followerCount": 12,
          "isFollowing": true,
          "items": [
            {
              "id": "uuid",
              "position": 1,
              "score": 89,
              "duration": 6,
              "ratio": 14.83,
              "game": {
                "id": "uuid",
                "title": "Resident Evil 2",
                "coverUrl": "...",
                "isDlc": false
              },
              "backlogStatus": "completed",
              "realDuration": 14.5,
              "personalRatio": 122.76
            }
          ]
        }
      }
    }
    ```

    `backlogStatus`: `completed` | `playing` | `endless` | `not_started` | `abandoned` | `null` (not in backlog). When the viewer has several entries for the game, the status is picked by priority: `completed`, then `playing` / `endless`, then `abandoned`, then `not_started`.

    `realDuration` and `personalRatio` are taken from the viewer's most recent backlog entry for the game. `personalRatio = (score / realDuration) * 20`. Both are `null` when missing, and `ratio` is `null` when the source has no score or duration.
