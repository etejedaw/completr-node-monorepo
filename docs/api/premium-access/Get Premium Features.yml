info:
    name: Get Premium Features
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/admin/premium-features"

settings:
    encodeUrl: true

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Get Premium Features

    Returns the catalog of individual premium features available for grants. Full premium (`*`) is a separate grant value and is not included in this list.

    **Authentication:** Bearer token, admin only. Other roles receive 404 `AUTH_ROUTE_NOT_FOUND`.

    ### Response (200)

    ```json
    {
      "data": {
        "features": [
          {
            "feature": "export.json",
            "allowsExpiration": true,
            "allowsGlobalGrant": true
          },
          {
            "feature": "rewind.premium",
            "allowsExpiration": true,
            "allowsGlobalGrant": true
          }
        ]
      }
    }
    ```
