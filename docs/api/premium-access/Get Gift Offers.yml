info:
    name: Get Gift Offers
    type: http
    seq: 6

http:
    method: GET
    url: "{{BASE_URL}}/users/me/gift-offers"

settings:
    encodeUrl: true

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Get Gift Offers

    Lists the gift offers visible to the authenticated user and their server-resolved state. Current offers are `json-export-trial-1m` (`export.json`) and `premium-trial-1m` (`*`), both for 30 days.

    **Authentication:** Bearer token required.

    ### Response (200)

    ```json
    {
      "data": {
        "offers": [
          {
            "code": "json-export-trial-1m",
            "feature": "export.json",
            "durationDays": 30,
            "status": "available",
            "expiresAt": null,
            "canActivate": true,
            "hasAccess": false
          },
          {
            "code": "premium-trial-1m",
            "feature": "*",
            "durationDays": 30,
            "status": "active",
            "expiresAt": "2026-11-30T12:00:00.000Z",
            "canActivate": false,
            "hasAccess": true
          }
        ]
      }
    }
    ```

    `status` is `available`, `active`, `used`, `expired` or `not-eligible`. `canActivate` is true only for `available`. `hasAccess` reports current access to the offer feature from any source, including a role or another grant.
