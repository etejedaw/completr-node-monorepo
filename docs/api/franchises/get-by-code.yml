info:
    name: Get Franchise by Code
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/franchises/:code?limit=24&offset=0"
    auth: inherit
    params:
        - name: code
          value: resident-evil
          type: path
        - name: limit
          value: "24"
          type: query
        - name: offset
          value: "0"
          type: query

settings:
    encodeUrl: true

docs: |-
    ## Get Franchise by Code

    Returns a franchise, its games (paginated), and the viewer's progress across the whole franchise. Each game includes the viewer's `backlogStatus` for that game (`null` if not tracked, or when unauthenticated). Powers the `/franchises/:code` page.

    `progress.total` is the count of all active games in the franchise; `progress.completed` counts the games the viewer has in status `completed`, `abandoned` or `endless`. When unauthenticated, `completed` is `0` and every `backlogStatus` is `null`.

    **Authentication:** optional (Bearer token). Progress and per-game status require auth.
    **Rate Limit:** 100 requests per minute (public).

    ### Path Params

    | Param | Type   | Required | Description             |
    |-------|--------|----------|-------------------------|
    | code  | string | Yes      | Franchise slug          |

    ### Query Params

    | Param  | Type    | Required | Default | Description        |
    |--------|---------|----------|---------|--------------------|
    | limit  | integer | No       | 50      | Page size (1–100)  |
    | offset | integer | No       | 0       | Page offset        |

    ### Response (200)

    ```json
    {
      "data": {
        "franchise": {
          "id": "uuid",
          "name": "Resident Evil",
          "code": "resident-evil",
          "description": "Survival horror saga by Capcom.",
          "createdAt": "2026-07-06T00:00:00.000Z",
          "updatedAt": "2026-07-06T00:00:00.000Z"
        },
        "games": [
          {
            "id": "uuid",
            "title": "Resident Evil 2 (2019)",
            "code": "resident-evil-2-2019",
            "backgroundUrl": "https://example.com/bg.jpg",
            "backlogStatus": "completed"
          }
        ],
        "progress": { "completed": 3, "total": 6 },
        "hasMore": false
      }
    }
    ```

    `games[]` entries use the standard game serializer plus a `backlogStatus` field.

    ### Errors

    | Status | Code                  | Description                       |
    |--------|-----------------------|-----------------------------------|
    | 404    | FRANCHISE_NOT_FOUND   | No franchise with that code       |
    | 422    | COMMON_SCHEMA_INVALID | `code`, `limit` or `offset` fails |
