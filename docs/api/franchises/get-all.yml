info:
    name: Get All Franchises
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/franchises?search=&limit=100&offset=0"
    auth: none
    params:
        - name: search
          value: ""
          type: query
        - name: limit
          value: "100"
          type: query
        - name: offset
          value: "0"
          type: query

settings:
    encodeUrl: true

docs: |-
    ## Get All Franchises

    Returns franchises ordered by name, with optional name search and pagination. Each franchise carries its count of active games, a preview of up to 4 of its active games (earliest release first) and whether the viewer tracks it. Powers the Discover `/franchises` page, the admin franchise picker and the management list.

    **Authentication:** optional (Bearer token). Without a valid token every `isTracked` is `false`; an invalid token is treated as an anonymous visitor.
    **Rate Limit:** 100 requests per minute (public).

    ### Query Params

    | Param  | Type    | Required | Default | Description                          |
    |--------|---------|----------|---------|--------------------------------------|
    | search | string  | No       | —       | Accent-, case- and punctuation-insensitive; every word must match, in any order; `%`, `_` and `\` are matched literally on `name`. A value without letters or digits does not filter |
    | limit  | integer | No       | —       | Page size (1–100)                    |
    | offset | integer | No       | —       | Page offset                          |

    ### Response (200)

    ```json
    {
      "data": {
        "franchises": [
          {
            "id": "uuid",
            "name": "Resident Evil",
            "code": "resident-evil",
            "description": "Survival horror saga by Capcom.",
            "gameCount": 12,
            "isTracked": true,
            "previewGames": [
              {
                "id": "uuid",
                "code": "resident-evil",
                "title": "Resident Evil",
                "backgroundUrl": "https://media.rawg.io/media/games/resident-evil.jpg"
              }
            ]
          }
        ],
        "total": 1
      }
    }
    ```

    `gameCount` counts only active games. The response carries no personal progress.

    ### Errors

    | Status | Code                  | Description                    |
    |--------|-----------------------|--------------------------------|
    | 422    | COMMON_SCHEMA_INVALID | A query param fails validation |
