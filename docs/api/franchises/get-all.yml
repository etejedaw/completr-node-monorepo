info:
    name: Get All Franchises
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/franchises?search=&limit=100&offset=0"
    auth: inherit
    params:
        - name: search
          value: ""
          type: query
        - name: limit
          value: "100"
          type: query
        - name: offset
          value: "0"
          type: query

settings:
    encodeUrl: true

docs: |-
    ## Get All Franchises

    Returns franchises ordered by name, with optional case-insensitive name search and pagination. Powers the admin franchise picker and management list.

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute (public).

    ### Query Params

    | Param  | Type    | Required | Default | Description                          |
    |--------|---------|----------|---------|--------------------------------------|
    | search | string  | No       | —       | Case-insensitive match on `name`     |
    | limit  | integer | No       | —       | Page size (1–100)                    |
    | offset | integer | No       | —       | Page offset                          |

    ### Response (200)

    ```json
    {
      "data": {
        "franchises": [
          {
            "id": "uuid",
            "name": "Resident Evil",
            "code": "resident-evil",
            "description": "Survival horror saga by Capcom.",
            "createdAt": "2026-07-06T00:00:00.000Z",
            "updatedAt": "2026-07-06T00:00:00.000Z"
          }
        ],
        "total": 1
      }
    }
    ```

    ### Errors

    | Status | Code                  | Description                       |
    |--------|-----------------------|-----------------------------------|
    | 422    | AUTH_SCHEMA_INVALID   | Missing or malformed Bearer token |
    | 422    | COMMON_SCHEMA_INVALID | A query param fails validation    |
