info:
    name: Create Franchise
    type: http
    seq: 3

http:
    method: POST
    url: "{{BASE_URL}}/franchises"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "name": "Resident Evil",
              "description": "Survival horror saga by Capcom.",
              "gameIds": ["uuid"]
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Franchise

    Creates a franchise. The `code` slug is derived from `name`. When `gameIds` is sent, the franchise and the game links are created in a single transaction: if any game does not exist, nothing is applied.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field       | Type          | Required | Description        |
    |-------------|---------------|----------|--------------------|
    | name        | string        | Yes      | Max 100 characters |
    | description | string / null | No       | Max 500 characters |
    | gameIds     | uuid[]        | No       | Final set of games of the franchise (max 500) |

    ### Response (201)

    ```json
    {
      "data": {
        "franchise": {
          "id": "uuid",
          "name": "Resident Evil",
          "code": "resident-evil",
          "description": "Survival horror saga by Capcom.",
          "createdAt": "2026-07-06T00:00:00.000Z",
          "updatedAt": "2026-07-06T00:00:00.000Z"
        }
      }
    }
    ```

    ### Errors

    | Status | Code                       | Description                          |
    |--------|----------------------------|--------------------------------------|
    | 403    | AUTH_FORBIDDEN             | Authenticated user is not a moderator |
    | 404    | FRANCHISE_GAMES_NOT_FOUND | Some `gameIds` do not exist (context lists them) |
    | 409    | FRANCHISE_UNIQUE_CONSTRAINT | Name or code already exists          |
    | 400    | FRANCHISE_VALIDATION_ERROR | Invalid field values                 |
    | 422    | COMMON_SCHEMA_INVALID     | Body fails schema validation         |
