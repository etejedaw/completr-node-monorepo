info:
    name: Untrack Franchise
    type: http
    seq: 7

http:
    method: DELETE
    url: "{{BASE_URL}}/franchises/:code/track"
    auth: inherit
    params:
        - name: code
          value: resident-evil
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Untrack Franchise

    Removes the authenticated user's tracking of the franchise, so it no longer appears on their profile. Idempotent — untracking a franchise that isn't tracked is a no-op.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Path Params

    | Param | Type   | Required | Description    |
    |-------|--------|----------|----------------|
    | code  | string | Yes      | Franchise slug |

    ### Response (204)

    No content.

    ### Errors

    | Status | Code                | Description                       |
    |--------|---------------------|-----------------------------------|
    | 404    | FRANCHISE_NOT_FOUND | No franchise with that code       |
    | 422    | AUTH_SCHEMA_INVALID | Missing or malformed Bearer token |
