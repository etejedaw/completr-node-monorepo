info:
    name: Refresh Token
    type: http
    seq: 4

http:
    method: POST
    url: "{{BASE_URL}}/auth/refresh"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {}

runtime:
    scripts:
        - type: after-response
          code: |-
              bru.setVar("TOKEN", res.body.data.access_token);
              bru.setVar("SESSION_ID", res.body.data.session_id);

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5

docs: |-
    ## Refresh Token

    Exchanges the refresh token (sent automatically via cookie) for a new access token and a new refresh token (rotation). The old refresh token is invalidated after use.

    **Auth:** None (the refresh token cookie itself authenticates the request).

    **Rate Limit:** 5 requests per minute, 15-minute block after exhaustion.

    ### Request

    The refresh token is read from the `refresh_token` cookie set during login/register. Bruno's cookie jar attaches it automatically.

    For non-browser clients that can't use cookies, the request body may include `{ "refresh_token": "..." }` as a fallback. The cookie takes precedence when both are present.

    ### Response (200)

    Sets a new rotating `refresh_token` cookie (same attributes as login).

    ```json
    {
      "data": {
        "access_token": "new_jwt_token",
        "session_id": "uuid"
      }
    }
    ```

    ### Errors

    | Status | Code                        | Description                                |
    |--------|-----------------------------|--------------------------------------------|
    | 401    | AUTH_INVALID_REFRESH_TOKEN  | Token is missing, invalid, expired or used |
    | 429    | AUTH_RATE_LIMITED           | Too many requests                          |
