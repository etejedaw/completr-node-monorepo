info:
    name: Change Password
    type: http
    seq: 2

http:
    method: PATCH
    url: "{{BASE_URL}}/auth/password"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "password": "NewPass1+"
            }
    auth:
        type: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5

docs: |-
    ## Change Password

    Changes the authenticated user's password.

    **Authentication:** Bearer token required.
    **Rate Limit:** 5 requests per minute, 15-minute block after exhaustion.

    ### Request Body

    | Field    | Type   | Required | Description                                        |
    |----------|--------|----------|----------------------------------------------------|
    | password | string | Yes      | 8-15 chars, uppercase, lowercase, number, special  |

    ### Response (204)

    No content.
