info:
    name: Change Password
    type: http
    seq: 3

http:
    method: PATCH
    url: "{{baseUrl}}/auth/password"
    headers:
        - name: Content-Type
          value: application/json
    auth:
        type: bearer
        token: "{{token}}"
    body:
        type: json
        data: |-
            {
              "password": "NewPass1+"
            }

settings:
    encodeUrl: true

docs: |-
    ## Change Password

    Changes the authenticated user's password.

    **Authentication:** Bearer token required.
    **Rate Limit:** 5 requests per minute, 15-minute block after exhaustion.

    ### Request Body

    | Field    | Type   | Required | Description                                        |
    |----------|--------|----------|----------------------------------------------------|
    | password | string | Yes      | 8-15 chars, uppercase, lowercase, number, special  |

    ### Response (204)

    No content.
