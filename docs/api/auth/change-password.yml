info:
    name: Change Password
    type: http
    seq: 2

http:
    method: PATCH
    url: "{{BASE_URL}}/auth/password"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "currentPassword": "{{process.env.PASSWORD}}",
              "password": "NewPass1+"
            }
    auth: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5

docs: |-
    ## Change Password

    Changes the authenticated user's password after checking the current one. The check and both writes (new password, revoked sessions) run in one transaction: of two simultaneous changes with the same current password only one succeeds.

    **Authentication:** Bearer token required.
    **Rate Limit:** 5 requests per minute, 15-minute block after exhaustion.

    ### Request Body

    | Field           | Type   | Required | Description                                        |
    |-----------------|--------|----------|----------------------------------------------------|
    | currentPassword | string | Yes      | The password in use, 1-128 chars                   |
    | password        | string | Yes      | 8-15 chars, uppercase, lowercase, number, special  |

    ### Response (204)

    No content. Every refresh token of the user is revoked, so all devices must sign in again.

    ### Errors

    - `400 AUTH_INVALID_CURRENT_PASSWORD` — `currentPassword` does not match. Nothing changes and the sessions stay alive.
    - `401 AUTH_INVALID_TOKEN` — the access token is invalid, expired or its account no longer exists.
    - `422 AUTH_SCHEMA_INVALID` — missing or malformed `Authorization` header.
    - `422 COMMON_SCHEMA_INVALID` — the body is missing a field, has extra fields or `password` breaks the policy.
    - `429 AUTH_RATE_LIMITED` — too many attempts.
