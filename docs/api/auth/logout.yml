docs: |-
    ## Logout

    Invalidates the current refresh token (taken from the `refresh_token` cookie) and clears the cookie. The access token remains valid until it expires naturally.

    **Auth:** None (the refresh token cookie identifies the session).

    ### Request

    The refresh token is read from the `refresh_token` cookie. For non-browser clients, `{ "refresh_token": "..." }` in the body is accepted as fallback.

    ### Response (204)

    No content. The `refresh_token` cookie is cleared.
