info:
    name: Register
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/auth/register"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "username": "johndoe",
              "email": "johndoe@example.com",
              "password": "Qwerty1+",
              "name": "John Doe",
              "bio": "Gamer since 1990",
              "avatarUrl": "https://example.com/avatar.png"
            }

settings:
    encodeUrl: true

docs: |-
    ## Register User

    Creates a new user account.

    **Rate Limit:** 3 requests per minute.

    ### Request Body

    | Field       | Type   | Required | Description                                        |
    |-------------|--------|----------|----------------------------------------------------|
    | username    | string | Yes      | 4-15 characters, will be converted to lowercase    |
    | email       | string | Yes      | Valid email, will be converted to lowercase         |
    | password    | string | Yes      | 8-15 chars, uppercase, lowercase, number, special  |
    | name        | string | Yes      | 4-80 characters                                    |
    | bio         | string | No       | Max 250 characters                                 |
    | avatarUrl   | string | No       | Valid URL                                           |

    ### Response (201)

    ```json
    {
      "data": {
        "user": {
          "id": "uuid",
          "username": "johndoe",
          "email": "johndoe@example.com",
          "role": "user",
          "name": "John Doe",
          "bio": "Gamer since 1990",
          "avatarUrl": "https://example.com/avatar.png"
        },
        "access_token": "jwt_token",
        "refresh_token": "opaque_token"
      }
    }
    ```
