info:
    name: Reset Password
    type: http
    seq: 10

http:
    method: POST
    url: "{{BASE_URL}}/auth/reset-password"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "token": "<64-char hex token from the reset email>",
              "password": "NewPass1+"
            }

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5

docs: |-
    ## Reset Password

    Sets a new password using the token from the reset email. The token is consumed on success, and every session of the user is closed (all refresh tokens are revoked), so the user has to log in again.

    **Authentication:** None.
    **Rate Limit:** 5 requests per minute, 15-minute block after exhaustion.

    ### Request Body

    | Field    | Type   | Required | Description                                       |
    |----------|--------|----------|---------------------------------------------------|
    | token    | string | Yes      | 64-char hex token from the reset link             |
    | password | string | Yes      | 8-15 chars, uppercase, lowercase, number, special |

    ### Response (204)

    No content.

    ### Errors

    | Status | Type                              | When                                     |
    |--------|-----------------------------------|------------------------------------------|
    | 422    | COMMON_SCHEMA_INVALID             | Malformed token or password out of policy |
    | 400    | AUTH_INVALID_PASSWORD_RESET_TOKEN | Token unknown, expired or already used   |
    | 429    | AUTH_RATE_LIMITED                 | Rate limit exceeded                      |
