info:
    name: Forgot Password
    type: http
    seq: 9

http:
    method: POST
    url: "{{BASE_URL}}/auth/forgot-password"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "email": "user@example.com"
            }

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5

docs: |-
    ## Forgot Password

    Requests a password reset link by email. The response is the same whether or not the email belongs to an active account, so it never reveals which emails are registered. If it does, the account receives an email with a link to `{WEB_APP_URL}/reset-password?token=<token>`. The token is single-use, expires after `PASSWORD_RESET_TOKEN_TTL_MINUTES` (default 60) and replaces any previous unused token of the same user.

    **Authentication:** None.
    **Rate Limit:** 3 requests per 15 minutes.

    ### Request Body

    | Field | Type   | Required | Description             |
    |-------|--------|----------|-------------------------|
    | email | string | Yes      | Account email (lowered) |

    ### Response (204)

    No content.

    ### Errors

    | Status | Type                  | When                                   |
    |--------|-----------------------|----------------------------------------|
    | 422    | COMMON_SCHEMA_INVALID | Invalid email                          |
    | 429    | AUTH_RATE_LIMITED     | Rate limit exceeded                    |
    | 503    | MAIL_DISABLED         | No SMTP server configured (`SMTP_HOST`) |
