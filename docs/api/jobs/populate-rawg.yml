info:
    name: Start Populate RAWG
    type: http
    seq: 2

http:
    method: POST
    url: "{{BASE_URL}}/admin/jobs/populate-rawg?limit=100"
    auth: inherit
    params:
        - name: limit
          type: query
          value: "100"
          enabled: false

settings:
    encodeUrl: true

docs: |-
    ## Start Populate RAWG

    Background job that walks the active games without a RAWG external ID, looks them up by
    slug in RAWG, and persists the external mapping. Throttled to ~1 request/second. Idempotent
    — only one `populate_rawg` job can be running or pending at a time.

    **Authentication:** Hidden route — admin/moderator only.
    **Rate Limit:** 50 requests per minute (user).

    ### Query Params

    | Param | Type | Required | Description                                              |
    |-------|------|----------|----------------------------------------------------------|
    | limit | int  | No       | Max number of games to process this run. Omit for all.   |

    ### Response (202)

    ```json
    {
      "data": {
        "job": {
          "id": "uuid",
          "type": "populate_rawg",
          "status": "running"
        }
      }
    }
    ```

    The job runs asynchronously. Poll `GET /admin/jobs` to see its `status` and `result`.

    ### Behavior while running

    - A game RAWG does not know (404 `RAWG_NOT_FOUND`) is counted as not found and the job continues.
    - Any other RAWG failure (429 rate limit, 5xx, network, unreadable body) stops the job at once and leaves it in `failed`. The remaining games are not attempted.
    - Cancelling the job works as before.

    ### Result string

    - Completed: `Processed: X, Not found: N, Skipped: Z, Total: T`
    - Cancelled: `Cancelled after X processed. Not found: N`
    - Failed: `Failed after X processed, N not found. Reason: <reason>`, where `<reason>` is the error code (for example `RAWG_RATE_LIMITED`, or `RAWG_REQUEST_ERROR: RAWG API returned 500: ...`) or the network error message.

    ### Errors

    - 503 `RAWG_DISABLED` — `RAWG_API_KEY` is not configured on the server; the job is not started
