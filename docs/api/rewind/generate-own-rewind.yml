info:
    name: Generate Own Rewind
    type: http
    seq: 3

http:
    method: POST
    url: "{{BASE_URL}}/users/me/rewinds/:year"
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "language": "es",
              "includePrivateRuns": false,
              "includeNotes": false,
              "expectedGeneratedAt": null
            }
    auth: inherit
    params:
        - name: year
          value: "2026"
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Generate Own Rewind

    Generates (activates) or regenerates the Rewind of the signed-in user for one year. Until the owner generates a year, nobody else can see it. Generating stores a row in `Rewinds` with the language, whether private runs feed the AI recap and the premium stats, whether the run notes feed the AI recap, the generation date, the rolls left and whether the grace was used. The base numbers (totals, highlights, finished games) are still computed live for each viewer.

    The year must be open and have data for the owner counting every run (public and private), with the same rules as `GET /users/:username/rewinds`. Generating and regenerating also need an open edition (today between `RewindEditions.opensAt` and `closesAt`, UTC days, both included). The edition year can be generated by anyone; a previous year (from the sign-up year to the edition year minus one) only with full premium (premium, moderator or admin role, or a full premium grant; a specific Rewind grant does not count). A year that was not generated during the period cannot be generated after it closes.

    **Authentication:** Bearer token required (roles: user, premium, moderator, admin).
    **Rate Limit:** 5 requests every 10 minutes (shared with `POST /users/me/rewinds/:year/ai-recap`).

    ### Path Params

    | Param | Type    | Required | Description                                   |
    |-------|---------|----------|-----------------------------------------------|
    | year  | integer | Yes      | Calendar year, digits only, from 2000 to 2100 |

    ### Request Body

    | Field               | Type             | Required | Description                                                                                 |
    |---------------------|------------------|----------|---------------------------------------------------------------------------------------------|
    | language            | `en` \| `es`     | Yes      | Language the Rewind page and its share images are shown in, for every viewer                |
    | includePrivateRuns  | boolean          | Yes      | Feed private runs to the AI recap and the premium stats. Does not change the live numbers   |
    | includeNotes        | boolean          | Yes      | Feed the notes of the runs the AI already reads to the AI recap only. Never returned        |
    | expectedGeneratedAt | ISO date \| null | Yes      | `null` for the first generation; the current `generatedAt` to regenerate                    |

    Unknown fields are rejected.

    - **First generation:** no row and `expectedGeneratedAt: null` → 201.
    - **Rolls:** every AI generation spends one roll: the first generation with access, each regeneration and `POST /users/me/rewinds/:year/ai-recap`. The first time a Rewind uses the AI it gets the quota of the open edition: `premiumRegenerations` with full premium, `giftRegenerations` with a specific Rewind grant. That quota is fixed (`premiumAccessKind` records which one) and does not change if the access changes later. With access but a quota of 0 the base is created without calling the AI.
    - **Regeneration:** `expectedGeneratedAt` equal to the stored `generatedAt` → 200, with new options. Needs `rewind.premium` access; without it the options stay fixed and the request gets 402. Inside the grace window of the edition (`graceStartsAt` to `graceEndsAt`) and only for the edition year, one extra AI generation is spent first without using a roll (`graceUsed`). With no grace and no rolls left → 409 `REWIND_REGENERATION_LIMIT`.
    - **AI failure:** if the AI recap or the premium stats fail, the roll or the grace spent is given back.
    - **Concurrency:** the row is locked while the counters change, so of two simultaneous requests with the same `expectedGeneratedAt` exactly one wins; the other gets 409 `REWIND_GENERATION_CONFLICT` and spends nothing. A double click behaves the same way.
    - **Owner with `rewind.premium` access:** access can come from a premium role, temporary full premium or a specific Rewind grant. After the counters are saved, the AI recap and the premium stats are generated from the public runs, or from every run with `includePrivateRuns`. If the AI fails the request still succeeds with `ownerControls.aiRecapState: "failed"`; retry with `POST /users/me/rewinds/:year/ai-recap`.
    - **Notes:** with `includeNotes`, the AI input gets each run's notes (whitespace collapsed, cut at 300 characters); without `includePrivateRuns`, only the notes of public runs. Notes never change the live numbers or the premium stats, and no response includes them. The choice is stored as `ownerControls.includesNotes` and reused by `POST /users/me/rewinds/:year/ai-recap`.
    - **Owner without access:** the first generation creates the base with no AI call; an AI recap and premium stats stored while the owner had access are kept, and so are the rolls left, but they cannot be used until the access comes back.

    ### Response (201 / 200)

    The Rewind as the owner sees it (same shape as `GET /users/:username/rewinds/:year`, with `ownerControls`).

    ```json
    {
      "data": {
        "year": 2026,
        "persona": "marathoner",
        "language": "es",
        "generatedAt": "2026-12-15T18:42:07.123Z",
        "design": "2026",
        "frozenAt": null,
        "aiRecap": null,
        "premiumStats": null,
        "premiumAccessKind": null,
        "ownerControls": {
          "includesPrivateRuns": false,
          "includesNotes": false,
          "regenerationsLeft": 0,
          "graceEndsAt": null,
          "canRegenerate": false,
          "aiRecapState": "unavailable",
          "periodOpen": true,
          "periodStatus": "open",
          "closesAt": "2027-01-31",
          "frozenAt": null
        },
        "premiumAccess": {
          "allowed": false,
          "source": null,
          "expiresAt": null
        }
      }
    }
    ```

    ### Errors

    | Status | Code                       | Description                                                                 |
    |--------|----------------------------|-----------------------------------------------------------------------------|
    | 401    | AUTH_INVALID_TOKEN         | Invalid or expired token                                                    |
    | 403    | AUTH_FORBIDDEN             | Role not allowed                                                            |
    | 404    | USER_NOT_FOUND             | The signed-in user is no longer active                                      |
    | 402    | REWIND_AI_RECAP_PREMIUM_REQUIRED | Regeneration without `rewind.premium` access                          |
    | 403    | REWIND_YEAR_REQUIRES_PREMIUM | A previous year without full premium (premium role or full grant)        |
    | 404    | REWIND_NOT_FOUND           | The year is not open, is before the sign-up or has no data                  |
    | 409    | REWIND_PERIOD_CLOSED       | No Rewind edition is open today                                             |
    | 409    | REWIND_GENERATION_CONFLICT | `expectedGeneratedAt` does not match the stored generation (or the row exists and it is `null`, or no row exists and it is not `null`) |
    | 409    | REWIND_REGENERATION_LIMIT  | No grace and no rolls left                                                  |
    | 422    | AUTH_SCHEMA_INVALID        | Missing or malformed `Authorization` header                                 |
    | 422    | COMMON_SCHEMA_INVALID      | Bad `year` or body (unknown language, non-boolean flag, bad date, extra fields) |
    | 429    | AUTH_RATE_LIMITED          | Too many generations                                                        |
