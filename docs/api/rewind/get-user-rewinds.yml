info:
    name: Get User Rewinds
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/rewinds"
    auth: inherit
    params:
        - name: username
          value: ""
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User Rewinds

    Lists the yearly Rewinds of `:username`: one summary per year with data, newest first, plus the year in the spotlight window. Powers the Rewind spotlight and the Rewind row of a profile, and the `/user/:username/rewind` archive.

    A year is listed when it is open and has data. A year is open when it is a past year, or the year of the latest Rewind edition that has already opened (`RewindEditions.opensAt` on or before today, UTC), and it is not earlier than the year the user signed up (`createdAt`, UTC): years before the sign-up (imported history) are never listed. It has data when at least one run has `startedAt` in the year, or is `completed` / `abandoned` with `finishedAt` in the year. Years outside 2000-2100 are never listed. Outside production, the `REWIND_TODAY` environment variable (`YYYY-MM-DD`) replaces today in every Rewind calculation.

    **Activation:** the owner sees every open year with data, each with `isGenerated`. Everyone else only sees the years the owner generated with `POST /users/me/rewinds/:year`.

    The owner sees every run. Everyone else gets the summaries built from public runs only (`isPublic = true`), so a year that only has private runs is not listed for them. A frozen year (see `GET /users/:username/rewinds/:year`) is listed as it was at the close of its period: its summary (`persona`, counts, hours and `covers`) comes from the snapshot view of the viewer, so later runs or privacy changes do not move it, and a year that had no public runs at the close is not listed for visitors. Its `persona` follows the current access of the viewer to the platinums section, as for live years. The rest of the years are computed live. For non-self viewers the target's `rewind` section must be visible (`rewindVisibility`: `friends` only for mutual followers, `private` only for the owner) and so must the `profile` section (`profileVisibility`), unless the owner turned on `rewindIgnoresProfileVisibility` (`PATCH /users/me`): then only `rewindVisibility` counts and the profile stays restricted. The persona of a year that would need the platinums is replaced for viewers without access to both the profile and the platinums section.

    **Authentication:** optional (Bearer token). Required to see a Rewind whose privacy needs it.
    **Rate Limit:** 300 requests per minute (public).

    ### Path Params

    | Param    | Type   | Required | Description      |
    |----------|--------|----------|------------------|
    | username | string | Yes      | Profile username |

    ### Response (200)

    As the owner sees it; visitors get `"premiumAccess": null`.

    ```json
    {
      "data": {
        "spotlightYear": 2026,
        "period": {
          "status": "open",
          "year": 2026,
          "opensAt": "2026-12-01",
          "closesAt": "2027-01-31"
        },
        "premiumAccess": {
          "allowed": true,
          "source": "feature-grant",
          "expiresAt": "2027-01-31T23:59:59.999Z"
        },
        "years": [
          {
            "year": 2026,
            "isGenerated": true,
            "generationBlockedBy": null,
            "persona": "marathoner",
            "finishedCount": 18,
            "startedCount": 23,
            "hoursPlayed": 212.5,
            "covers": [
              {
                "gameId": "uuid",
                "code": "hades",
                "title": "Hades",
                "coverUrl": "https://media.example.com/hades.jpg",
                "backgroundUrl": "https://media.example.com/hades-bg.jpg"
              }
            ]
          }
        ]
      }
    }
    ```

    - `spotlightYear`: the year of the edition whose period (`opensAt` to `closesAt`, both included, UTC days) contains today, only if that year is in `years`; `null` otherwise, also when no edition is open. For visitors it is `null` until the owner generates that year.
    - `period`: the Rewind period, the same for every viewer, computed with the server date (`REWIND_TODAY` outside production). `status` is `open` when an edition is open today (that edition), else `scheduled` (the next edition, even if an earlier one already closed), else `closed` (the last edition that closed). `null` when no edition exists. `year`, `opensAt` and `closesAt` (`YYYY-MM-DD`, UTC days) describe the edition it refers to.
    - `premiumAccess`: only for the owner, `null` for everyone else. The owner's current access to `rewind.premium`, with `allowed`, `source` (`role`, `full-grant`, `feature-grant` or null) and `expiresAt`. It lets the client configure the first generation before a Rewind row exists.
    - `isGenerated`: whether the owner generated the year. Always `true` for visitors, who never get ungenerated years.
    - `generationBlockedBy`: why the owner cannot generate that year now. Only computed for the owner and for years not generated yet; `null` for generated years and for every visitor. `period-closed` when no edition is open today; `requires-premium` when an edition is open, the year is before the edition year and the owner has no full premium (a specific Rewind grant does not count); `null` when the year can be generated.
    - `persona`: the title of the year, computed with the same rules as `persona` in `GET /users/:username/rewinds/:year` and the same data the viewer gets there (platinums only count for viewers who can see them).
    - `finishedCount` / `startedCount`: distinct games finished (`completed` with `finishedAt` in the year) and started (`startedAt` in the year).
    - `hoursPlayed`: sum of `realDuration` of the `completed` and `abandoned` runs with `finishedAt` in the year, rounded to 1 decimal.
    - `covers`: up to 5 finished games, best `userRating` first, then the most recently finished. A game finished twice counts once, with its latest run.
    - `years` is empty when there is nothing to show.

    ### Errors

    | Status | Code                  | Description                                     |
    |--------|-----------------------|-------------------------------------------------|
    | 403    | USER_PRIVATE          | Rewind section not visible, or profile not visible without `rewindIgnoresProfileVisibility` |
    | 404    | USER_NOT_FOUND        | No active user with that username               |
    | 422    | COMMON_SCHEMA_INVALID | `username` fails validation                     |
