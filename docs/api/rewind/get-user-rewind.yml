            { "range": "over-30", "count": 2 }
          ],
          "releaseDecades": [
            { "decade": 1990, "count": 1 },
            { "decade": 2010, "count": 6 },
            { "decade": 2020, "count": 10 }
          ],
          "gamesWithoutHours": 1,
          "gamesWithoutRelease": 1
        },
        "language": "en",
        "generatedAt": "2025-12-03T20:15:00.000Z",
        "design": "2026",
        "frozenAt": null,
        "aiRecap": null,
