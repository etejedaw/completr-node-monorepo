        "ownerControls": null
      }
    }
    ```

    - `persona`: the title of the year, the first rule that matches: `trophy-hunter` (`platinums` >= 3, never when `platinums` is `null`), `marathoner` (`finished` >= 3 and an average of 30 hours or more per finished game), `short-and-sweet` (`finished` >= 5 and an average of 8 hours or less), `finisher` (`finished` >= 10 and `finishRate` >= 80), `genre-explorer` (`genresPlayed` >= 6), `picky-player` (`abandoned` > `finished` and `abandoned` >= 3), otherwise `steady-player`. The average uses the hours of `longest` / `fastest` (real or estimated) of the latest run of each finished game, leaving out games without hours.
    - `isSpotlight`: `true` while an edition of `year` is open: today (UTC) between its `opensAt` and `closesAt`, both included.
    - `premiumAccess`: only for the owner, `null` for everyone else. The owner's current access to `rewind.premium`: `source` is `role`, `full-grant`, `feature-grant` or null; `expiresAt` is the applicable grant expiration or null. It controls premium generation actions, not access to already generated content nor the badge.
    - `premiumAccessKind`: same for every viewer. The access the Rewind had the first time it used the AI, which also decided its quota of rolls: `gift` with a specific Rewind grant, `premium` with a premium role or temporary full premium. It is fixed at that first use and never changes or goes back to `null`, so it stays correct after the owner's access expires; the client shows the badge from it. It is `null` while there is no premium content (no ready `aiRecap` and no `premiumStats`), also for Rewinds generated before this field existed.
    - `design`: key of the design the Rewind is drawn with (`"2026"`). While the Rewind is not frozen it is the design of the latest edition that already opened; once frozen, the design of the edition in whose period it was live, from the snapshot.
    - `frozenAt`: ISO date when the Rewind was frozen at the close of its period (from the snapshot), `null` while it is live.
    - `otherYears`: the other years `GET /users/:username/rewinds` lists for the same viewer, newest first (only generated years for visitors).
    - `language`: `en` or `es`, chosen by the owner when generating; the page is shown in it for every viewer.
    - `generatedAt`: ISO date of the last generation. The owner sends it back as `expectedGeneratedAt` to regenerate.
    - `aiRecap`: the stored AI recap (`headline`, `summary`, `insights` with `kind` / `title` / `body`, `funFact`, `nextYearChallenge`), only when it finished successfully; `null` otherwise. Losing premium never removes it.
    - `premiumStats`: `hoursByMonth`, `tasteVsCritics`, `backlogFlow` and `genreShare`, stored with the AI recap; `null` when the year was never generated with premium access.
    - `ownerControls`: only for the owner, `null` for everyone else. `includesPrivateRuns` and `includesNotes` repeat the last generation choices; `regenerationsLeft` is the rolls this Rewind has left (before its first AI use, the quota the owner's current access would get from the open edition); `graceEndsAt` is the `graceEndsAt` of the open edition (`YYYY-MM-DD`) when the Rewind is of the edition year, today is inside the grace window, the grace is unused and the owner has `rewind.premium` access, `null` otherwise; `canRegenerate` is `periodOpen` && year allowed (the edition year, or a previous year with full premium) && `rewind.premium` access && (`graceEndsAt !== null || regenerationsLeft > 0`); `regenerationBlockedBy` is `null` when `canRegenerate` is `true`; otherwise the first applicable reason: `period-closed` (no edition open), `requires-premium` (a previous year without full premium), `no-ai-access` (no `rewind.premium` access) or `no-regenerations-left` (no rolls and no grace left), the same rules that answer the 409/403 of regenerating; `aiRecapState` is `ready` (recap stored), `failed` (failed or still pending), `available` (no recap and `canRegenerate`) or `unavailable`; `periodOpen` says whether an edition is open today; `periodStatus` is `open` (an edition is open), `scheduled` (none is open and a later one exists) or `closed` (no later edition), the same criterion as `period.status` in `GET /users/:username/rewinds`; `closesAt` is the `closesAt` of the open edition (`YYYY-MM-DD`) or `null`; `frozenAt` repeats the Rewind `frozenAt`.
    - `totals`: distinct games `finished` (`completed`) and `abandoned` with `finishedAt` in the year, distinct games `started` (`startedAt` in the year), `hoursPlayed` as in the years list, and `platinums` with `platinumedAt` in the year (`null` without access to the platinums). `finishRate` is `round(finished / (finished + abandoned) * 100)`, `null` when both are 0. `averageRating` is the mean `userRating` of the rated finished runs, 1 decimal, `null` without ratings. `genresPlayed` / `platformsPlayed` count the distinct genres of the finished games and the distinct platforms of the finished runs.
    - `finishedGames`: one entry per finished game (its latest run of the year), by `finishedAt` ascending and then run id.
    - `abandonedGames`: one entry per abandoned game (its latest `abandoned` run of the year), with the same fields and order as `finishedGames`; `finishedAt` is the date it was abandoned. It follows the same privacy (visitors only get public runs) and its length matches `totals.abandoned`. A game abandoned and then finished in the same year is in both lists, each with its own date, as `totals` counts it in both. It does not feed the highlights, `yearMix` or the share images. A Rewind frozen before this field existed serves `[]`.
    - `platinumGames`: one entry per platinum with `platinumedAt` in the year, the same ones `totals.platinums` counts (its length always matches, including platinums of private runs, as the count does), by `platinumedAt` ascending and then platinum id. Each entry has the game reference, `platinumedAt` and the `platformAbbreviation` of the platinum (`null` if it has none); the platinum notes and its run are never returned. A game has at most one platinum per user, so it appears once. `null` without access to the platinums, `[]` when there are none. A Rewind frozen before this field existed serves `[]` (with access) while `totals.platinums` keeps the count of its snapshot.
    - `topRated`: the finished run with the highest `userRating`; ties go to the latest `finishedAt`, then the run id.
    - `bestRatio`: the finished run with the highest personal ratio (`score` per hour of `realDuration`, same formula as the backlog); ties like `topRated`.
    - `longest` / `fastest`: by `realDuration`, or by the estimated `duration` (`isEstimate: true`) when the run has no real hours; ties go to the earliest `finishedAt`, then the run id. `fastest` is `null` when it would be the same game as `longest`.
    - `favoriteGenre`: the genre with the most distinct finished games; ties by name. `topPlatform`: the platform with the most finished runs; ties by name. `busiestMonth`: the month (1-12) with the most finished games; ties go to the earliest month.
    - `firstFinished` / `lastFinished`: the first and last entries of `finishedGames` (the same game when only one was finished).
    - `topGenres` / `topPlatforms`: up to 3, with the criteria and ties of `favoriteGenre` / `topPlatform`, which are their first entries; empty arrays when there is nothing to rank.
    - `longestStreak`: the longest run of consecutive months of the year with at least one finished game (by the latest run of each game); ties go to the earliest; `null` when it is shorter than 2 months.
    - `classic`: the finished game (its latest run of the year) with the oldest release year, as long as it came out at least 10 years before `year` (`REWIND_CLASSIC_MIN_AGE_YEARS`; a 2015 game counts in the 2025 Rewind, a 2016 one does not); games without a release date never count. Ties go to the earliest `finishedAt`, then the game id. `null` when no game is old enough. A Rewind frozen before this highlight existed serves `null`.
    - Every other highlight is `null` when there is nothing to pick from.
    - `yearMix`: computed live from the latest finished run of each game in the year, so a replayed game counts once. `lengthMix` always has the four ranges in this order: `under-5`, `5-15`, `15-30` and `over-30` hours, by `realDuration` or, without real hours, the estimated `duration` (a range includes its lower edge: exactly 5 hours is `5-15`). `releaseDecades` lists only the decades with games (`decade` is 1990, 2000...), oldest first, by the release year of the game. `gamesWithoutHours` counts the finished games left out of `lengthMix` (no hours above 0) and `gamesWithoutRelease` the ones left out of `releaseDecades` (no release date, or a release year before 1950 or after `year`).

    ### Errors

    | Status | Code                  | Description                                                     |
    |--------|-----------------------|-----------------------------------------------------------------|
    | 403    | USER_PRIVATE          | Rewind section not visible |
    | 404    | USER_NOT_FOUND        | No active user with that username                               |
    | 404    | REWIND_NOT_FOUND      | The year is not open yet, is before the sign-up, has no data, or (for visitors) is not generated |
    | 404    | REWIND_NOT_GENERATED  | The owner reads an open year with data they have not generated  |
    | 422    | COMMON_SCHEMA_INVALID | `year` is not an integer from 2000 to 2100, or bad `username`   |
