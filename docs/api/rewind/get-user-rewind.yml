info:
    name: Get User Rewind
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/rewinds/:year"
    auth: inherit
    params:
        - name: username
          value: ""
          type: path
        - name: year
          value: "2025"
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User Rewind

    Returns the Rewind of `:username` for one calendar year: totals, every finished and abandoned game, the platinums of the year and the highlights. Powers the `/user/:username/rewind/:year` page and the share images.

    The owner must have generated the year with `POST /users/me/rewinds/:year`: until then visitors get 404 `REWIND_NOT_FOUND` and the owner gets 404 `REWIND_NOT_GENERATED`. While the Rewind is live, the base numbers are computed for each viewer; `language`, `generatedAt`, `frozenAt`, `aiRecap` and `premiumStats` come from the stored generation and are the same for every viewer, free or premium.

    **Frozen Rewinds.** At the close of the period in which it was generated or regenerated (00:00 UTC of the day after the edition `closesAt`), the Rewind is frozen: it stores a snapshot with the owner view and the visitor view of that moment, and from then on it is read from the snapshot (`frozenAt` is set). Games, platinums, totals, highlights, `yearMix`, `language`, `generatedAt`, `aiRecap`, `premiumStats`, `premiumAccessKind` and `design` come from the snapshot, so runs added later or a run that turns private do not change it. A visitor gets the visitor view; a year that had no public runs at the close stays 404 `REWIND_NOT_FOUND` for visitors even if its runs turn public later. The snapshot keeps the persona computed with and without platinums, and the response serves the one that matches the current access of the viewer to the platinums section. What stays live: `user`, `isSpotlight`, `premiumAccess`, `ownerControls` and access to the sections — if the owner hides the rewind section, the visitor gets 403 `USER_PRIVATE`, and without access to the platinums `totals.platinums` and `platinumGames` are `null`. `otherYears` lists frozen years as they were at their close and the rest live, like `GET /users/:username/rewinds`. If the period already closed and the freeze job has not reached the Rewind yet, this request freezes it before answering (unless its AI recap is still in progress). Regenerating the Rewind in a later edition clears the snapshot and the Rewind is live again until that edition closes.

    The year must be open (a past year, or the year of the latest edition that already opened, UTC), not earlier than the year the user signed up (`createdAt`, UTC), and have data for the viewer, as in `GET /users/:username/rewinds`. The owner sees every run; everyone else gets the Rewind built from public runs only. Notes are never returned. The platinum total and `platinumGames` are only sent to viewers who can see both the profile and the platinums section (`profileVisibility` and `platinumVisibility`); for everyone else both are `null`. For non-self viewers the target's `rewind` section must be visible, and the `profile` section does not matter: the detail is reached by link and only `rewindVisibility` counts, even when the profile is private. The visitor sees the owner's name and avatar in `user`, and the profile, the year archive and the other sections stay restricted.

    **Authentication:** optional (Bearer token). Required to see a Rewind whose privacy needs it.
    **Rate Limit:** 300 requests per minute (public).

    ### Path Params

    | Param    | Type    | Required | Description                                   |
    |----------|---------|----------|-----------------------------------------------|
    | username | string  | Yes      | Profile username                              |
    | year     | integer | Yes      | Calendar year, digits only, from 2000 to 2100 |

    ### Response (200)

    As a visitor sees it (`premiumAccess` and `ownerControls` are `null`).

