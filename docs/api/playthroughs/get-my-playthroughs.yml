info:
    name: Get My Playthroughs
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/me/playthroughs"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Playthroughs

    Returns the authenticated user's playthrough history. Supports filters via query params.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    | Param   | Type   | Required | Description                                      |
    |---------|--------|----------|--------------------------------------------------|
    | status  | string | No       | Filter by: not_started, playing, completed, abandoned |
    | game_id | uuid   | No       | Filter by specific game                          |
    | from    | date   | No       | Filter by finishedAt >= date (ISO)               |
    | to      | date   | No       | Filter by finishedAt <= date (ISO)               |

    ### Response (200)

    ```json
    {
      "data": {
        "playthroughs": [
          {
            "id": "uuid",
            "status": "completed",
            "startedAt": "2025-01-01",
            "finishedAt": "2025-01-15",
            "realDuration": 12.5,
            "userRating": 8.5,
            "notes": "Great game",
            "playthroughNumber": 1,
            "createdAt": "...",
            "game": { "id": "uuid", "title": "..." },
            "platform": { "id": "uuid", "name": "..." }
          }
        ]
      }
    }
    ```
