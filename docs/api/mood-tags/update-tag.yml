info:
    name: Update Mood Tag (rename / describe / style)
    type: http
    seq: 4

http:
    method: PATCH
    url: "{{BASE_URL}}/users/me/mood-tags/:tag"
    params:
        - name: tag
          value: ""
          type: path
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "newTag": "cozy",
              "description": "Para una sesión chill, sin estrés",
              "icon": "bolt",
              "color": "rose"
            }

settings:
    encodeUrl: true

docs: |-
    ## Update Mood Tag (rename / describe / style)

    Renames a tag globally for the authenticated user (across every game it's assigned to) and/or sets its description, icon and color. Partial update: at least one field is required, and the fields left out keep their value. When the request also renames, the description, icon and color are applied to the new name. A tag used on games but without metadata gets its metadata row on the first description, icon or color.

    Both old and new tag names are normalized server-side (lowercased, trimmed,
    diacritics stripped, whitespace collapsed) before any operation runs.

    **Merge semantics on rename:** if `newTag` already exists for some games, the rows
    are merged. Specifically, for each game where the old tag was present:
    - If the new tag is not on that game → row is updated.
    - If the new tag is already on that game → old row is dropped (the existing one wins).

    If the old tag had a description and the new tag did not, the description is transferred. If both had descriptions, the new tag's description is kept. Icon and color follow the same rule one by one: the new tag keeps its own and takes the old tag's only where it had none. A plain rename (no merge) keeps the description, icon and color.

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description                              |
    |-------|--------|----------|------------------------------------------|
    | tag   | string | Yes      | The current tag name (will be normalized)|

    ### Request Body

    | Field       | Type           | Required | Description                                |
    |-------------|----------------|----------|--------------------------------------------|
    | newTag      | string         | No       | New name (1–40 chars). Triggers rename + merge. |
    | description | string \| null | No       | Description text (max 255 chars). `null` clears.|
    | icon        | string \| null | No       | Icon of the tag. `null` clears. Same values as saved views: `bookmark`, `star`, `favorite`, `sports_esports`, `smartphone`, `computer`, `tv`, `emoji_events`, `flag`, `check_circle`, `schedule`, `bolt`, `local_fire_department`, `filter_alt`, `list`, `calendar_month`, `military_tech`, `rocket_launch`, `visibility` |
    | color       | string \| null | No       | Color token of the tag. `null` clears. Same values as saved views: `brand`, `sky`, `emerald`, `rose`, `purple`, `teal`, `slate` |

    ### Response (200)

    ```json
    {
      "data": { "tag": "cozy" }
    }
    ```

    Returns the final (normalized) tag name. Re-fetch `GET /users/me/mood-tags` to read the
    updated row.

    A renamed favorite keeps its position among the favorites. When it is merged into a tag that already exists, the merged tag keeps the earlier of the two positions and the remaining favorites close the gap.

    ### Errors

    | Status | Type                       | Reason                                              |
    |--------|----------------------------|-----------------------------------------------------|
    | 404    | `MOOD_TAGS_TAG_NOT_FOUND`  | The original tag does not exist for the user        |
    | 422    | `COMMON_SCHEMA_INVALID`    | Body validation failed (no field sent, icon or color outside the allowed values)|
    | 422    | `MOOD_TAGS_INVALID_TAG`    | newTag is empty after normalization or too long     |
    | 402    | `MOOD_TAGS_LIMIT_REACHED`  | Setting a description, icon or color on a tag that does not exist yet would exceed the free plan limit (25 distinct tags) |
