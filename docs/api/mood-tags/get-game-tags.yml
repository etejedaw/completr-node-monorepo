info:
    name: Get Game Mood Tags
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/me/games/:gameId/mood-tags"
    params:
        - name: gameId
          value: ""
          type: path
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get Game Mood Tags

    Returns the mood tags the authenticated user has assigned to a specific game.

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param  | Type | Required | Description       |
    |--------|------|----------|-------------------|
    | gameId | uuid | Yes      | The game UUID     |

    ### Response (200)

    ```json
    {
      "data": {
        "tags": ["corto", "relajante"]
      }
    }
    ```

    Tags are stored normalized: lowercase, trimmed, with collapsed whitespace and stripped diacritics.
