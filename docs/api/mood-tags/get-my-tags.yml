info:
    name: Get My Mood Tags
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/users/me/mood-tags"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Mood Tags

    Returns every distinct mood tag the authenticated user has assigned to any of their games,
    sorted by usage count (descending) then alphabetically. Used as the source for the
    autocomplete input in the backlog UI.

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "tags": [
          { "tag": "relajante", "usageCount": 12, "description": "Para una sesión chill" },
          { "tag": "corto", "usageCount": 7, "description": null },
          { "tag": "podcast game", "usageCount": 3, "description": null }
        ]
      }
    }
    ```

    `description` is `null` unless the user explicitly set one via
    `PATCH /users/me/mood-tags/:tag`. Tags that exist only as metadata (no game uses them
    yet) appear with `usageCount = 0`.
