info:
    name: Create Game Score
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/game-scores"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "gameId": "",
              "source": "metacritic",
              "score": 89
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Game Score

    Creates a game score for a specific source. Returns 409 if a score for this game and source already exists. Returns 422 (`GAME_SCORE_SOURCE_NOT_FOUND`) if the source is not in the score source catalog and 422 (`GAME_SCORE_OUT_OF_RANGE`) if the score is above the `scale` of its source. Negative scores are rejected with 422 (`COMMON_SCHEMA_INVALID`).

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field  | Type   | Required | Description                                      |
    |--------|--------|----------|--------------------------------------------------|
    | gameId | uuid   | Yes      | The game UUID                                    |
    | source | string | Yes      | Score source code from GET /score-sources (not completr) |
    | score  | number | Yes      | The score value, from 0 up to the `scale` of the source |

    ### Response (201)

    ```json
    {
      "data": {
        "gameScore": {
          "id": "uuid",
          "gameId": "uuid",
          "source": "metacritic",
          "score": 89,
          "updatedAt": "2025-01-01T00:00:00.000Z"
        }
      }
    }
    ```
