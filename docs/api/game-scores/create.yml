info:
    name: Create Game Score
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/game-scores"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "gameId": "",
              "source": "metacritic",
              "score": 89
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Game Score

    Creates a game score for a specific source. Returns 409 if a score for this game and source already exists.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field  | Type   | Required | Description                                      |
    |--------|--------|----------|--------------------------------------------------|
    | gameId | uuid   | Yes      | The game UUID                                    |
    | source | string | Yes      | Score source: metacritic, opencritic, rawg |
    | score  | number | Yes      | The score value (scale depends on source)        |

    ### Response (201)

    ```json
    {
      "data": {
        "gameScore": {
          "id": "uuid",
          "gameId": "uuid",
          "source": "metacritic",
          "score": 89,
          "updatedAt": "2025-01-01T00:00:00.000Z"
        }
      }
    }
    ```
