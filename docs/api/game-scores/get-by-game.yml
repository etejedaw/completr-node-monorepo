info:
    name: Get Scores by Game
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/game-scores/:gameId"
    params:
        - name: gameId
          value: ""
          type: path
    auth:
        type: bearer
        token: "{{token}}"

settings:
    encodeUrl: true

docs: |-
    ## Get Scores by Game

    Returns all scores for a game from all available sources.

    **Authentication:** Bearer token required (role: user, premium, moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param  | Type | Required | Description   |
    |--------|------|----------|---------------|
    | gameId | uuid | Yes      | The game UUID |

    ### Response (200)

    ```json
    {
      "data": {
        "gameScores": [
          {
            "id": "uuid",
            "gameId": "uuid",
            "source": "metacritic",
            "score": 89,
            "updatedAt": "2025-01-01T00:00:00.000Z"
          },
          {
            "id": "uuid",
            "gameId": "uuid",
            "source": "rawg",
            "score": 4.2,
            "updatedAt": "2025-01-01T00:00:00.000Z"
          }
        ]
      }
    }
    ```
