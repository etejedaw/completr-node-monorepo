info:
    name: Update Game Score
    type: http
    seq: 3

http:
    method: PATCH
    url: "{{BASE_URL}}/game-scores/:gameId/:source"
    params:
        - name: gameId
          value: ""
          type: path
        - name: source
          value: metacritic
          type: path
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "score": 92
            }

settings:
    encodeUrl: true

docs: |-
    ## Update Game Score

    Updates an existing game score for a specific source. Returns 404 if the score does not exist, 422 (`COMMON_SCHEMA_INVALID`) if it is negative and 422 (`GAME_SCORE_OUT_OF_RANGE`) if it is above the `scale` of its source.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param  | Type   | Required | Description                                  |
    |--------|--------|----------|----------------------------------------------|
    | gameId | uuid   | Yes      | The game UUID                                |
    | source | string | Yes      | Score source code from GET /score-sources (not completr) |

    ### Request Body

    | Field | Type   | Required | Description                               |
    |-------|--------|----------|-------------------------------------------|
    | score | number | Yes      | The new score value, from 0 up to the `scale` of the source |

    ### Response (200)

    ```json
    {
      "data": {
        "gameScore": {
          "id": "uuid",
          "gameId": "uuid",
          "source": "metacritic",
          "score": 92,
          "updatedAt": "2025-01-01T00:00:00.000Z"
        }
      }
    }
    ```
