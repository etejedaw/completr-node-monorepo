info:
  name: Get Genre by Code
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/genres/:code"
  params:
    - name: code
      value: action
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true

docs: |-
  ## Get Genre by Code

  Returns a single genre by its slug code.

  > **Note:** This endpoint is NOT registered in the server yet.
  > The genre router is defined but not imported in `server.ts`.

  **Authentication:** Bearer token required (roles: user, premium, moderator).
  **Rate Limit:** 100 requests per minute.

  ### Path Parameters

  | Param | Type   | Required | Description                       |
  |-------|--------|----------|-----------------------------------|
  | code  | string | Yes      | The genre's slug (e.g. action)    |

  ### Response (200)

  ```json
  {
    "data": {
      "genre": {
        "id": "uuid",
        "name": "Action",
        "code": "action",
        "createdAt": "2025-01-01T00:00:00.000Z",
        "updatedAt": "2025-01-01T00:00:00.000Z"
      }
    }
  }
  ```
