info:
    name: Delete Genre
    type: http
    seq: 5

http:
    method: DELETE
    url: "{{BASE_URL}}/genres/:genreId"
    params:
        - name: genreId
          value: ""
          type: path
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Delete Genre

    Deletes a genre.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param   | Type | Required | Description    |
    |---------|------|----------|----------------|
    | genreId | uuid | Yes      | The genre UUID |

    ### Response (204)

    No content.
