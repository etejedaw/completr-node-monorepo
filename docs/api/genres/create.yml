info:
    name: Create Genre
    type: http
    seq: 3

http:
    method: POST
    url: "{{BASE_URL}}/genre"
    headers:
        - name: Content-Type
          value: application/json
    auth:
        type: bearer
        token: "{{token}}"
    body:
        type: json
        data: |-
            {
              "name": "Action"
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Genre

    Creates a new genre entry.

    > **Note:** This endpoint is NOT registered in the server yet.
    > The genre router is defined but not imported in `server.ts`.
    > Additionally, the route path uses `/genre` (singular) instead of `/genres`.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field | Type   | Required | Description        |
    |-------|--------|----------|--------------------|
    | name  | string | Yes      | Max 50 characters  |

    ### Response (201)

    ```json
    {
      "data": {
        "genre": {
          "id": "uuid",
          "name": "Action",
          "code": "action",
          "createdAt": "2025-01-01T00:00:00.000Z",
          "updatedAt": "2025-01-01T00:00:00.000Z"
        }
      }
    }
    ```
