docs: |-
    ## Update Genre

    Updates an existing genre.

    > **Note:** This endpoint is NOT registered in the server yet.
    > The genre router is defined but not imported in `server.ts`.

    > **BUG:** The route path is `/platform/:id` instead of `/genres/:id`.
    > This is likely a copy-paste error in `genres.routes.ts:47`.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description       |
    |-------|--------|----------|-------------------|
    | id    | string | Yes      | The genre UUID    |

    ### Request Body

    | Field | Type   | Required | Description        |
    |-------|--------|----------|--------------------|
    | name  | string | Yes      | Max 50 characters  |

    ### Response (200)

    ```json
    {
      "data": {
        "genre": {
          "id": "uuid",
          "name": "Action RPG",
          "code": "action-rpg",
          "createdAt": "2025-01-01T00:00:00.000Z",
          "updatedAt": "2025-01-01T00:00:00.000Z"
        }
      }
    }
    ```
