info:
    name: Update Genre
    type: http
    seq: 4

http:
    method: PATCH
    url: "{{BASE_URL}}/genres/:genreId"
    params:
        - name: genreId
          value: ""
          type: path
    headers:
        - name: Content-Type
          value: application/json
    auth:
        type: inherit
    body:
        type: json
        data: |-
            {
              "name": "Action RPG"
            }

settings:
    encodeUrl: true

docs: |-
    ## Update Genre

    Updates an existing genre.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param   | Type | Required | Description    |
    |---------|------|----------|----------------|
    | genreId | uuid | Yes      | The genre UUID |

    ### Request Body

    | Field | Type   | Required | Description        |
    |-------|--------|----------|--------------------|
    | name  | string | Yes      | Max 50 characters  |

    ### Response (200)

    ```json
    {
      "data": {
        "genre": {
          "id": "uuid",
          "name": "Action RPG",
          "code": "action-rpg",
          "createdAt": "2025-01-01T00:00:00.000Z",
          "updatedAt": "2025-01-01T00:00:00.000Z"
        }
      }
    }
    ```
