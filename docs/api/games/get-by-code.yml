docs: |-
    ## Get Game by Code

    Returns a single game by its slug code.

    **Authentication:** Bearer token required (roles: user, premium, moderator).
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description                        |
    |-------|--------|----------|------------------------------------|
    | code  | string | Yes      | The game's slug (e.g. metro-exodus)|

    ### Response (200)

    ```json
    {
      "data": {
        "game": {
          "id": "uuid",
          "title": "Metro Exodus",
          "code": "metro-exodus",
          "description": "FPS game...",
          "releaseAt": "2019-02-14",
          "coverUrl": null,
          "averageScore": null,
          "averagePlaytime": null,
          "updatedAt": "2025-01-01T00:00:00.000Z",
          "platforms": [
            {
              "id": "uuid",
              "name": "Steam",
              "code": "steam",
              "abbreviation": "steam"
            }
          ],
          "isCompilation": false,
          "compilationItems": [],
          "partOfCompilations": []
        }
      }
    }
    ```

    ### Compilation fields

    - `isCompilation` — true when this game bundles other games (e.g. Mass Effect Legendary Edition).
    - `compilationItems` — children of this compilation, ordered by `position`. Each entry: `{ id, position, game: { id, title, code, ... } }`.
    - `partOfCompilations` — list of compilations that include this game as a child. Each entry: `{ id, parentGame: { id, title, code, ... } }`.
