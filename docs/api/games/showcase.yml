http:
    method: GET
    url: "{{BASE_URL}}/games/showcase"
    auth: none

settings:
    encodeUrl: true

docs: |-
    ## Get Games Showcase

    Returns the most popular games of the catalog for the decorative poster wall of the login page, plus one featured game for its "Up next" card. Only exposes catalog data: no user data is ever included.

    **Authentication:** Public, no auth required.
    **Rate Limit:** 300 requests per minute (public limiter).

    ### Selection

    - Up to 21 active games that are not DLCs and have a `backgroundUrl`.
    - Ordered by `GamePopularities.score` desc (games without a popularity row count as 0), then `title` asc and `id` asc as a stable tie-break.
    - `featured` is the game of that set with the best ratio. It uses the same canonical sources as `GET /games?sort_by=ratio`: the score of the source with the lowest `priority`, normalized to 0-5, and the duration picked by `completr` → `hltb` → `rawg`. Games without score or duration are skipped. On a ratio tie the most popular game wins.
    - `featured` is `null` when no game of the set has both score and duration.
    - `score` is normalized 0-5 with 2 decimals, `hours` has 1 decimal and `ratio` is on the 0-100 scale divided by hours, with 2 decimals (same formula as the rest of the API).

    The response is cached in memory for 30 minutes. If refreshing it fails and a previous result exists, the stale result is served.

    ### Response (200)

    ```json
    {
      "data": {
        "games": [
          {
            "id": "uuid",
            "code": "hades",
            "title": "Hades",
            "backgroundUrl": "https://media.rawg.io/media/games/1f4/1f47a270b8f241e4676b14d39ec620f7.jpg"
          }
        ],
        "featured": {
          "id": "uuid",
          "code": "hades",
          "title": "Hades",
          "backgroundUrl": "https://media.rawg.io/media/games/1f4/1f47a270b8f241e4676b14d39ec620f7.jpg",
          "score": 4.65,
          "hours": 22.5,
          "ratio": 4.13
        }
      }
    }
    ```

    ### Errors

    | Status | Reason                                                       |
    |--------|--------------------------------------------------------------|
    | 429    | Public rate limit exceeded                                   |
    | 500    | Database unavailable and there is no cached result yet       |
