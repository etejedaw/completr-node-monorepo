docs: |-
    ## RAWG Detail

    Gets full game detail from RAWG by ID. For admin/moderator use (re-scrape workflow). Does not create or modify any game.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param  | Type   | Required | Description    |
    |--------|--------|----------|----------------|
    | rawgId | number | Yes      | RAWG game ID   |

    ### Response (200)

    ```json
    {
      "data": {
        "game": {
          "rawgId": 736255,
          "title": "Front Mission 1st Remake",
          "description": "Full description...",
          "coverUrl": "https://...",
          "releaseAt": "2022-11-23",
          "platforms": ["nintendo-switch", "steam", "gog"],
          "genres": ["strategy", "rpg"],
          "scores": [{ "source": "metacritic", "score": 72 }],
          "times": [{ "source": "rawg", "duration": 25 }]
        }
      }
    }
    ```

    ### Errors

    - 404 `RAWG_NOT_FOUND` — RAWG has no game for that id
    - 429 `RAWG_RATE_LIMITED` — RAWG rate limit reached
    - 502 `RAWG_REQUEST_ERROR` — RAWG request failed
    - 502 `RAWG_PARSE_ERROR` — Unexpected RAWG response
    - 503 `RAWG_DISABLED` — `RAWG_API_KEY` is not configured on the server
