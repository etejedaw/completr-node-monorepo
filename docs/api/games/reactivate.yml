docs: |-
    ## Reactivate Game

    Reverts a soft-deleted game by setting `isActive: true`. Admin only.

    **Authentication:** Bearer token required (role: admin).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description     |
    |-------|--------|----------|-----------------|
    | id    | string | Yes      | The game UUID   |

    ### Response (204)

    No content.

    ### Errors

    - 404 `GAME_NOT_FOUND` — Game does not exist
