docs: |-
    ## RAWG Lookup

    Searches RAWG API directly without creating games. For admin/moderator use (re-scrape workflow).

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    | Param | Type   | Required | Description          |
    |-------|--------|----------|----------------------|
    | query | string | Yes      | Search query (1-200) |

    ### Response (200)

    ```json
    {
      "data": {
        "results": [
          {
            "rawgId": 736255,
            "title": "Front Mission 1st Remake",
            "backgroundUrl": "https://media.rawg.io/...",
            "releaseAt": "2022-11-23",
            "metacritic": 72,
            "playtime": 0,
            "platforms": ["pc", "nintendo-switch"],
            "genres": ["strategy", "role-playing-games-rpg"]
          }
        ]
      }
    }
    ```

    ### Errors

    - 404 `RAWG_NOT_FOUND` — RAWG answered 404 (a search without matches is a 200 with an empty `results`)
    - 429 `RAWG_RATE_LIMITED` — RAWG rate limit reached
    - 502 `RAWG_REQUEST_ERROR` — RAWG answered with another error status, or the request to RAWG failed (network)
    - 502 `RAWG_PARSE_ERROR` — RAWG answered with a body that is not valid JSON
    - 503 `RAWG_DISABLED` — `RAWG_API_KEY` is not configured on the server
