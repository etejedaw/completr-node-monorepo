docs: |-
    ## RAWG Lookup

    Searches RAWG API directly without creating games. For admin/moderator use (re-scrape workflow).

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    | Param | Type   | Required | Description          |
    |-------|--------|----------|----------------------|
    | query | string | Yes      | Search query (1-200) |

    ### Response (200)

    ```json
    {
      "data": {
        "results": [
          {
            "rawgId": 736255,
            "title": "Front Mission 1st Remake",
            "coverUrl": "https://...",
            "releaseAt": "2022-11-23",
            "metacritic": 72,
            "playtime": 0,
            "platforms": ["pc", "nintendo-switch"],
            "genres": ["strategy", "role-playing-games-rpg"]
          }
        ]
      }
    }
    ```
