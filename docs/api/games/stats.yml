info:
    name: Get Game Stats
    type: http
    seq: 15

http:
    method: GET
    url: "{{BASE_URL}}/games/:id/stats"
    auth: inherit
    params:
        - name: id
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get Game Stats

    Returns aggregate run counts for the game — how many users have it in each backlog status. Powers the "Runs" panel in game detail.

    Counts include every backlog entry on the game (public and private). The aggregate itself does not reveal any individual user.

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute (public).

    ### Path Params

    | Param | Type | Required | Description |
    |-------|------|----------|-------------|
    | id    | uuid | Yes      | Game UUID   |

    ### Response (200)

    ```json
    {
      "data": {
        "stats": {
          "runs": {
            "not_started": 12,
            "playing": 34,
            "completed": 56,
            "abandoned": 7,
            "total": 109
          }
        }
      }
    }
    ```

    ### Errors

    | Status | Code                  | Description                          |
    |--------|-----------------------|--------------------------------------|
    | 401    | UNAUTHORIZED          | Missing or invalid Bearer token      |
    | 404    | GAME_NOT_FOUND        | Game does not exist or is inactive   |
    | 422    | COMMON_SCHEMA_INVALID | `id` is not a valid uuid             |
