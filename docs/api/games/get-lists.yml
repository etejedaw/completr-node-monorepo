info:
    name: Get Lists Containing Game
    type: http
    seq: 9

http:
    method: GET
    url: "{{BASE_URL}}/games/:id/lists"
    auth: inherit
    params:
        - name: id
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get Lists Containing Game

    Returns lists relevant to the viewer for the given game:
    - `lists`: public lists from any user that include this game (sorted: official admin lists first, then by recency).
    - `myLists`: viewer's own lists that include this game (public or private). Used to indicate "in your lists" in the game detail.

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute (public).

    ### Path Params

    | Param | Type | Required | Description |
    |-------|------|----------|-------------|
    | id    | uuid | Yes      | Game UUID   |

    ### Response (200)

    ```json
    {
      "data": {
        "lists": [
          {
            "id": "uuid",
            "name": "Saga Resident Evil",
            "description": "...",
            "isOfficial": false,
            "completed": false,
            "owner": { "username": "andres" }
          }
        ],
        "myLists": [
          { "id": "uuid", "name": "My RPGs", "isPublic": true },
          { "id": "uuid", "name": "Hidden gems", "isPublic": false }
        ]
      }
    }
    ```
