info:
    name: Get Lists Containing Game
    type: http
    seq: 9

http:
    method: GET
    url: "{{BASE_URL}}/games/:id/lists"
    auth: inherit
    params:
        - name: id
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get Lists Containing Game

    Returns lists relevant to the viewer for the given game:
    - `lists`: public lists from any user that include this game (sorted: official admin lists first, then by recency).
    - `myLists`: ALL viewer's own lists with a `contains` boolean indicating whether this game is in each list. Used both for the "In your lists" section (filter `contains === true`) and for the "Add to Lists" modal in game detail (full checkbox state).

    **Authentication:** Bearer token required.
    **Rate Limit:** 100 requests per minute (public).

    ### Path Params

    | Param | Type | Required | Description |
    |-------|------|----------|-------------|
    | id    | uuid | Yes      | Game UUID   |

    ### Response (200)

    ```json
    {
      "data": {
        "lists": [
          {
            "id": "uuid",
            "name": "Saga Resident Evil",
            "description": "...",
            "isOfficial": false,
            "completed": false,
            "owner": { "username": "andres" }
          }
        ],
        "myLists": [
          { "id": "uuid", "name": "My RPGs", "isPublic": true, "contains": true },
          { "id": "uuid", "name": "Hidden gems", "isPublic": false, "contains": false }
        ]
      }
    }
    ```
