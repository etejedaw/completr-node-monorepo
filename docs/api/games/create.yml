info:
    name: Create Game
    type: http
    seq: 3

http:
    method: POST
    url: "{{BASE_URL}}/games"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "title": "Metro Exodus",
              "description": "FPS narrativo que mezcla combate, sigilo, exploracion y terror de supervivencia",
              "platforms": ["steam"],
              "genres": ["action", "shooter"],
              "releaseAt": "2019-02-14",
              "coverUrl": "https://example.com/cover.jpg",
              "scores": [{ "source": "metacritic", "score": 82 }],
              "times": [{ "source": "hltb", "duration": 15 }]
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Game

    Creates a new game entry with optional scores, times and genres.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field        | Type     | Required | Description                                              |
    |--------------|----------|----------|----------------------------------------------------------|
    | title        | string   | Yes      | Max 200 characters                                       |
    | description  | string   | No       | Game description                                         |
    | platforms    | string[] | No       | Array of platform codes (default [])                     |
    | genres       | string[] | No       | Array of genre codes (default [])                        |
    | releaseAt    | string   | No       | ISO date (e.g. "2019-02-14")                             |
    | coverUrl     | string   | No       | URL to cover image                                       |
    | isDlc        | boolean  | No       | Whether this is a DLC                                    |
    | parentGameId | uuid     | No       | Parent game UUID (for DLCs)                              |
    | scores       | array    | No       | `[{ source: "metacritic", score: 82 }]`                 |
    | times        | array    | No       | `[{ source: "hltb", duration: 15 }]`                    |

    ### Response (201)

    ```json
    {
      "data": {
        "game": {
          "id": "uuid",
          "title": "Metro Exodus",
          "code": "metro-exodus",
          "description": "FPS narrativo...",
          "releaseAt": "2019-02-14",
          "coverUrl": "https://example.com/cover.jpg",
          "isDlc": false,
          "ratio": null,
          "platforms": [{ "id": "uuid", "name": "Steam", "code": "steam", "abbreviation": "steam" }],
          "genres": [{ "id": "uuid", "name": "Action", "code": "action" }],
          "scores": [{ "source": "metacritic", "score": 82 }],
          "times": [{ "source": "hltb", "duration": 15 }]
        }
      }
    }
    ```

    ### Errors

    - 404 `GAME_PLATFORM_NOT_FOUND` — One or more platform codes not found
    - 404 `GAME_GENRE_NOT_FOUND` — One or more genre codes not found
    - 409 `GAME_UNIQUE_CONSTRAINT` — Game with this title already exists
