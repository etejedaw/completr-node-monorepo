http:
    method: POST
    url: "{{BASE_URL}}/games/:id/external-data/refresh"
    params:
        - name: id
          value: ""
          type: path
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "sources": ["metacritic", "hltb", "igdb"]
            }

settings:
    encodeUrl: true
    timeout: 0

docs: |-
    ## Refresh External Data

    Fetches the Metacritic score and the HowLongToBeat Main Story duration of one game from their detail pages, and the IGDB user rating from the IGDB API, and stores them in the global catalog (`GameScore` source `metacritic`, `GameTime` source `hltb`, `GameScore` source `igdb`). Each requested source is refreshed even when it already has a value. Sources run one after another and the request can take 10-30 s because the scrapers wait 5-7 s between external requests; IGDB requests are spaced at least 275 ms apart (IGDB allows 4 per second). The requests go with interactive priority, ahead of the ones queued by the `populate_external_data` job or the import enrichment queue, and the whole refresh has a 45 s deadline: when it expires the request in flight is aborted, every unfinished source is `failed` with `EXTERNAL_DATA_DEADLINE_EXCEEDED` and the endpoint still answers 200 with what did finish. Nothing is saved after the deadline. `GameShelf` and `ListItem` are never touched.

    **Authentication:** Bearer token required (role: moderator or admin).
    **Rate Limit:** 300 requests per minute (admin/moderator exempt).

    ### Path Parameters

    | Param | Type | Required | Description    |
    |-------|------|----------|----------------|
    | id    | uuid | Yes      | The game UUID  |

    ### Request Body

    | Field   | Type  | Required | Description                                                                          |
    |---------|-------|----------|--------------------------------------------------------------------------------------|
    | sources | array | Yes      | At least one of `metacritic`, `hltb`, `igdb`, without repeats. Results follow this order. |

    ### Per-source behavior

    - **Metacritic:** with a stored `metacritic` external id, its page is fetched as is. Without one, the slug is derived from the title (`title + variant` first when the game has a variant, then the bare title; at most two requests). The first page found must have the same normalized title, otherwise `not_found`; if both release years are known and differ by more than one, `ambiguous`. Only a confirmed match stores the external id. The stored score is `max(metaScore, userScore × 10)`, rounded, among the available ones; with neither, `no_data`.
    - **HowLongToBeat:** needs a stored `hltb` external id; without it the result is `not_found` and HLTB is not called. Only Main Story is stored; a missing or non-positive Main Story is `no_data` (Main + Extras and Completionist are never used instead).
    - **IGDB:** with a stored `igdb` external id, that game is fetched as is (a stored id that is not all digits is `not_found` without calling IGDB). Without one, `Game.code` is tried as the IGDB slug and accepted when its normalized title and release year match; otherwise the title is searched (up to 10 results) and the results with the same normalized title and, when both years are known, at most one year apart are kept. One match is used, more than one is `ambiguous`, none is `not_found`. Only a confirmed match stores the external id (the numeric IGDB id as text). The stored score is `rating` rounded to 2 decimals (0-100 scale); a missing, non-positive or above-100 rating is `no_data`.
    - `not_found`, `ambiguous`, `no_data` and `failed` never delete or overwrite stored values. One source can update while the other fails.

    ### Response (200)

    ```json
    {
      "data": {
        "game": { "id": "uuid", "title": "Hades", "scores": [], "times": [] },
        "results": [
          { "source": "metacritic", "status": "updated", "score": 93, "metaScore": 93, "userScore": 9.1, "errorCode": null },
          { "source": "hltb", "status": "failed", "errorCode": "HLTB_RATE_LIMITED" },
          { "source": "igdb", "status": "updated", "score": 92.35, "errorCode": null }
        ]
      }
    }
    ```

    `game` has the same shape as `PATCH /games/:id`. Each result has `source`, `status` (`updated`, `not_found`, `ambiguous`, `no_data`, `failed`) and `errorCode` (the provider code on `failed`, `SOURCE_UNAVAILABLE` when the source is not registered, `EXTERNAL_DATA_DEADLINE_EXCEEDED` when the 45 s deadline expired before the source finished, otherwise `null`). A `failed` result also carries `httpStatus` and `retryAfterSeconds` when the site answered with an HTTP error status or a `Retry-After` header; otherwise those fields are absent. Metacritic adds `score` (the stored 0-100 value) on `updated` and the raw `metaScore`/`userScore` whenever there was a match. HLTB adds `duration` (hours) on `updated`. IGDB adds `score` (the stored 0-100 value) on `updated`.

    Records the audit action `game_external_data_refreshed`.

    ### Errors

    - 401 `AUTH_INVALID_TOKEN` — Invalid or expired token.
    - 403 `AUTH_FORBIDDEN` — Caller is not moderator or admin.
    - 404 `GAME_NOT_FOUND` — Game does not exist or is inactive.
    - 422 `AUTH_SCHEMA_INVALID` — Missing Authorization header.
    - 422 `COMMON_SCHEMA_INVALID` — `id` is not a UUID, or `sources` is missing, empty, repeated or has an unknown value.
