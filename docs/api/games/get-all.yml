info:
    name: Get All Games
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/games"

settings:
    encodeUrl: true

docs: |-
    ## Get All Games

    Returns a paginated list of games with optional advanced filters. Each entry is a lightweight card shape — use `GET /games/:code` to fetch the full detail (description, platforms, scores, times, externals, dlcs, parent game, compilation items).

    **Authentication:** Bearer token required (roles: user, premium, moderator).
    **Rate Limit:** 100 requests per minute.

    ### Query Parameters

    | Param              | Type    | Description                                              |
    |--------------------|---------|----------------------------------------------------------|
    | limit              | int     | 1-100, default 50                                        |
    | offset             | int     | default 0                                                |
    | sort_by            | enum    | createdAt, title, releaseAt, random, score, duration, ratio, popularity — default createdAt |
    | sort_order         | enum    | asc, desc — default desc                                 |
    | search             | string  | Partial title match (ILIKE)                              |
    | genre              | string  | Single genre code (legacy, kept for compat)              |
    | genres             | csv     | Multiple genre codes (comma-separated)                   |
    | platforms          | csv     | Multiple platform codes (comma-separated)                |
    | release_year_from  | int     | Inclusive lower bound                                    |
    | release_year_to    | int     | Inclusive upper bound                                    |
    | min_score          | float   | 0-5 (normalized 0-5 scale)                               |
    | max_score          | float   | 0-5                                                      |
    | min_duration       | float   | hours                                                    |
    | max_duration       | float   | hours                                                    |
    | is_dlc             | bool    | true / false to filter DLCs vs games                     |
    | no_scores          | bool    | Admin: games without any score                           |
    | no_times           | bool    | Admin: games without any duration                        |
    | no_platforms       | bool    | Admin: games without platforms                           |
    | no_score_source    | csv     | Admin: games missing these score sources                 |
    | no_time_source     | csv     | Admin: games missing these time sources                  |

    ### Response (200)

    ```json
    {
      "data": {
        "games": [
          {
            "id": "uuid",
            "title": "Metro Exodus",
            "code": "metro-exodus",
            "backgroundUrl": "https://...",
            "isDlc": false,
            "ratio": 0.34,
            "justImported": false,
            "genres": [
              { "id": "uuid", "name": "Shooter", "code": "shooter" }
            ]
          }
        ],
        "total": 1,
        "limit": 50,
        "offset": 0
      }
    }
    ```

    The list shape only includes the fields needed to render a grid card or the featured hero (cover, title, code, isDlc, ratio, genres). `description`, `platforms`, `scores`, `times`, `externalLinks`, `dlcs`, `parentGame`, `compilationItems`, `partOfCompilations`, `coverUrl`, `variant` and `releaseAt` are intentionally omitted to keep the payload small. Filter query params still operate at the DB layer — they don't require those fields to be returned.

    ### Dynamic sort options

    `sort_by` accepts four derived criteria that resolve from related tables:

    - **score** — canonical GameScore picked by source priority: `completr` → `metacritic` → `opencritic` → `rawg`.
    - **duration** — canonical GameTime picked by source priority: `completr` → `hltb` → `rawg`.
    - **ratio** — canonical score divided by canonical duration (NULL when duration is 0).
    - **popularity** — denormalized counter from the `GamePopularities` table (number of distinct users that have the game in their GameShelf). Recomputed by `POST /admin/jobs/recompute-popularity`.

    All dynamic sorts use `NULLS LAST` semantics regardless of order.
