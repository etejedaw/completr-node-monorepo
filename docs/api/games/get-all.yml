info:
    name: Get All Games
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/games"

settings:
    encodeUrl: true

docs: |-
    ## Get All Games

    Returns a paginated list of games with optional advanced filters.

    **Authentication:** Bearer token required (roles: user, premium, moderator).
    **Rate Limit:** 100 requests per minute.

    ### Query Parameters

    | Param              | Type    | Description                                              |
    |--------------------|---------|----------------------------------------------------------|
    | limit              | int     | 1-100, default 50                                        |
    | offset             | int     | default 0                                                |
    | sort_by            | enum    | createdAt, title, releaseAt, random — default createdAt  |
    | sort_order         | enum    | asc, desc — default desc                                 |
    | search             | string  | Partial title match (ILIKE)                              |
    | genre              | string  | Single genre code (legacy, kept for compat)              |
    | genres             | csv     | Multiple genre codes (comma-separated)                   |
    | platforms          | csv     | Multiple platform codes (comma-separated)                |
    | release_year_from  | int     | Inclusive lower bound                                    |
    | release_year_to    | int     | Inclusive upper bound                                    |
    | min_score          | float   | 0-5 (normalized 0-5 scale)                               |
    | max_score          | float   | 0-5                                                      |
    | min_duration       | float   | hours                                                    |
    | max_duration       | float   | hours                                                    |
    | is_dlc             | bool    | true / false to filter DLCs vs games                     |
    | no_scores          | bool    | Admin: games without any score                           |
    | no_times           | bool    | Admin: games without any duration                        |
    | no_platforms       | bool    | Admin: games without platforms                           |
    | no_score_source    | csv     | Admin: games missing these score sources                 |
    | no_time_source     | csv     | Admin: games missing these time sources                  |

    ### Response (200)

    ```json
    {
      "data": {
        "games": [
          {
            "id": "uuid",
            "title": "Metro Exodus",
            "code": "metro-exodus",
            "description": "...",
            "releaseAt": "2019-02-14",
            "platforms": [{ "id": "...", "abbreviation": "steam" }],
            "genres": [{ "id": "...", "code": "shooter", "name": "Shooter" }],
            "scores": [{ "source": "metacritic", "score": 4.1 }],
            "times": [{ "source": "hltb", "duration": 12 }]
          }
        ],
        "total": 1,
        "limit": 50,
        "offset": 0
      }
    }
    ```
