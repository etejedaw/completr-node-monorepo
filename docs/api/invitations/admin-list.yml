info:
    name: Admin List Invitations
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/admin/invitations"

settings:
    encodeUrl: true

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Admin List Invitations

    Lists the invitations that have not been accepted or revoked, newest first. Expired ones are included with `isExpired: true`, so they can be resent or revoked.

    **Authentication:** Bearer token, admin only (other roles get 404).

    ### Response (200)

    ```json
    {
      "data": {
        "invitations": [
          {
            "id": "uuid",
            "email": "newfriend@example.com",
            "createdAt": "2026-10-20T12:00:00.000Z",
            "expiresAt": "2026-10-27T12:00:00.000Z",
            "isExpired": false
          }
        ]
      }
    }
    ```
