info:
    name: Get User Game Shelf
    type: http
    seq: 5

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/game-shelf"
    params:
        - name: username
          value: ""
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User Game Shelf

    Returns the public game collection of a user. Only shows shelf entries with `isPublic = true`. Returns 403 if the user's profile or shelf visibility is set to `private` (or `friends` for a non-mutual viewer).

    **Authentication:** Optional (used to detect self and apply mutual-follow logic).
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description    |
    |----------|--------|----------|----------------|
    | username | string | Yes      | The username   |

    ### Query Parameters

    | Param  | Type    | Required | Description                  |
    |--------|---------|----------|------------------------------|
    | limit  | integer | No       | Page size (default 50, max 100) |
    | offset | integer | No       | Pagination offset (default 0)|

    ### Response (200)

    ```json
    {
      "data": {
        "gameShelf": [
          {
            "id": "uuid",
            "acquiredAt": "2024-01-01",
            "edition": "Deluxe",
            "notes": "My favorite game",
            "isPublic": true,
            "game": {
              "id": "uuid",
              "title": "Resident Evil 4",
              "code": "resident-evil-4",
              "backgroundUrl": "https://...",
              "isDlc": false
            },
            "platform": {
              "id": "uuid",
              "name": "Steam",
              "code": "steam",
              "abbreviation": "Steam",
              "generation": null,
              "logoUrl": null,
              "releaseAt": "2003-09-12T00:00:00.000Z"
            }
          }
        ],
        "total": 1
      }
    }
    ```

    The `game` payload is intentionally lightweight (no description, no nested genres). Use `GET /games/:code` to fetch the full game detail. The `user` object is no longer embedded — the caller already knows the username from the URL.

    ### Errors

    | Status | Code              | Description                        |
    |--------|-------------------|------------------------------------|
    | 403    | USER_PRIVATE      | Profile or shelf visibility blocks |
    | 404    | USER_NOT_FOUND    | Username does not exist            |
