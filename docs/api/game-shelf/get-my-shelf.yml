info:
    name: Get My Game Shelf
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/me/game-shelf"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Game Shelf

    Returns the authenticated user's game shelf with game and platform details.

    **Authentication:** Bearer token required (roles: user, premium, moderator).
    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    | Param  | Type    | Required | Description                  |
    |--------|---------|----------|------------------------------|
    | limit  | integer | No       | Page size (default 50, max 100) |
    | offset | integer | No       | Pagination offset (default 0)|
    | search | string  | No       | Filter by game title (iLike) |

    ### Response (200)

    ```json
    {
      "data": {
        "gameShelf": [
          {
            "id": "uuid",
            "userId": "uuid",
            "acquiredAt": "2024-12-25",
            "edition": "Standard",
            "notes": "Gift from a friend",
            "isPublic": false,
            "inBacklog": true,
            "game": {
              "id": "uuid",
              "title": "Metro Exodus",
              "code": "metro-exodus",
              "backgroundUrl": "https://...",
              "isDlc": false
            },
            "platform": {
              "id": "uuid",
              "name": "Steam",
              "code": "steam",
              "abbreviation": "Steam",
              "generation": null,
              "logoUrl": null,
              "releaseAt": "2003-09-12"
            }
          }
        ],
        "total": 1
      }
    }
    ```

    The `game` payload is intentionally lightweight (no description, no nested genres, no releaseAt). Use `GET /games/:code` for the full detail.

    `inBacklog` is `true` when the authenticated user has at least one backlog entry (any status) for the game.
