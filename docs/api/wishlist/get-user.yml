info:
    name: Get User Wishlist
    type: http
    seq: 4

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/wishlist"
    params:
        - name: username
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get User Wishlist

    Returns a user's public wishlist. Requires `User.isPublic` and `User.isWishlistPublic` to be true.

    **Authentication:** Not required.
    **Rate Limit:** 100 requests per minute.

    ### Response (200)

    Same shape as Get My Wishlist.

    ### Errors

    - 404 `USER_NOT_FOUND`
    - 403 `USER_PRIVATE` — Profile or wishlist is private
