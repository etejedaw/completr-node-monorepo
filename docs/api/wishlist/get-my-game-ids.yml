info:
    name: Get My Wishlist Game Ids
    type: http
    seq: 6

http:
    method: GET
    url: "{{BASE_URL}}/users/me/wishlist/game-ids"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Wishlist Game Ids

    Returns only the game ids in the authenticated user's wishlist, without pagination. Lightweight endpoint intended for membership checks (e.g. wishlist toggles in other views).

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "gameIds": ["uuid", "uuid"]
      }
    }
    ```
