docs: |-
    ## Get IGDB Data by Slug

    Fetches full game data from IGDB by slug without importing it. Used by the admin game editor when IGDB is the selected lookup source. The request goes through the shared IGDB request pacer.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description    |
    |-------|--------|----------|----------------|
    | slug  | string | Yes      | IGDB game slug (1-200 chars) |

    ### Response (200)

    The same shape as `GET /game-external/rawg/:slug`. `coverUrl` is the portrait cover and `backgroundUrl` a horizontal artwork or screenshot (between 4:3 and 2:1), both from `images.igdb.com`. `scores` carries the IGDB user score (`igdb`, 0–100) when the source exists in the catalog. IGDB brings no times.

    ```json
    {
      "data": {
        "game": {
          "source": "igdb",
          "externalId": "14593",
          "title": "Hollow Knight",
          "description": "...",
          "coverUrl": "https://images.igdb.com/igdb/image/upload/t_cover_big_2x/cobfzp.jpg",
          "backgroundUrl": "https://images.igdb.com/igdb/image/upload/t_1080p/ar6bjh.jpg",
          "releaseAt": "2017-02-24",
          "platforms": ["nintendo-switch", "nintendo-switch-2"],
          "genres": ["platformer", "indie"],
          "scores": [{ "source": "igdb", "score": 91.8 }],
          "times": []
        }
      }
    }
    ```

    ### Errors

    - 404 `IGDB_NOT_FOUND` — IGDB has no game for that slug
    - 429 `IGDB_RATE_LIMITED` — IGDB rate limit reached
    - 502 `IGDB_AUTH_ERROR` — Twitch rejected the credentials, or IGDB answered 401 after renewing the token
    - 502 `IGDB_REQUEST_ERROR` — IGDB or Twitch answered with another error status, or the request failed (network)
    - 502 `IGDB_PARSE_ERROR` — IGDB answered with a body that does not have the expected shape
    - 503 `IGDB_DISABLED` — `IGDB_CLIENT_ID` or `IGDB_CLIENT_SECRET` is not configured on the server
