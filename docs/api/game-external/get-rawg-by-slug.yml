docs: |-
    ## Get RAWG Data by Slug

    Fetches full game data from RAWG API by slug. Used by admin editor to populate game fields from RAWG.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description     |
    |-------|--------|----------|-----------------|
    | slug  | string | Yes      | RAWG game slug  |

    ### Response (200)

    ```json
    {
      "data": {
        "game": {
          "rawgId": 58134,
          "title": "Resident Evil 4",
          "description": "...",
          "coverUrl": "https://media.rawg.io/...",
          "releaseAt": "2005-01-11",
          "platforms": ["pc", "playstation-4", "xbox-one"],
          "genres": ["action", "shooter"],
          "scores": [{ "source": "metacritic", "score": 96 }],
          "times": [{ "source": "rawg", "duration": 16 }]
        }
      }
    }
    ```

    ### Errors

    - 404 `RAWG_NOT_FOUND` — RAWG has no game for that slug
    - 429 `RAWG_RATE_LIMITED` — RAWG rate limit reached
    - 502 `RAWG_REQUEST_ERROR` — RAWG answered with another error status, or the request to RAWG failed (network)
    - 502 `RAWG_PARSE_ERROR` — RAWG answered with a body that is not valid JSON
    - 503 `RAWG_DISABLED` — `RAWG_API_KEY` is not configured on the server
