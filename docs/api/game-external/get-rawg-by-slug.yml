info:
    name: Get RAWG Data by Slug
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/game-external/rawg/:slug"
    params:
        - name: slug
          value: resident-evil-4
          type: path
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get RAWG Data by Slug

    Fetches full game data from RAWG API by slug. Used by admin editor to populate game fields from RAWG.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description     |
    |-------|--------|----------|-----------------|
    | slug  | string | Yes      | RAWG game slug  |

    ### Response (200)

    ```json
    {
      "data": {
        "game": {
          "rawgId": 58134,
          "title": "Resident Evil 4",
          "description": "...",
          "coverUrl": "https://media.rawg.io/...",
          "backgroundUrl": "https://media.rawg.io/...",
          "releaseAt": "2005-01-11",
          "metacritic": 96,
          "playtime": 16,
          "rating": 4.35,
          "platforms": ["pc", "playstation-4", "xbox-one"],
          "genres": ["action", "shooter"]
        }
      }
    }
    ```
