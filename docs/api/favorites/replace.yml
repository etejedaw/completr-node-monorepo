info:
    name: Replace Favorites
    type: http
    seq: 1

http:
    method: PUT
    url: "{{BASE_URL}}/users/me/favorites"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "gameIds": ["uuid1", "uuid2", "uuid3"]
            }

settings:
    encodeUrl: true

docs: |-
    ## Replace Favorites

    Replaces the entire favorites list with the given gameIds in order. Accepts an empty array to clear favorites.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field   | Type   | Required | Description                         |
    |---------|--------|----------|-------------------------------------|
    | gameIds | uuid[] | Yes      | Array of game UUIDs (no duplicates) |

    ### Response (200)

    ```json
    {
      "data": {
        "favorites": [
          {
            "id": "uuid",
            "position": 1,
            "game": { "id": "uuid", "title": "...", "coverUrl": "...", "isDlc": false }
          }
        ]
      }
    }
    ```

    ### Errors

    - 402 `FAVORITE_LIMIT_REACHED` — Free plan limit (10) exceeded
    - 404 `FAVORITE_GAMES_NOT_FOUND` — One or more gameIds not found (includes missing IDs in context)
