info:
    name: Get User Favorites
    type: http
    seq: 3

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/favorites"
    params:
        - name: username
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get User Favorites

    Returns a user's public favorites. Requires `User.isPublic` and `User.isFavoritePublic` to be true.

    **Authentication:** Not required.
    **Rate Limit:** 100 requests per minute.

    ### Response (200)

    Same shape as Get My Favorites.

    ### Errors

    - 404 `USER_NOT_FOUND`
    - 403 `USER_PRIVATE` — Profile or favorites is private
