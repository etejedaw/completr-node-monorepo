info:
    name: Bulk Add Favorites
    type: http
    seq: 6

http:
    method: POST
    url: "{{BASE_URL}}/users/me/favorites/bulk?action=add"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    params:
        - name: action
          type: query
          value: add
    body:
        type: json
        data: |-
            {
              "gameIds": [
                "0b6f1c9e-3d0a-4a59-9a43-5c1e2f7d8a10",
                "5e2d7f40-8c1b-4f6e-b2a9-1d3c4e5f6a7b"
              ]
            }

settings:
    encodeUrl: true

docs: |-
    ## Bulk Add Favorites

    Appends several games after the user's current favorites, in the order received.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Query Params

    | Param  | Type   | Required | Description |
    |--------|--------|----------|-------------|
    | action | string | Yes      | `add`   |

    ### Request Body

    | Field   | Type   | Required | Description |
    |---------|--------|----------|-------------|
    | gameIds | uuid[] | Yes      | 1 to 100 game ids |

    Duplicated ids are removed by the server (not an error). The whole batch runs in a single transaction. An id that does not exist or is not the user's never fails the batch: it goes to `skipped` with the code shown below.

    ### Response (200)

    ```json
    {
      "data": {
        "action": "add",
        "succeeded": [
          "0b6f1c9e-3d0a-4a59-9a43-5c1e2f7d8a10"
        ],
        "skipped": [
          {
            "id": "5e2d7f40-8c1b-4f6e-b2a9-1d3c4e5f6a7b",
            "code": "FAVORITE_GAMES_NOT_FOUND"
          }
        ]
      }
    }
    ```

    A game that is already a favorite is reported in `succeeded` without being duplicated. A `favorite_added` activity is recorded only for the games actually added. If the batch would take a free user over the favorites limit, nothing is applied.

    ### Errors

    - 402 `FAVORITE_LIMIT_REACHED` — the batch would exceed the free plan limit; nothing is added
    - 200 skipped `FAVORITE_GAMES_NOT_FOUND` — the game does not exist
    - 422 `COMMON_SCHEMA_INVALID` — unknown or missing `action`, a body that does not match the action, an empty list, more than 100 ids, a value that is not a UUID or an extra field
    - 401 `AUTH_INVALID_TOKEN` — missing, expired or invalid token
