info:
    name: Get My Favorite Game Ids
    type: http
    seq: 4

http:
    method: GET
    url: "{{BASE_URL}}/users/me/favorites/game-ids"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Favorite Game Ids

    Returns only the game ids of the authenticated user's favorites, without pagination. Lightweight endpoint intended for membership checks (e.g. highlighting favorite games in other views).

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "gameIds": ["uuid", "uuid"]
      }
    }
    ```
