info:
    name: Bulk Remove Favorites
    type: http
    seq: 7

http:
    method: POST
    url: "{{BASE_URL}}/users/me/favorites/bulk?action=remove"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    params:
        - name: action
          type: query
          value: remove
    body:
        type: json
        data: |-
            {
              "gameIds": [
                "0b6f1c9e-3d0a-4a59-9a43-5c1e2f7d8a10",
                "5e2d7f40-8c1b-4f6e-b2a9-1d3c4e5f6a7b"
              ]
