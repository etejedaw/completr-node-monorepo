info:
    name: Get My Favorites
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/me/favorites"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Favorites

    Returns the authenticated user's favorites ordered by position.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "favorites": [
          {
            "id": "uuid",
            "position": 1,
            "game": { "id": "uuid", "title": "...", "coverUrl": "...", "isDlc": false }
          }
        ]
      }
    }
    ```
