info:
    name: Get Rewind OG Image
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/share/rewind/:username/:year/og.png"
    params:
        - name: username
          type: path
          value: ""
        - name: year
          type: path
          value: "2026"

settings:
    encodeUrl: true

docs: |-
    ## Get Rewind OG Image

    Renders the user's yearly Rewind as a 1200×630 PNG for link previews (`og:image` of `GET /share/rewind/:username/:year`). Wordmark, `@username`, the year and three tally rows on the left, up to 3 covers fanned out on the right.

    The data comes from the same function as `GET /users/:username/rewinds/:year`, so privacy and errors are identical: the owner sees all their runs, anyone else only public runs. The year must be generated by the owner (`POST /users/me/rewinds/:year`): until then guests and other users get 404 `REWIND_NOT_FOUND` and the owner gets 404 `REWIND_NOT_GENERATED`. Every text of the image (persona, stat labels, `@username`'s Rewind label, summary sentence and number format) is written in the `language` the owner chose when generating (`en` or `es`), for every viewer. The image is drawn server-side with satori (SVG) and resvg (PNG) using fixed Refined Dark colors and the bundled Chakra Petch and Manrope fonts, so it does not depend on the viewer's theme. Covers are downloaded with a 3 s timeout; a cover that fails or is missing is drawn as a gradient with the game title. Long titles are truncated with an ellipsis and emoji are removed.

    Rendered PNGs are cached in memory (LRU, 100 entries) by username, year, language, format and a hash of the Rewind JSON, so any change in the data produces a new image. Simultaneous requests for the same image share one render. Images with covers that failed to download are not cached.

    The web app requests it with `HttpClient` as a `Blob` because the token travels in the `Authorization` header.

    **Authentication:** Bearer token optional. When absent or invalid the viewer is treated as a guest.
    **Rate Limit:** 300 requests per minute (public).

    ### Path Params

    | Param    | Type   | Required | Description                 |
    |----------|--------|----------|-----------------------------|
    | username | string | Yes      | Profile username            |
    | year     | int    | Yes      | Rewind year, 2000 to 2100   |

    ### Response (200)

    Binary PNG body.

    | Header                       | Value                                                                 |
    |------------------------------|-----------------------------------------------------------------------|
    | Content-Type                 | `image/png`                                                           |
    | Cache-Control                | `private, max-age=300` with a signed-in viewer, `public, max-age=3600` for guests |
    | Vary                         | `Authorization`                                                       |
    | Cross-Origin-Resource-Policy | `cross-origin`                                                        |

    ### Errors

    | Status | Code                  | Description                                                        |
    |--------|-----------------------|--------------------------------------------------------------------|
    | 404    | USER_NOT_FOUND        | Username does not exist                                            |
    | 403    | USER_PRIVATE          | The viewer cannot see the profile or the rewind section            |
    | 404    | REWIND_NOT_FOUND      | The year is not open yet, has no data for this viewer or (for anyone but the owner) is not generated |
    | 404    | REWIND_NOT_GENERATED  | The owner requests a year they have not generated                  |
    | 422    | COMMON_SCHEMA_INVALID | `year` is not an integer between 2000 and 2100                     |
