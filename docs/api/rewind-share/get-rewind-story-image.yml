info:
    name: Get Rewind Story Image
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/rewinds/:year/story.png"
    params:
        - name: username
          type: path
          value: ""
        - name: year
          type: path
          value: "2026"

settings:
    encodeUrl: true

docs: |-
    ## Get Rewind Story Image

    Renders the user's yearly Rewind as a 1080×1920 PNG for Instagram stories and the share preview in the Rewind page. The layout keeps the top 220 px and the bottom 280 px free of important content (story safe area): wordmark, `@username`, the year, up to 4 covers, the results tally (Finished or Started, Left behind, Hours played, Platinums when visible) and the favorite genre and top rated game.

    The data comes from the same function as `GET /users/:username/rewinds/:year`, so privacy and errors are identical: the owner sees all their runs, anyone else only public runs. The image is drawn server-side with satori (SVG) and resvg (PNG) using fixed Refined Dark colors and the bundled Chakra Petch and Manrope fonts, so it does not depend on the viewer's theme. Covers are downloaded with a 3 s timeout; a cover that fails or is missing is drawn as a gradient with the game title. Long titles are truncated with an ellipsis and emoji are removed.

    Rendered PNGs are cached in memory (LRU, 100 entries) by username, year, format and a hash of the Rewind JSON, so any change in the data produces a new image. Simultaneous requests for the same image share one render. Images with covers that failed to download are not cached.

    The web app requests it with `HttpClient` as a `Blob` because the token travels in the `Authorization` header.

    **Authentication:** Bearer token optional. When absent or invalid the viewer is treated as a guest.
    **Rate Limit:** 300 requests per minute (public).

    ### Path Params

    | Param    | Type   | Required | Description                 |
    |----------|--------|----------|-----------------------------|
    | username | string | Yes      | Profile username            |
    | year     | int    | Yes      | Rewind year, 2000 to 2100   |

    ### Response (200)

    Binary PNG body.

    | Header                       | Value                                                                 |
    |------------------------------|-----------------------------------------------------------------------|
    | Content-Type                 | `image/png`                                                           |
    | Cache-Control                | `private, max-age=300` with a signed-in viewer, `public, max-age=3600` for guests |
    | Vary                         | `Authorization`                                                       |
    | Cross-Origin-Resource-Policy | `cross-origin`                                                        |

    ### Errors

    | Status | Code                  | Description                                                        |
    |--------|-----------------------|--------------------------------------------------------------------|
    | 404    | USER_NOT_FOUND        | Username does not exist                                            |
    | 403    | USER_PRIVATE          | The viewer cannot see the profile or the rewind section            |
    | 404    | REWIND_NOT_FOUND      | The year is not open yet or has no data for this viewer            |
    | 422    | COMMON_SCHEMA_INVALID | `year` is not an integer between 2000 and 2100                     |
