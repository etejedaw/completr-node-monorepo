info:
    name: List Rewind Editions
    type: http
    seq: 1

http:
    method: GET
    url: "{{BASE_URL}}/admin/rewind/editions"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## List Rewind Editions

    Lists every Rewind edition, newest year first, with the designs an edition can use (`"2025"` and `"2026"`, the last one being the latest). The `"2025"` design has no share images. `status` is `scheduled` before `opensAt`, `open` from `opensAt` to `closesAt` (both included) and `closed` after, comparing UTC days and honoring `REWIND_TODAY` outside prod. `inProgress` is true exactly when `status` is `open`. `generatedCount` is the number of rewinds of that year.

    **Authentication:** Bearer token, admin only. Other roles receive 404 `AUTH_ROUTE_NOT_FOUND`.

    ### Response (200)

    ```json
    {
      "data": {
        "editions": [
    {
      "year": 2026,
      "opensAt": "2026-12-01",
      "closesAt": "2027-01-31",
      "graceStartsAt": "2027-01-01",
      "graceEndsAt": "2027-01-07",
      "design": "2026",
      "premiumRegenerations": 3,
      "giftRegenerations": 1,
      "frozenAt": null,
      "status": "scheduled",
      "inProgress": false,
      "generatedCount": 42
    }
        ],
        "designs": ["2025", "2026"]
      }
    }
    ```

    Dates are `YYYY-MM-DD` days in UTC+0. `frozenAt` is an ISO date-time once the edition is frozen.
