info:
    name: Get Saved Filter Stats
    type: http
    seq: 5

http:
    method: GET
    url: "{{BASE_URL}}/users/me/saved-filters/:filterId/stats"
    params:
        - name: filterId
          value: ""
          type: path
        - name: status
          value: playing,not_started
          type: query
          disabled: true
        - name: mood_tags
          value: cozy,short
          type: query
          disabled: true
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get Saved Filter Stats

    Returns aggregated statistics over the backlog entries that match the saved filter's stored query. The same WHERE used by `GET /users/me/backlog` is applied, but no rows are returned — only aggregations computed in SQL.

    The request can also send the filters currently applied on top of the view (a modified view in My Games). When any query param of `GET /users/me/backlog` arrives, the stats are computed with those params instead of the stored filters, and the saved filter is not changed.

    Only the owner of the saved filter can read its stats.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param    | Type | Required | Description           |
    |----------|------|----------|-----------------------|
    | filterId | uuid | Yes      | The saved filter UUID |

    ### Query Parameters

    Optional. The same params, validation and semantics as `GET /users/me/backlog` (`status`, `platforms`, `genres`, `release_year_from`, `started_from`, `min_ratio`, `mood_tags`, `coop_only`, `platinumed_only`, `search`, `sort_by`…). `mood_tags` keeps only entries whose game has every listed tag set by the owner.

    - Without any of these params, the stored filters are used.
    - With at least one of them, the stored filters are ignored entirely: a param missing from the query is not taken from the view. Params that filter nothing (`sort_by`, `sort_order`, `limit`, `offset`, or an empty `platforms=`) still replace the stored filters, so `?sort_by=createdAt` computes over the whole library. This is how a client asks for a view whose applied filters were all removed.
    - Params the backlog does not know (for example `savedFilterId`) are ignored and do not replace the stored filters.

    ### Response (200)

    ```json
    {
      "data": {
        "stats": {
          "totalEntries": 42,
          "countByStatus": {
            "not_started": 5,
            "playing": 2,
            "completed": 30,
            "abandoned": 4,
            "endless": 1
          },
          "totalRealHours": 612.5,
          "avgRealDuration": 20.42,
          "avgEstimatedDuration": 18.7,
          "avgScore": 82.4,
          "avgUserRating": 7.6,
          "avgRatio": 94.2,
          "avgPersonalRatio": 80.6,
          "estimatedVsRealDelta": 52.1,
          "completionRate": 0.714,
          "abandonmentRate": 0.095,
          "longestPlayed": {
            "backlogId": "uuid",
            "game": { "id": "uuid", "code": "elden-ring", "title": "Elden Ring", "coverUrl": "https://images.igdb.com/igdb/image/upload/t_cover_big/co1abc.jpg", "backgroundUrl": "https://..." },
            "value": 92.5
          },
          "bestPersonalRatio": {
            "backlogId": "uuid",
            "game": { "id": "uuid", "code": "florence", "title": "Florence", "coverUrl": "https://images.igdb.com/igdb/image/upload/t_cover_big/co1abc.jpg", "backgroundUrl": "https://..." },
            "value": 82
          },
          "highestRated": {
            "backlogId": "uuid",
            "game": { "id": "uuid", "code": "the-witcher-3", "title": "The Witcher 3", "coverUrl": "https://images.igdb.com/igdb/image/upload/t_cover_big/co1abc.jpg", "backgroundUrl": "https://..." },
            "value": 10
          },
          "ratingDistribution": [
            { "stars": 5, "count": 3 },
            { "stars": 4, "count": 8 },
            { "stars": 3, "count": 2 },
            { "stars": 2, "count": 0 },
            { "stars": 1, "count": 1 }
          ],
          "completionsByMonth": [
            { "month": "2025-01", "count": 0 },
            { "month": "2025-02", "count": 2 },
            { "month": "...", "count": 1 },
            { "month": "2025-12", "count": 3 }
          ]
        }
      }
    }
    ```

    ### Notes

    - `totalRealHours` sums `realDuration` across all matching entries (nulls ignored).
    - `avgRatio` = `AVG(score / NULLIF(duration, 0)) * 20`, rounded to 2 decimals (0-100 scale, same as `ratio` of a backlog entry).
    - `avgPersonalRatio` = `AVG(score / NULLIF(realDuration, 0)) * 20`, rounded to 2 decimals (0-100 scale, same as `personalRatio`). The `value` of `bestPersonalRatio` uses the same scale.
    - `estimatedVsRealDelta` = `SUM(realDuration - duration)` over `completed` entries. Positive means players took longer than the estimated duration on average.
    - `completionRate` / `abandonmentRate` are ratios in [0, 1] (multiply by 100 for percent). `null` when `totalEntries = 0`.
    - Highlights (`longestPlayed`, `bestPersonalRatio`, `highestRated`) return the single matching entry with its `value`. `null` when no entry has the required field populated.
    - `ratingDistribution` always has five buckets ordered from 5 to 1 stars. Each `userRating` (0–5, half steps) is rounded up to its bucket (`4.5` → 5, `0.5` → 1); unrated entries are not counted.
    - `completionsByMonth` has 12 consecutive months (`YYYY-MM`) of `completed` entries by `finishedAt`, ending at the month of the most recent completion in the filter (not the current month), so past semesters still show their activity. Empty array when no completed entry has `finishedAt`.
    - Numeric fields return `null` when there is no data to aggregate.

    ### Errors

    | Code                          | HTTP | Description                          |
    |-------------------------------|------|--------------------------------------|
    | SAVED_FILTER_NOT_FOUND        | 404  | Filter missing or not the caller's, also when query params are sent |
    | COMMON_SCHEMA_INVALID         | 422  | A query param is invalid (unknown status, non-numeric range, empty tag list, repeated param…) |
    | SAVED_FILTER_VALIDATION_ERROR | 422  | Stored filters JSON is not valid and no query params were sent |
