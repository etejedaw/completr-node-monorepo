info:
    name: Reorder Saved Filters
    type: http
    seq: 4

http:
    method: PUT
    url: "{{BASE_URL}}/users/me/saved-filters/reorder"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "ids": [
                "11111111-1111-1111-1111-111111111111",
                "22222222-2222-2222-2222-222222222222"
              ]
            }

settings:
    encodeUrl: true

docs: |-
    ## Reorder Saved Filters

    Sets a persistent custom order for the authenticated user's saved filters.
    Positions are assigned from the order of the `ids` array (first id → position 1).
    Used to arrange the pinned views (`showInBacklog`) as chips in the backlog.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field | Type   | Required | Description                                                        |
    |-------|--------|----------|--------------------------------------------------------------------|
    | ids   | uuid[] | Yes      | Ordered list of saved filter ids (1-100, unique). All must belong to the user. |

    ### Response (200)

    Returns all the user's saved filters ordered by their new position.

    ```json
    {
      "data": {
        "savedFilters": [
          {
            "id": "11111111-1111-1111-1111-111111111111",
            "name": "Completed 2025",
            "filters": { ... },
            "sortBy": "finishedAt",
            "sortOrder": "desc",
            "showInBacklog": true,
            "isDefault": false,
            "enabledStats": null,
            "createdAt": "2025-01-15T12:00:00.000Z"
          }
        ]
      }
    }
    ```

    ### Errors

    | Status | Code                   | When                                    |
    |--------|------------------------|-----------------------------------------|
    | 404    | SAVED_FILTER_NOT_FOUND | An id does not exist or is not the user's |
