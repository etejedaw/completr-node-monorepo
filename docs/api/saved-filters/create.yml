info:
    name: Create Saved Filter
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/users/me/saved-filters"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "name": "Completados 2025-S01",
              "filters": {
                "status": "completed",
                "finished_from": "2025-01-01",
                "finished_to": "2025-06-30"
              },
              "sortBy": "finishedAt",
              "sortOrder": "desc",
              "enabledStats": ["totalEntries", "totalRealHours", "avgRatio", "completionRate"]
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Saved Filter

    Creates a saved filter (view) for the backlog.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field         | Type     | Required | Description                                      |
    |---------------|----------|----------|--------------------------------------------------|
    | name          | string   | Yes      | Filter name (1-100 chars)                        |
    | filters       | object   | Yes      | Query params to save as preset                   |
    | sortBy        | string   | No       | Sort field                                       |
    | sortOrder     | string   | No       | asc or desc (default: desc)                      |
    | showInBacklog | boolean  | No       | Whether the view appears as a chip in the backlog|
    | isDefault     | boolean  | No       | Auto-apply this view when opening the backlog    |
    | enabledStats  | string[] | No       | Stat keys to render in the panel. `null` = frontend defaults. Allowed keys: `totalEntries`, `totalRealHours`, `avgRatio`, `avgPersonalRatio`, `completionRate`, `abandonmentRate`, `avgRealDuration`, `avgEstimatedDuration`, `avgScore`, `avgUserRating`, `estimatedVsRealDelta`, `longestPlayed`, `bestPersonalRatio`, `highestRated`, `countByStatus` |
    | icon          | string   | No       | Icon for the chip/card. `null` to clear. Allowed: `bookmark`, `star`, `favorite`, `sports_esports`, `emoji_events`, `flag`, `check_circle`, `schedule`, `bolt`, `local_fire_department`, `filter_alt`, `list`, `calendar_month`, `military_tech`, `rocket_launch`, `visibility` |
    | color         | string   | No       | Color token for the chip/card. `null` to clear. Allowed: `brand`, `sky`, `emerald`, `amber`, `rose`, `purple`, `teal`, `slate` |

    ### Response (201)

    ```json
    {
      "data": {
        "savedFilter": {
          "id": "uuid",
          "name": "Completados 2025-S01",
          "filters": { "status": "completed", "finished_from": "2025-01-01", "finished_to": "2025-06-30" },
          "sortBy": "finishedAt",
          "sortOrder": "desc",
          "showInBacklog": true,
          "isDefault": false,
          "enabledStats": ["totalEntries", "totalRealHours", "avgRatio", "completionRate"],
          "icon": "check_circle",
          "color": "emerald"
        }
      }
    }
    ```
