info:
    name: Create Saved Filter
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/users/me/saved-filters"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "name": "Completados 2025-S01",
              "filters": {
                "status": "completed",
                "finished_from": "2025-01-01",
                "finished_to": "2025-06-30"
              },
              "sortBy": "finishedAt",
              "sortOrder": "desc"
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Saved Filter

    Creates a saved filter (view) for the backlog. Free users can save up to 5 filters. Premium users have unlimited.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field     | Type   | Required | Description                          |
    |-----------|--------|----------|--------------------------------------|
    | name      | string | Yes      | Filter name (1-100 chars)            |
    | filters   | object | Yes      | Query params to save as preset       |
    | sortBy    | string | No       | Sort field                           |
    | sortOrder | string | No       | asc or desc (default: desc)          |

    ### Response (201)

    ```json
    {
      "data": {
        "savedFilter": {
          "id": "uuid",
          "userId": "uuid",
          "name": "Completados 2025-S01",
          "filters": { "status": "completed", "finished_from": "2025-01-01", "finished_to": "2025-06-30" },
          "sortBy": "finishedAt",
          "sortOrder": "desc"
        }
      }
    }
    ```
