docs: |-
    ## Update Backlog

    Updates an existing backlog. Only the owner can update it.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param          | Type | Required | Description          |
    |----------------|------|----------|----------------------|
    | backlogId  | uuid | Yes      | The backlog UUID |

    ### Request Body

    | Field        | Type   | Required | Description                                |
    |--------------|--------|----------|--------------------------------------------|
    | status       | string | No       | not_started, playing, completed, abandoned |
    | startedAt    | date   | No       | ISO date                                   |
    | finishedAt   | date   | No       | ISO date                                   |
    | realDuration | number | No       | Duration in hours                          |
    | userRating   | number | No       | 1-10 in steps of 0.5                       |
    | notes        | string | No       | Free text                                  |

    ### Response (200)

    ```json
    {
      "data": {
        "backlog": {
          "id": "uuid",
          "status": "completed",
          "finishedAt": "2025-06-15",
          "realDuration": 12.5,
          "userRating": 8.5,
          "notes": "Great game",
          "hasReview": false,
          "reviewContent": null,
          "backlogNumber": null,
          "game": { "id": "uuid", "title": "..." },
          "platform": { "id": "uuid", "name": "..." }
        },
        "queueRemoved": true
      }
    }
    ```

    `queueRemoved` is `true` when transitioning the backlog to `completed` or `abandoned` triggered an auto-removal from the user's Queue. `false` otherwise. The frontend uses this flag to surface a toast like "Removed from your Queue: <title> — completed".
