info:
    name: Export My Backlog
    type: http
    seq: 6

http:
    method: GET
    url: "{{BASE_URL}}/users/me/backlog/export?format=csv"
    params:
        - name: format
          value: csv
          type: query
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Export My Backlog

    Downloads the whole collection of the authenticated user as a file: no pagination and no filters. `format=csv` is available to every role; `format=json` requires `premium`, `moderator` or `admin`.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Query Params

    | Param  | Type   | Required | Description                         |
    |--------|--------|----------|-------------------------------------|
    | format | string | No       | `csv` (default) or `json` (premium) |

    ### Response (200)

    Headers:

    - `Content-Disposition: attachment; filename="completr-backlog-YYYY-MM-DD.csv"` (date in UTC; exposed to the browser through CORS `Access-Control-Expose-Headers`)
    - `Content-Type: text/csv; charset=utf-8` for CSV, `application/json; charset=utf-8` for JSON

    CSV: UTF-8 BOM, a header row with the column names, comma separator, `\r\n` line endings and RFC 4180 quoting (fields with a comma, a quote or a line break are wrapped in double quotes, inner quotes are doubled). Text that starts with `=`, `+`, `-`, `@`, tab or carriage return is prefixed with `'` to prevent formula injection. `null` is an empty field. An empty collection returns only the header row.

    JSON: a bare array (not wrapped in `data`) with one object per row, the same keys as the CSV columns and native types. An empty collection returns `[]`.

    Rows are ordered like the default backlog view: newest entry first (`createdAt` descending).

    ### Columns

    | Column | Type | Description |
    |--------|------|-------------|
    | gameTitle | string | Game title |
    | gameCode | string | Game slug (`/games/:code`), useful to match the game on reimport |
    | platform | string | Platform name |
    | status | string | `not_started` \| `playing` \| `completed` \| `abandoned` \| `endless` |
    | score | number \| null | Score frozen on the entry |
    | duration | number \| null | Estimated duration in hours |
    | ratio | number \| null | `(score / 5 * 100) / duration`, rounded to 2 decimals |
    | realDuration | number \| null | Hours actually played |
    | personalRatio | number \| null | Ratio with `realDuration` |
    | userRating | number \| null | Personal rating |
    | startedAt | string \| null | `YYYY-MM-DD` |
    | finishedAt | string \| null | `YYYY-MM-DD` |
    | notes | string \| null | Private notes |
    | isPublic | boolean | Entry visible on the public profile |
    | compilationTitle | string \| null | Compilation the game was played from |
    | addedAt | string | ISO 8601 date-time the entry was created |

    ```json
    [
      {
        "gameTitle": "Hollow Knight",
        "gameCode": "hollow-knight",
        "platform": "Nintendo Switch",
        "status": "completed",
        "score": 4.5,
        "duration": 27,
        "ratio": 3.33,
        "realDuration": 41,
        "personalRatio": 2.2,
        "userRating": 5,
        "startedAt": "2026-01-04",
        "finishedAt": "2026-02-15",
        "notes": "Steel Soul pending",
        "isPublic": true,
        "compilationTitle": null,
        "addedAt": "2026-01-04T21:10:00.000Z"
      }
    ]
    ```

    ### Errors

    - 401 `AUTH_INVALID_TOKEN` — Invalid or expired token
    - 422 `AUTH_SCHEMA_INVALID` — Missing `Authorization` header
    - 422 `COMMON_SCHEMA_INVALID` — `format` is not `csv` or `json`
    - 402 `EXPORT_FORMAT_PREMIUM` — `format=json` requested by a `user` (free) account
