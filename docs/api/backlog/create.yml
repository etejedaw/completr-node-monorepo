info:
    name: Create Backlog
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/users/me/backlog"
    headers:
        - name: Content-Type
          value: application/json
    auth: inherit
    body:
        type: json
        data: |-
            {
              "gameId": "",
              "platformId": ""
            }

settings:
    encodeUrl: true

docs: |-
    ## Create Backlog

    Creates a new backlog for the authenticated user. Default status is `not_started`.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Request Body

    | Field        | Type   | Required | Description                                      |
    |--------------|--------|----------|--------------------------------------------------|
    | gameId       | uuid   | Yes      | The game UUID                                    |
    | platformId   | uuid   | Yes      | The platform UUID                                |
    | score        | number | Yes      | Critic score on a 0–5 scale (> 0, max 5, up to 2 decimals) |
    | duration     | number | Yes      | Average duration in hours (> 0, up to 2 decimals) |
    | status       | string | No       | not_started, playing, completed, abandoned, endless |
    | startedAt    | date   | No       | ISO date                                         |
    | finishedAt   | date   | No       | ISO date                                         |
    | realDuration | number | No       | Duration in hours                                |
    | userRating   | number | No       | 1-10 in steps of 0.5                             |
    | notes        | string | No       | Free text                                        |

    ### Response (201)

    ```json
    {
      "data": {
        "backlog": {
          "id": "uuid",
          "status": "not_started",
          "score": 4,
          "duration": 10,
          "ratio": 8,
          "personalRatio": null,
          "startedAt": null,
          "finishedAt": null,
          "realDuration": null,
          "userRating": null,
          "notes": null,
          "hasReview": false,
          "reviewContent": null,
          "backlogNumber": null,
          "createdAt": "...",
          "game": { "id": "uuid", "title": "..." },
          "platform": { "id": "uuid", "name": "..." }
        }
      }
    }
    ```

    `ratio` and `personalRatio` are always present: `null` when the score or the duration (`realDuration` for `personalRatio`) is missing.

    ### Errors

    - 409 `BACKLOG_UNIQUE_CONSTRAINT` — The backlog entry already exists
    - 400 `BACKLOG_VALIDATION_ERROR` — Invalid data
    - 422 `COMMON_SCHEMA_INVALID` — Body does not match the schema (for example `gameId` or `platformId` is not a UUID)
