docs: |-
    ## Get User Backlogs

    Returns the public backlog history of a user. Returns 403 if the user's profile is private. Supports the same filters and sorting as the authenticated endpoint.

    **Authentication:** None required (public endpoint).
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description  |
    |----------|--------|----------|--------------|
    | username | string | Yes      | The username |

    ### Query Parameters

    | Param         | Type   | Required | Description                                                                 |
    |---------------|--------|----------|-----------------------------------------------------------------------------|
    | status        | string | No       | Filter by status. Single or comma-separated: `completed,abandoned`          |
    | game_id       | uuid   | No       | Filter by specific game                                                     |
    | platform_id   | uuid   | No       | Filter by specific platform                                                 |
    | started_from  | date   | No       | Filter by startedAt >= date (ISO format: `2025-01-01`)                      |
    | started_to    | date   | No       | Filter by startedAt <= date (ISO format: `2025-06-30`)                      |
    | finished_from | date   | No       | Filter by finishedAt >= date (ISO format: `2025-01-01`)                     |
    | finished_to       | date   | No       | Filter by finishedAt <= date (ISO format: `2025-06-30`)                     |
    | no_finished_date  | bool   | No       | If `true`, returns only entries with no finishedAt date                      |
    | min_score     | number | No       | Filter by score >= value                                                    |
    | max_score     | number | No       | Filter by score <= value                                                    |
    | min_duration      | number | No       | Filter by duration >= value (hours)                                         |
    | max_duration      | number | No       | Filter by duration <= value (hours)                                         |
    | min_real_duration | number | No       | Filter by realDuration >= value (hours)                                     |
    | max_real_duration | number | No       | Filter by realDuration <= value (hours)                                     |
    | min_rating    | number | No       | Filter by userRating >= value                                               |
    | max_rating    | number | No       | Filter by userRating <= value                                               |
    | sort_by       | string | No       | Sort field: `status`, `score`, `duration`, `startedAt`, `finishedAt`, `realDuration`, `userRating`, `createdAt` (default: `createdAt`) |
    | sort_order    | string | No       | Sort direction: `asc` or `desc` (default: `desc`)                          |

    **Valid statuses:** `not_started`, `playing`, `completed`, `abandoned`, `endless`

    ### Response (200)

    ```json
    {
      "data": {
        "backlog": [
          {
            "id": "uuid",
            "status": "completed",
            "score": 85,
            "duration": 12,
            "ratio": 7.08,
            "startedAt": "2025-01-01T00:00:00.000Z",
            "finishedAt": "2025-01-15T00:00:00.000Z",
            "realDuration": 10.5,
            "userRating": 8.5,
            "isPublic": true,
            "notes": "Great game",
            "game": { "id": "uuid", "title": "Fez", "coverUrl": "https://...", "isDlc": false },
            "platform": { "id": "uuid", "abbreviation": "Steam" }
          }
        ]
      }
    }
    ```
