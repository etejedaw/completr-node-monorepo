info:
    name: Get User Backlogs
    type: http
    seq: 5

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/backlog"
    params:
        - name: username
          value: ""
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get User Backlogs

    Returns the public backlog history of a user. Returns 403 if the user's profile is private. Supports the same filters as the authenticated endpoint.

    **Authentication:** None required (public endpoint).
    **Rate Limit:** 100 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description  |
    |----------|--------|----------|--------------|
    | username | string | Yes      | The username |

    ### Query Parameters

    | Param   | Type   | Required | Description                                           |
    |---------|--------|----------|-------------------------------------------------------|
    | status  | string | No       | Filter by: not_started, playing, completed, abandoned |
    | game_id | uuid   | No       | Filter by specific game                               |
    | from    | date   | No       | Filter by finishedAt >= date (ISO)                    |
    | to      | date   | No       | Filter by finishedAt <= date (ISO)                    |

    ### Response (200)

    ```json
    {
      "data": {
        "backlogs": [
          {
            "id": "uuid",
            "status": "completed",
            "startedAt": "2025-01-01",
            "finishedAt": "2025-01-15",
            "realDuration": 12.5,
            "userRating": 8.5,
            "notes": "Great game",
            "backlogNumber": 1,
            "createdAt": "...",
            "game": { "id": "uuid", "title": "..." },
            "platform": { "id": "uuid", "name": "..." }
          }
        ]
      }
    }
    ```
