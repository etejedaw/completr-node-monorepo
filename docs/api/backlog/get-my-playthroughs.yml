info:
    name: Get My Backlogs
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/users/me/backlog"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Backlogs

    Returns the authenticated user's backlog history. Supports filters and sorting via query params.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Query Parameters

    | Param         | Type   | Required | Description                                                                 |
    |---------------|--------|----------|-----------------------------------------------------------------------------|
    | status        | string | No       | Filter by status. Single or comma-separated: `completed,abandoned`          |
    | game_id       | uuid   | No       | Filter by specific game                                                     |
    | platform_id   | uuid   | No       | Filter by specific platform (legacy single id)                              |
    | platforms     | string | No       | Filter by platform codes, comma-separated (e.g. `ps5,switch`)               |
    | genres        | string | No       | Filter by genre codes, comma-separated (e.g. `action,rpg`)                  |
    | release_year_from | number | No   | Filter by game release year >= value                                        |
    | release_year_to   | number | No   | Filter by game release year <= value                                        |
    | started_from  | date   | No       | Filter by startedAt >= date (ISO format: `2025-01-01`)                      |
    | started_to    | date   | No       | Filter by startedAt <= date (ISO format: `2025-06-30`)                      |
    | finished_from | date   | No       | Filter by finishedAt >= date (ISO format: `2025-01-01`)                     |
    | finished_to       | date   | No       | Filter by finishedAt <= date (ISO format: `2025-06-30`)                     |
    | active_from   | date   | No       | Calendar overlap: keep entries whose play range ends on/after this date. Open-ended for `playing`/`endless` (treated as ongoing up to today) |
    | active_to     | date   | No       | Calendar overlap: keep entries whose play range starts on/before this date. Combined with `active_from` returns entries overlapping a month |
    | no_finished_date  | bool   | No       | If `true`, returns only entries with no finishedAt date                      |
    | undated       | bool   | No       | If `true`, returns only entries with neither startedAt nor finishedAt (e.g. for an "unscheduled" count in the calendar) |
    | coop_only     | bool   | No       | If `true`, returns only entries played in co-op (those linked to a coop run) |
    | min_score     | number | No       | Filter by score >= value                                                    |
    | max_score     | number | No       | Filter by score <= value                                                    |
    | min_duration      | number | No       | Filter by duration >= value (hours)                                         |
    | max_duration      | number | No       | Filter by duration <= value (hours)                                         |
    | min_real_duration | number | No       | Filter by realDuration >= value (hours)                                     |
    | max_real_duration | number | No       | Filter by realDuration <= value (hours)                                     |
    | min_rating    | number | No       | Filter by userRating >= value                                               |
    | max_rating    | number | No       | Filter by userRating <= value                                               |
    | min_ratio     | number | No       | Filter by community ratio (score / duration) >= value                       |
    | max_ratio     | number | No       | Filter by community ratio (score / duration) <= value                       |
    | min_personal_ratio | number | No  | Filter by personal ratio (score / realDuration) >= value                    |
    | max_personal_ratio | number | No  | Filter by personal ratio (score / realDuration) <= value                    |
    | mood_tags     | string | No       | Comma-separated mood tags. AND semantics: entry must match all tags (e.g. `relajante,corto`) |
    | sort_by       | string | No       | Sort field: `title`, `status`, `score`, `duration`, `startedAt`, `finishedAt`, `realDuration`, `userRating`, `createdAt`, `ratio`, `personalRatio` (default: `createdAt`) |
    | sort_order    | string | No       | Sort direction: `asc` or `desc` (default: `desc`)                          |

    **Valid statuses:** `not_started`, `playing`, `completed`, `abandoned`, `endless`

    ### Response (200)

    ```json
    {
      "data": {
        "backlog": [
          {
            "id": "uuid",
            "status": "completed",
            "score": 85,
            "duration": 12,
            "ratio": 7.08,
            "startedAt": "2025-01-01T00:00:00.000Z",
            "finishedAt": "2025-01-15T00:00:00.000Z",
            "realDuration": 10.5,
            "userRating": 8.5,
            "isPublic": true,
            "notes": "Great game",
            "hasReview": true,
            "reviewContent": "A surreal puzzle gem with a hidden depth.",
            "moodTags": ["corto", "relajante"],
            "latestProgress": { "note": "Capítulo 3 — stuck en el puzzle del agua", "createdAt": "2026-06-25T20:31:09.451Z" },
            "game": { "id": "uuid", "title": "Fez", "coverUrl": "https://...", "isDlc": false },
            "platform": { "id": "uuid", "abbreviation": "Steam" }
          }
        ]
      }
    }
    ```
