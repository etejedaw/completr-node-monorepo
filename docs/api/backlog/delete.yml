info:
    name: Delete Backlog
    type: http
    seq: 4

http:
    method: DELETE
    url: "{{BASE_URL}}/users/me/backlog/:backlogId"
    params:
        - name: backlogId
          value: ""
          type: path
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Delete Backlog

    Deletes a backlog (physical delete). Only the owner can delete it.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param          | Type | Required | Description          |
    |----------------|------|----------|----------------------|
    | backlogId  | uuid | Yes      | The backlog UUID |

    ### Response (204)

    No content.
