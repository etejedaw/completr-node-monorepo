          value: application/json
    auth: inherit
    params:
        - name: action
          type: query
          value: remove
    body:
        type: json
        data: |-
            {
              "backlogIds": [
                "0b6f1c9e-3d0a-4a59-9a43-5c1e2f7d8a10",
