docs: |-
    ## Bulk Add to Queue

    Appends several existing runs to the end of the user's queue, in the order received.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Query Params

    | Param  | Type   | Required | Description |
    |--------|--------|----------|-------------|
    | action | string | Yes      | `add`   |

    ### Request Body

    | Field      | Type   | Required | Description |
    |------------|--------|----------|-------------|
    | backlogIds | uuid[] | Yes      | 1 to 100 run ids |

    Duplicated ids are removed by the server (not an error). The whole batch runs in a single transaction. An id that does not exist or is not the user's never fails the batch: it goes to `skipped` with the code shown below.

    ### Response (200)

    ```json
    {
      "data": {
        "action": "add",
        "succeeded": [
          "0b6f1c9e-3d0a-4a59-9a43-5c1e2f7d8a10",
          "5e2d7f40-8c1b-4f6e-b2a9-1d3c4e5f6a7b"
        ],
        "skipped": [
          {
            "id": "9c8b7a65-4321-4fed-8cba-0f1e2d3c4b5a",
            "code": "QUEUE_BACKLOG_NOT_STARTED"
          }
        ]
      }
    }
    ```

    A run that is already queued is reported in `succeeded` without being duplicated. A `queue_added` activity is recorded only for the runs actually added. If the batch would take a free user over the queue limit, nothing is applied.

    ### Errors

    - 402 `QUEUE_LIMIT_REACHED` — the batch would exceed the free plan limit; nothing is added
    - 200 skipped `QUEUE_BACKLOG_NOT_FOUND` — the run does not exist or belongs to another user
    - 200 skipped `QUEUE_BACKLOG_NOT_STARTED` — the run status is not `not_started`
    - 422 `COMMON_SCHEMA_INVALID` — unknown or missing `action`, a body that does not match the action, an empty list, more than 100 ids, a value that is not a UUID or an extra field
    - 401 `AUTH_INVALID_TOKEN` — missing, expired or invalid token
