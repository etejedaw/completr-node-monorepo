info:
    name: Get User Queue
    type: http
    seq: 4

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/queue"
    params:
        - name: username
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Get User Queue

    Returns a user's public play queue. Requires `User.isPublic` and `User.isQueuePublic` to be true.

    **Authentication:** Not required.
    **Rate Limit:** 100 requests per minute.

    ### Response (200)

    Same shape as Get My Queue.

    ### Errors

    - 404 `USER_NOT_FOUND`
    - 403 `USER_PRIVATE` — Profile or queue is private
