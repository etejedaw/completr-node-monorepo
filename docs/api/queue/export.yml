docs: |-
    ## Export My Queue

    Downloads the authenticated user's queue (Up Next) as a file, applying the same filters, search and sort as the listing view (`GET /users/me/queue` plus the Up Next sort control) but without pagination (`limit` and `offset` are ignored). Without query params it exports the whole collection.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Query Params

    | Param | Type | Required | Description |
    |-------|------|----------|-------------|
    | search | string | No | 1–100 characters, matched against the game title (same rules as the listing) |
    | sort | `manual` \| `ratio` \| `score` \| `duration` | No | Default `manual`: `position` ascending. `ratio` / `score`: descending, rows without value last. `duration`: ascending, rows without duration last. Ties keep the `position` order |

    ### Format (content negotiation)

    The format is negotiated with the `Accept` header (Express `req.accepts(["text/csv", "application/json"])`); there is no `format` query param. Responses always carry `Vary: Accept`.

    | `Accept` | Result |
    |----------|--------|
    | missing, `*/*`, `text/*` or only wildcards | CSV (default) |
    | `text/csv`, or a list where `text/csv` wins | CSV |
    | `application/json`, or a list where it wins | JSON — `premium`, `moderator` or `admin` only |
    | neither acceptable (e.g. `text/html`) | 406 `EXPORT_FORMAT_NOT_ACCEPTABLE` |

    ### Response (200)

    Headers:

    - `Content-Disposition: attachment; filename="completr-queue-YYYY-MM-DD.csv"` (date in UTC; exposed to the browser through CORS `Access-Control-Expose-Headers`)
    - `Content-Type: text/csv; charset=utf-8` for CSV, `application/json; charset=utf-8` for JSON
    - `Vary: Accept`

    CSV: UTF-8 BOM, a header row with the column names, comma separator, `\r\n` line endings and RFC 4180 quoting (fields with a comma, a quote or a line break are wrapped in double quotes, inner quotes are doubled). Text that starts with `=`, `+`, `-`, `@`, tab or carriage return is prefixed with `'` to prevent formula injection. `null` is an empty field. An empty result returns only the header row.

    JSON: a bare array (not wrapped in `data`) with one object per row, the same keys as the CSV columns and native types. An empty result returns `[]`.

    Rows follow `sort` (default: queue `position` ascending).

    ### Columns

    | Column | Type | Description |
    |--------|------|-------------|
    | position | int | Position in the queue, from 1 |
    | gameTitle | string | Game title |
    | platform | string | Platform name of the backlog entry |
    | status | string | Backlog status |
    | score | number \| null | Backlog score |
    | duration | number \| null | Backlog duration in hours |
    | ratio | number \| null | Ratio of the backlog entry |
    | addedAt | string | ISO 8601 date-time the entry was queued |

    ```json
    [
      {
        "position": 1,
        "gameTitle": "Celeste",
        "platform": "PC",
        "status": "not_started",
        "score": 4.5,
        "duration": 12,
        "ratio": 7.5,
        "addedAt": "2026-03-02T18:00:00.000Z"
      }
    ]
    ```

    ### Errors

    - 401 `AUTH_INVALID_TOKEN` — Invalid or expired token
    - 422 `AUTH_SCHEMA_INVALID` — Missing `Authorization` header
    - 422 `COMMON_SCHEMA_INVALID` — A query param has an invalid value
    - 402 `EXPORT_FORMAT_PREMIUM` — JSON negotiated by a `user` (free) account
    - 406 `EXPORT_FORMAT_NOT_ACCEPTABLE` — `Accept` allows neither `text/csv` nor `application/json`
