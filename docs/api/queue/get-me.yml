info:
    name: Get My Queue
    type: http
    seq: 3

http:
    method: GET
    url: "{{BASE_URL}}/users/me/queue"
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get My Queue

    Returns the authenticated user's play queue ordered by position.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "queue": [
          {
            "id": "uuid",
            "position": 1,
            "backlog": {
              "id": "uuid",
              "status": "not_started",
              "score": 89,
              "duration": 6,
              "startedAt": null,
              "notes": null,
              "game": { "id": "uuid", "title": "...", "coverUrl": "...", "isDlc": false },
              "platform": { "id": "uuid", "abbreviation": "..." }
            }
          }
        ]
      }
    }
    ```
