info:
    name: Get Times by Game
    type: http
    seq: 2

http:
    method: GET
    url: "{{BASE_URL}}/game-times/:gameId"
    params:
        - name: gameId
          value: ""
          type: path
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Get Times by Game

    Returns all durations for a game from all available sources.

    **Authentication:** Bearer token required (role: user, premium, moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param  | Type | Required | Description   |
    |--------|------|----------|---------------|
    | gameId | uuid | Yes      | The game UUID |

    ### Response (200)

    ```json
    {
      "data": {
        "gameTimes": [
          {
            "id": "uuid",
            "gameId": "uuid",
            "source": "hltb",
            "duration": 15.5,
            "updatedAt": "2025-01-01T00:00:00.000Z"
          },
          {
            "id": "uuid",
            "gameId": "uuid",
            "source": "rawg",
            "duration": 12,
            "updatedAt": "2025-01-01T00:00:00.000Z"
          }
        ]
      }
    }
    ```
