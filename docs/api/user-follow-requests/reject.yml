info:
    name: Reject Follow Request
    type: http
    seq: 3

http:
    method: POST
    url: "{{BASE_URL}}/users/me/follow-requests/:requesterId/reject"
    params:
        - name: requesterId
          value: 00000000-0000-0000-0000-000000000000
          type: path

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Reject Follow Request

    Rejects a pending follow request. Removes the row from
    `UserFollowRequests`. The requester is **not** notified (same pattern as
    Instagram). They can re-send a request if they want.

    **Auth:** Bearer token (any authenticated user).

    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param        | Type | Required | Description                       |
    |--------------|------|----------|-----------------------------------|
    | requesterId  | uuid | Yes      | The user that sent the request    |

    ### Response (204)

    No content.

    ### Errors

    | Status | Code                              | Description                |
    |--------|-----------------------------------|----------------------------|
    | 404    | USER_FOLLOW_REQUEST_NOT_FOUND     | No pending request found   |
