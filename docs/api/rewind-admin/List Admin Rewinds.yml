docs: |-
    ## List Admin Rewinds

    Lists the generated rewinds, newest first, with `limit`/`offset` like the other admin listings.

    **Authentication:** Bearer token, admin only. Other roles receive 404 `AUTH_ROUTE_NOT_FOUND`.

    ### Query

    - `year` (integer, optional) — filter by year
    - `search` (string, optional, 1 to 100 characters) — search by username, ignoring case and accents
    - `limit` (integer, optional, 1 to 100, default 50) — page size
    - `offset` (integer, optional, default 0) — rows to skip

    ### Response (200)

    ```json
    {
      "data": {
        "rewinds": [
          {
            "id": "<uuid>",
            "year": 2026,
            "user": { "id": "<uuid>", "username": "marta_plays" },
            "accessKind": "gift",
            "regenerationsLeft": 2,
            "graceUsed": false,
            "generatedAt": "2026-12-02T10:00:00.000Z",
            "frozenAt": null
          }
        ],
        "total": 53
      }
    }
    ```

    `accessKind` is `none`, `gift` or `premium`.

    ### Errors

    | Status | Code | Description |
    |--------|------|-------------|
    | 422 | COMMON_SCHEMA_INVALID | Invalid year, limit, offset or search, or unknown query parameter |
