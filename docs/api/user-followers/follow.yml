info:
    name: Follow User
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/users/:username/follow"
    params:
        - name: username
          value: johndoe
          type: path

settings:
    encodeUrl: true

auth:
    type: bearer
    token: "{{TOKEN}}"

docs: |-
    ## Follow User

    Follow another user. You cannot follow yourself.

    If the target user is **private** and has `acceptFollowRequests = true`, the
    call creates a follow **request** (status `pending`) instead of an immediate
    follow. The owner of the private profile must accept it via
    `/users/me/follow-requests/:requesterId/accept`. If the target is public, or
    private with `acceptFollowRequests = false`, the call follows directly
    (status `accepted`).

    **Auth:** Bearer token (any authenticated user).

    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param    | Type   | Required | Description         |
    |----------|--------|----------|---------------------|
    | username | string | Yes      | The user to follow  |

    ### Response (201)

    ```json
    {
      "data": {
        "status": "accepted",
        "targetId": "uuid"
      }
    }
    ```

    `status` is either `accepted` (follow created in `UserFollower`) or
    `pending` (request created in `UserFollowRequests`).

    ### Errors

    | Status | Code                                       | Description                       |
    |--------|--------------------------------------------|-----------------------------------|
    | 400    | USER_FOLLOW_REQUEST_CANNOT_REQUEST_SELF    | Cannot follow yourself            |
    | 404    | USER_FOLLOW_REQUEST_USER_NOT_FOUND         | User not found                    |
    | 409    | USER_FOLLOW_REQUEST_ALREADY_FOLLOWING      | Already following                 |
    | 409    | USER_FOLLOW_REQUEST_ALREADY_REQUESTED      | Already requested (pending)       |
