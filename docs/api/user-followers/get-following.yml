info:
    name: Get Following
    type: http
    seq: 4

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/following"
    params:
        - name: username
          value: johndoe
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get Following

    List users that the specified user is following.

    **Auth:** Not required.

    **Rate Limit:** 100 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          { "id": "uuid", "username": "john", "name": "John", "avatarUrl": null }
        ]
      }
    }
    ```
