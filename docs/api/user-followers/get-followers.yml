http:
    method: GET
    url: "{{BASE_URL}}/users/:username/followers?limit=24&offset=0"
    params:
        - name: username
          value: johndoe
          type: path
        - name: limit
          value: "24"
          type: query
        - name: offset
          value: "0"
          type: query

settings:
    encodeUrl: true

docs: |-
    ## Get Followers

    List users who follow the specified user, newest first (ties broken by follow id), paginated and with optional search. Deactivated accounts are not listed and do not count towards `total`. Each entry is a user card (same shape as `GET /users/discover`): stats, `featuredGame` and `followerCount` follow each listed user's privacy settings for the viewer (`null` when hidden), and `isFollowing` / `isSelf` are relative to the viewer.

    **Auth:** Optional (Bearer token). Without a token, `isFollowing` is always `false` and only public sections are counted. The list follows the profile owner's profile visibility: if the viewer cannot see the profile, the request fails with 403.

    **Rate Limit:** 100 requests per minute.

    ### Query Params

    | Param  | Type    | Required | Default | Description                                                                 |
    |--------|---------|----------|---------|-----------------------------------------------------------------------------|
    | limit  | integer | No       | 24      | Page size (1–100)                                                           |
    | offset | integer | No       | 0       | Page offset                                                                 |
    | search | string  | No       | —       | Match on the listed user's `username` or `name` (1–100 characters), ignoring case, accents and punctuation; every word must appear in one of the two fields, in any order. `%`, `_` and `\` are never wildcards, and a value without letters or digits does not filter. Omit it instead of sending it empty |

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          {
            "id": "uuid",
            "username": "jane",
            "name": "Jane",
            "avatarUrl": null,
            "profileVisibility": "public",
            "role": "premium",
            "isSelf": false,
            "followerCount": 12,
            "isFollowing": true,
            "gamesTotal": 140,
            "completedTotal": 58,
            "featuredGame": { "title": "Hollow Knight", "backgroundUrl": "https://media.rawg.io/media/games/..." }
          }
        ],
        "total": 37
      }
    }
    ```

    `total` counts every match of the search (or every active connection without `search`), not just the current page. An `offset` past the end returns an empty `users` with the same `total`.

    ### Errors

    - `403 USER_PRIVATE` — the profile is not visible to the viewer (the profile section gates every other section, including connections)
    - `404 USER_NOT_FOUND` — no user with that username
    - `422 COMMON_SCHEMA_INVALID` — invalid username, `limit` outside 1–100, negative `offset` or `search` empty or longer than 100 characters
