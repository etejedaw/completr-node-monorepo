info:
    name: Get Followers
    type: http
    seq: 3

http:
    method: GET
    url: "{{BASE_URL}}/users/:username/followers"
    params:
        - name: username
          value: johndoe
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get Followers

    List users who follow the specified user.

    **Auth:** Not required.

    **Rate Limit:** 100 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          { "id": "uuid", "username": "jane", "name": "Jane", "avatarUrl": null }
        ]
      }
    }
    ```
