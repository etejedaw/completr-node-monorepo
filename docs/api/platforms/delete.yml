info:
    name: Delete Platform
    type: http
    seq: 5

http:
    method: DELETE
    url: "{{BASE_URL}}/platforms/:platformId"
    params:
        - name: platformId
          value: ""
          type: path
    auth: inherit

settings:
    encodeUrl: true

docs: |-
    ## Delete Platform

    Deletes a platform.

    **Authentication:** Bearer token required (role: moderator).
    **Rate Limit:** 50 requests per minute.

    ### Path Parameters

    | Param | Type   | Required | Description         |
    |-------|--------|----------|---------------------|
    | platformId    | string | Yes      | The platform UUID   |

    ### Response (204)

    No content.
