info:
    name: Follow List
    type: http
    seq: 1

http:
    method: POST
    url: "{{BASE_URL}}/lists/:listId/follow"
    auth: inherit
    params:
        - name: listId
          type: path
          value: ""

settings:
    encodeUrl: true

docs: |-
    ## Follow List

    Follows a public list. The list appears on the user's profile as a social bookmark.

    The list must be visible to the requester: a public list whose owner's profile (`profileVisibility`) or lists section (`listVisibility`) is hidden from them answers 404, as if it did not exist. Following a list never bypasses that rule for reading it.

    **Authentication:** Bearer token required.
    **Rate Limit:** 50 requests per minute.

    ### Response (201)

    Created (no body).

    ### Errors

    - 403 `LIST_FOLLOWER_NOT_PUBLIC` — Cannot follow a private list
    - 404 `LIST_FOLLOWER_LIST_NOT_FOUND` — The list does not exist, or it is public but hidden from the requester by the owner's profile or lists section
    - 409 `LIST_FOLLOWER_ALREADY_FOLLOWING` — Already following this list
