info:
    name: Get List Followers
    type: http
    seq: 3

http:
    method: GET
    url: "{{BASE_URL}}/lists/:listId/followers"
    auth: inherit
    params:
        - name: listId
          value: "{{LIST_ID}}"
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get List Followers

    Returns users who follow this list. A private list only shows its followers to its owner; for anyone else it answers like a list that does not exist.

    **Auth:** Bearer token required.

    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          { "id": "uuid", "username": "johndoe", "name": "John", "avatarUrl": null }
        ]
      }
    }
    ```

    ### Errors

    | Status | Type | When |
    |--------|------|------|
    | 401 | `UNAUTHORIZED` | Missing or invalid token |
    | 404 | `LIST_FOLLOWER_LIST_NOT_FOUND` | The list does not exist, or it is private and the requester is not its owner |
