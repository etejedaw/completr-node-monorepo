info:
    name: Get List Followers
    type: http
    seq: 3

http:
    method: GET
    url: "{{BASE_URL}}/lists/:listId/followers"
    auth: inherit
    params:
        - name: listId
          value: "{{LIST_ID}}"
          type: path

settings:
    encodeUrl: true

docs: |-
    ## Get List Followers

    Returns users who follow this list.

    **Auth:** Bearer token required.

    **Rate Limit:** 50 requests per minute.

    ### Response (200)

    ```json
    {
      "data": {
        "users": [
          { "id": "uuid", "username": "johndoe", "name": "John", "avatarUrl": null }
        ]
      }
    }
    ```
