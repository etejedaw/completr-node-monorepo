<ui-bottom-sheet
	eyebrow="My Games"
	heading="Filters & stats"
	[subheading]="viewName()"
	(closed)="closed.emit()"
>
	<div class="flex flex-col gap-1">
		<button
			type="button"
			class="w-full min-h-16 flex items-center gap-3 px-4 rounded-card bg-transparent border-0 text-left cursor-pointer transition active:bg-surface"
			(click)="filtersRequested.emit()"
		>
			<span aria-hidden="true" class="material-icons text-2xl text-brand"
				>tune</span
			>
			<span class="flex-1 flex flex-col">
				<span class="text-base font-medium text-fg">Filters</span>
				<span class="text-xs text-fg-muted">
					{{ activeFiltersCount() > 0 ? activeFiltersCount() + '
					active' : 'Platform, rating, tags, genres and more' }}
				</span>
			</span>
			<span aria-hidden="true" class="material-icons text-fg-muted"
				>chevron_right</span
			>
		</button>
		<button
			type="button"
			class="w-full min-h-16 flex items-center gap-3 px-4 rounded-card bg-transparent border-0 text-left cursor-pointer transition active:bg-surface disabled:opacity-50 disabled:cursor-not-allowed"
			[disabled]="!hasActiveView()"
			(click)="statsRequested.emit()"
		>
			<span aria-hidden="true" class="material-icons text-2xl text-brand"
				>insights</span
			>
			<span class="flex-1 flex flex-col">
				<span class="text-base font-medium text-fg">Stats</span>
				<span class="text-xs text-fg-muted">
					{{ hasActiveView() ? (enabledStatsCount() > 0 ?
					enabledStatsCount() + ' visible' : 'Choose which stats to
					show') : 'Apply a saved view to configure its stats' }}
				</span>
			</span>
			<span aria-hidden="true" class="material-icons text-fg-muted"
				>chevron_right</span
			>
		</button>
	</div>
</ui-bottom-sheet>
