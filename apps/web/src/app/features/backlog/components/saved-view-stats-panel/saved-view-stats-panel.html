@if (isMobile()) {
<ui-bottom-sheet
	[eyebrow]="viewName() ?? 'My Games'"
	heading="Stats"
	subheading="Choose which stats this view shows. Changes save automatically."
	(closed)="closed.emit()"
>
	<ng-container *ngTemplateOutlet="statsBody" />
	<ng-container ngProjectAs="[sheetFooter]">
		<ng-container *ngTemplateOutlet="statsFooter" />
	</ng-container>
</ui-bottom-sheet>
} @else {
<ui-drawer
	[eyebrow]="viewName() ?? 'My Games'"
	heading="Stats"
	subheading="Choose which stats this view shows. Changes save automatically."
	(closed)="closed.emit()"
>
	<ng-container *ngTemplateOutlet="statsBody" />
	<ng-container ngProjectAs="[drawerFooter]">
		<ng-container *ngTemplateOutlet="statsFooter" />
	</ng-container>
</ui-drawer>
}

<ng-template #statsBody>
	<div class="flex flex-col gap-1 px-2 md:px-0">
		@for (key of allStatKeys; track key) {
		<label
			class="flex items-center gap-3 min-h-9 tap:min-h-[44px] text-sm text-fg cursor-pointer select-none px-2 rounded transition hover:bg-input-bg"
		>
			<input
				type="checkbox"
				class="cursor-pointer"
				[checked]="enabledStats().has(key)"
				[disabled]="saving()"
				(change)="statToggle.emit(key)"
			/>
			<span>{{ statLabels[key] }}</span>
		</label>
		}
	</div>
</ng-template>

<ng-template #statsFooter>
	<button
		type="button"
		uiButton
		variant="ghost"
		title="Reset to defaults"
		[disabled]="saving() || !custom()"
		(click)="resetRequested.emit()"
	>
		<span aria-hidden="true" class="material-icons text-base"
			>restart_alt</span
		>
		Reset to defaults
	</button>
	<button uiButton type="button" variant="primary" (click)="closed.emit()">
		Done
	</button>
</ng-template>
