<app-month-calendar
	[(month)]="focusedDate"
	[(selected)]="selectedDay"
	[markersFor]="markersFor"
	[agendaItems]="agendaItems()"
	emptyMonthHint="You didn't add anything to your shelf this month."
	(itemSelected)="openEntry($event)"
>
	<p calendarSummary class="m-0 text-[0.6875rem] text-fg-muted tabular-nums">
		{{ monthEntries().length }} acquired
	</p>

	<ng-template appCalendarDay let-date>
		@for (item of itemsForDay(date).slice(0, maxChips); track item.id) {
		<button
			type="button"
			class="-mx-px h-[18px] flex items-center px-1.5 rounded bg-brand-subtle text-brand text-[0.6875rem] font-medium leading-none truncate cursor-pointer transition hover:brightness-110"
			[title]="item.game.title"
			(click)="entryClick.emit(item)"
		>
			<span class="truncate">{{ item.game.title }}</span>
		</button>
		} @if (overflowFor(date) > 0) {
		<button
			type="button"
			class="self-start px-1.5 text-[0.625rem] font-medium text-fg-muted leading-none bg-transparent border-0 cursor-pointer hover:text-brand"
			(click)="selectDay(date)"
		>
			+{{ overflowFor(date) }} more
		</button>
		}
	</ng-template>

	@if (undatedCount() > 0) {
	<p class="m-0 mt-3 text-xs text-fg-muted leading-snug">
		{{ undatedCount() }} {{ undatedCount() === 1 ? "item has" : "items have"
		}} no acquired date and aren't shown here.
	</p>
	}
</app-month-calendar>
