<app-month-calendar
	[(month)]="focusedDate"
	[(selected)]="selectedDay"
	[minYear]="earliestYear()"
	[markersFor]="markersFor"
	[agendaItems]="agendaItems()"
	emptyMonthHint="You didn't add anything to your shelf this month."
	(itemSelected)="openEntry($event)"
>
	<p calendarSummary class="m-0 text-[0.6875rem] text-fg-muted tabular-nums">
		{{ monthEntries().length }} acquired
	</p>

	<ng-template appCalendarDay let-date>
		@for (item of itemsForDay(date).slice(0, maxChips); track item.id) {
		<app-calendar-event-chip
			toneClass="bg-brand-subtle text-brand"
			[title]="item.game.title"
			[ariaLabel]="item.game.title + ', added to your shelf'"
			(pressed)="entryClick.emit(item)"
		/>
		} @if (overflowFor(date) > 0) {
		<app-calendar-day-overflow
			[count]="overflowFor(date)"
			(pressed)="selectDay(date)"
		/>
		}
	</ng-template>

	@if (undatedCount() > 0) {
	<p class="m-0 mt-3 text-xs text-fg-muted leading-snug">
		{{ undatedCount() }} {{ undatedCount() === 1 ? "item has" : "items have"
		}} no acquired date and aren't shown here.
	</p>
	}
</app-month-calendar>
