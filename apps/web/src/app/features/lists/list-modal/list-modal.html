<ui-dialog
	eyebrow="Lists"
	size="md"
	[heading]="isEdit() ? 'Edit list' : 'Create list'"
	[dismissible]="!isLoading()"
	(closed)="onClose()"
>
	@if (error()) {
	<div
		role="alert"
		class="bg-danger/10 border border-danger/20 text-danger px-3 py-2 rounded-card mb-4 text-[0.8125rem]"
	>
		{{ error() }}
	</div>
	}

	<form id="list-form" (submit)="onSubmit($event)">
		<div uiFormField class="mb-4">
			<label
				uiLabel
				for="list-name"
				class="block mb-1 text-xs font-medium text-fg-secondary uppercase tracking-wider"
				>Name <span class="text-danger font-bold">*</span></label
			>
			<input
				uiInput
				id="list-name"
				type="text"
				[formField]="form.name"
				placeholder="Saga Resident Evil, Top 10 RPGs..."
			/>
		</div>

		<div uiFormField class="mb-4">
			<label
				uiLabel
				for="list-description"
				class="block mb-1 text-xs font-medium text-fg-secondary uppercase tracking-wider"
				>Description</label
			>
			<textarea
				uiTextarea
				id="list-description"
				[formField]="form.description"
				rows="2"
				placeholder="What's this list about?"
			></textarea>
		</div>

		<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
			<div uiFormField class="mb-4">
				<span
					uiLabel
					class="block mb-1.5 text-xs font-medium text-fg-secondary uppercase tracking-wider"
					>Score Source
					<span class="text-danger font-bold">*</span></span
				>
				<div
					uiRadioGroup
					orientation="horizontal"
					[value]="form.scoreSource().value()"
					(valueChange)="form.scoreSource().value.set($any($event))"
					class="flex flex-wrap gap-1.5"
				>
					@for (opt of scoreSourceOptions(); track opt.value) {
					<button
						type="button"
						uiRadioItem
						[value]="opt.value"
						class="min-h-[32px] max-md:min-h-[44px] tap:min-h-[44px] px-3 rounded-full border text-xs font-medium cursor-pointer transition bg-input-bg border-line text-fg-secondary hover:border-brand hover:text-brand data-[checked]:bg-brand-subtle data-[checked]:border-brand data-[checked]:text-brand data-[focus-visible]:outline data-[focus-visible]:outline-2 data-[focus-visible]:outline-brand data-[focus-visible]:outline-offset-2"
					>
						{{ opt.label }}
					</button>
					}
				</div>
			</div>
			<div uiFormField class="mb-4">
				<span
					uiLabel
					class="block mb-1.5 text-xs font-medium text-fg-secondary uppercase tracking-wider"
					>Duration Source
					<span class="text-danger font-bold">*</span></span
				>
				<div
					uiRadioGroup
					orientation="horizontal"
					[value]="form.durationSource().value()"
					(valueChange)="form.durationSource().value.set($any($event))"
					class="flex flex-wrap gap-1.5"
				>
					@for (opt of DURATION_SOURCES; track opt.value) {
					<button
						type="button"
						uiRadioItem
						[value]="opt.value"
						class="min-h-[32px] max-md:min-h-[44px] tap:min-h-[44px] px-3 rounded-full border text-xs font-medium cursor-pointer transition bg-input-bg border-line text-fg-secondary hover:border-brand hover:text-brand data-[checked]:bg-brand-subtle data-[checked]:border-brand data-[checked]:text-brand data-[focus-visible]:outline data-[focus-visible]:outline-2 data-[focus-visible]:outline-brand data-[focus-visible]:outline-offset-2"
					>
						{{ opt.label }}
					</button>
					}
				</div>
			</div>
		</div>

		<div class="mb-4">
			<label
				class="flex items-center gap-3 min-h-[44px] cursor-pointer text-[0.8125rem] text-fg-secondary px-3 py-2 bg-input-bg border border-line rounded-card"
			>
				<input
					type="checkbox"
					[formField]="form.isPublic"
					class="w-4 h-4 cursor-pointer accent-[var(--color-brand)]"
				/>
				<span aria-hidden="true" class="material-icons text-base"
					>{{ form.isPublic().value() ? 'public' : 'lock' }}</span
				>
				<span
					>{{ form.isPublic().value() ? 'Public list' : 'Private list'
					}}</span
				>
			</label>
		</div>
	</form>

	<ng-container dialogFooter>
		@if (isEdit()) {
		<app-dialog-delete-action
			question="Delete this list?"
			[busy]="isLoading()"
			(confirmed)="onDelete()"
		/>
		}
		<button uiButton variant="ghost" type="button" (click)="onClose()">
			Cancel
		</button>
		<button
			uiButton
			variant="primary"
			type="submit"
			form="list-form"
			[disabled]="form().invalid() || isLoading()"
		>
			{{ isLoading() ? "Saving..." : isEdit() ? "Save" : "Create" }}
		</button>
	</ng-container>
</ui-dialog>
