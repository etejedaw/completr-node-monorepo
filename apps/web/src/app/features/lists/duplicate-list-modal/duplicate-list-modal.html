<ui-dialog
	heading="Duplicate list"
	eyebrow="Lists"
	icon="content_copy"
	subheading="Copies every game, its frozen score and the order into a new list you own. The original stays untouched."
	size="sm"
	[dismissible]="!isLoading()"
	(closed)="onClose()"
>
	@if (error()) {
	<ui-alert class="mb-4">{{ error() }}</ui-alert>
	}

	<form
		id="duplicate-list-form"
		class="flex flex-col gap-4"
		(submit)="onSubmit($event)"
	>
		<div uiFormField>
			<label uiLabel for="duplicate-list-name" uiFieldLabel>Name</label>
			<input
				uiInput
				id="duplicate-list-name"
				type="text"
				[formField]="form.name"
			/>
		</div>

		<ui-checkbox
			class="min-h-[44px] w-full gap-3 px-3 py-2 rounded-card border border-line bg-input-bg text-[0.8125rem] text-fg-secondary"
			[label]="form.isPublic().value() ? 'Public list' : 'Private list'"
			[checked]="form.isPublic().value()"
			(checkedChange)="form.isPublic().value.set($event)"
		>
			<span aria-hidden="true" class="material-icons ml-auto text-base"
				>{{ form.isPublic().value() ? "public" : "lock" }}</span
			>
		</ui-checkbox>
	</form>

	<ng-container dialogFooter>
		<button uiButton variant="ghost" type="button" (click)="onClose()">
			Cancel
		</button>
		<button
			uiButton
			variant="primary"
			type="submit"
			form="duplicate-list-form"
			[disabled]="form().invalid() || isLoading()"
		>
			{{ isLoading() ? "Duplicating..." : "Duplicate" }}
		</button>
	</ng-container>
</ui-dialog>
