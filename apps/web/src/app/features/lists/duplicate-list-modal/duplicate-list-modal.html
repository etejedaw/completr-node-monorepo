<div
	ngpDialogOverlay
	class="fixed inset-0 bg-black/60 flex justify-center items-center z-[100] backdrop-blur-sm"
>
	<div
		ngpDialog
		class="bg-sidebar border border-line rounded-[12px] p-7 w-full max-w-[480px] max-h-[90vh] overflow-y-auto"
		style="box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.6)"
	>
		<div class="flex justify-between items-center mb-5">
			<h2
				ngpDialogTitle
				class="font-display m-0 text-[1.125rem] font-bold"
			>
				Duplicate List
			</h2>
			<button
				uiIconButton
				size="sm"
				aria-label="Close"
				(click)="onClose()"
			>
				&times;
			</button>
		</div>

		@if (error()) {
		<div
			class="bg-danger/10 border border-danger/20 text-red-300 px-3 py-2 rounded-card mb-4 text-[0.8125rem]"
		>
			{{ error() }}
		</div>
		}

		<form [formGroup]="form" (ngSubmit)="onSubmit()">
			<div uiFormField class="mb-4">
				<label
					uiLabel
					for="name"
					class="block mb-1 text-xs font-medium text-fg-secondary uppercase tracking-wider"
					>Name <span class="text-danger font-bold">*</span></label
				>
				<input
					uiInput
					id="name"
					type="text"
					formControlName="name"
				/>
			</div>

			<div class="mb-4">
				<label
					class="flex items-center gap-2 cursor-pointer text-[0.8125rem] text-fg-secondary px-3 py-2 bg-input-bg border border-line rounded-card"
				>
					<input
						type="checkbox"
						formControlName="isPublic"
						class="w-4 h-4 cursor-pointer accent-[var(--color-brand)]"
					/>
					<span aria-hidden="true" class="material-icons text-base"
						>{{ form.controls.isPublic.value ? 'public' : 'lock'
						}}</span
					>
					<span
						>{{ form.controls.isPublic.value ? 'Public list' :
						'Private list' }}</span
					>
				</label>
			</div>

			<p class="text-[0.75rem] text-fg-muted mb-4">
				Copies all games, their frozen scores and order into a new list
				you own. The original is untouched.
			</p>

			<div
				class="flex justify-end items-center gap-2 mt-5 pt-4 border-t border-line"
			>
				<button
					uiButton
					variant="ghost"
					size="sm"
					type="button"
					(click)="onClose()"
				>
					Cancel
				</button>
				<button
					uiButton
					variant="primary"
					size="sm"
					type="submit"
					[disabled]="form.invalid || isLoading()"
				>
					{{ isLoading() ? "Duplicating..." : "Duplicate" }}
				</button>
			</div>
		</form>
	</div>
</div>
