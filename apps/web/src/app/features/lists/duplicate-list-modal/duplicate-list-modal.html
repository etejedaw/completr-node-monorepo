<ui-dialog
	heading="Duplicate list"
	eyebrow="Lists"
	subheading="Copies every game, its frozen score and the order into a new list you own. The original stays untouched."
	size="sm"
	[dismissible]="!isLoading()"
	(closed)="onClose()"
>
	@if (error()) {
	<ui-alert class="mb-4">{{ error() }}</ui-alert>
	}

	<form
		id="duplicate-list-form"
		class="flex flex-col gap-4"
		(submit)="onSubmit($event)"
	>
		<div uiFormField>
			<label uiLabel for="duplicate-list-name" uiFieldLabel
				>Name <span class="text-danger font-bold">*</span></label
			>
			<input
				uiInput
				id="duplicate-list-name"
				type="text"
				[formField]="form.name"
			/>
		</div>

		<label
			class="flex items-center gap-3 min-h-[44px] cursor-pointer text-[0.8125rem] text-fg-secondary px-3 py-2 bg-input-bg border border-line rounded-card"
		>
			<input
				type="checkbox"
				class="w-4 h-4 cursor-pointer accent-[var(--color-brand)]"
				[formField]="form.isPublic"
			/>
			<span aria-hidden="true" class="material-icons text-base"
				>{{ form.isPublic().value() ? "public" : "lock" }}</span
			>
			<span class="flex-1"
				>{{ form.isPublic().value() ? "Public list" : "Private list"
				}}</span
			>
		</label>
	</form>

	<ng-container dialogFooter>
		<button uiButton variant="ghost" type="button" (click)="onClose()">
			Cancel
		</button>
		<button
			uiButton
			variant="primary"
			type="submit"
			form="duplicate-list-form"
			[disabled]="form().invalid() || isLoading()"
		>
			{{ isLoading() ? "Duplicating..." : "Duplicate" }}
		</button>
	</ng-container>
</ui-dialog>
