@let text = copy();
<div
	[class]="layoutClass()"
	appInView
	inViewRootMargin="200px"
	(inViewChange)="$event && preload()"
>
	@if (isStage()) {
	<span
		aria-hidden="true"
		class="pointer-events-none absolute left-1/2 top-[40%] -z-10 size-[22rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[conic-gradient(from_210deg,var(--color-brand),var(--color-nav-queue),var(--color-nav-shelf),var(--color-brand))] opacity-40 blur-3xl"
	></span>
	}
	<figure
		class="m-0 shrink-0 relative aspect-[9/16] max-w-full overflow-hidden rounded-card border border-line bg-surface shadow-[0_24px_60px_-24px_rgb(0_0_0/0.75)]"
		[class]="previewHeightClass()"
		[attr.aria-busy]="image().isLoading() || null"
	>
		@if (image().objectUrl(); as url) {
		<img
			[src]="url"
			[alt]="previewAlt()"
			class="w-full h-full object-cover"
		/>
		} @else if (image().hasError()) {
		<div
			class="absolute inset-0 flex flex-col items-center justify-center gap-3 p-6 text-center"
		>
			<span
				aria-hidden="true"
				class="material-icons text-3xl text-fg-secondary"
				>broken_image</span
			>
			<p class="m-0 text-sm text-fg-secondary">{{ text.imageFailed }}</p>
			<button
				uiButton
				variant="secondary"
				size="sm"
				class="tap:min-h-[44px]"
				(click)="retryPreview()"
			>
				{{ text.tryAgain }}
			</button>
		</div>
		} @else {
		<ui-skeleton variant="rect" class="absolute inset-0" />
		<span class="sr-only">{{ text.preparingImage }}</span>
		}
	</figure>

	<div [class]="actionsClass()">
		@if (canShareFiles) {
		<button
			uiButton
			variant="primary"
			class="max-md:min-h-[44px] tap:min-h-[44px]"
			[class.col-span-2]="isStage()"
			[disabled]="!isReady() || sharing()"
			[attr.aria-busy]="sharing() || null"
			(click)="shareImage()"
		>
			<span aria-hidden="true" class="material-icons text-base"
				>ios_share</span
			>
			{{ text.shareImage }}
		</button>
		}
		<button
			uiButton
			[variant]="canShareFiles ? 'secondary' : 'primary'"
			class="max-md:min-h-[44px] tap:min-h-[44px]"
			[class.col-span-2]="isStage() && !canShareFiles"
			[disabled]="downloadPending()"
			[attr.aria-busy]="downloadPending() || null"
			(click)="download()"
		>
			<span aria-hidden="true" class="material-icons text-base"
				>{{ downloadPending() ? 'hourglass_top' : 'download' }}</span
			>
			{{ text.downloadImage }}
		</button>
		<button
			uiButton
			[variant]="isStage() ? 'secondary' : 'ghost'"
			class="max-md:min-h-[44px] tap:min-h-[44px]"
			[class.col-span-2]="isStage() && !canShareFiles"
			(click)="copyLink()"
		>
			<span aria-hidden="true" class="material-icons text-base"
				>link</span
			>
			{{ text.copyLink }}
		</button>
	</div>
</div>
