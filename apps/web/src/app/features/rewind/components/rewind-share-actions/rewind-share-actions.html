@let text = copy;
<div
	class="mx-auto flex w-full max-w-[min(34rem,70dvh)] flex-col gap-3"
	appInView
	inViewRootMargin="200px"
	(inViewChange)="$event && preload()"
>
	<div
		role="group"
		class="grid gap-3"
		[class]="pagesClass()"
		[attr.aria-label]="text.imagesLabel"
	>
		@for (page of pages(); track page.key) { @let pending =
		pendingDownloads().has(page.key);
		<figure
			class="relative m-0 aspect-[9/16] min-w-0 overflow-hidden rounded-card border border-line bg-surface shadow-popover"
			[attr.aria-busy]="page.image.isLoading() || null"
		>
			@if (page.image.objectUrl(); as url) {
			<img
				[src]="url"
				[alt]="page.alt"
				class="h-full w-full object-cover"
			/>
			} @else if (page.image.hasError()) {
			<div
				class="absolute inset-x-0 top-0 bottom-14 flex flex-col items-center justify-center gap-3 p-4 text-center"
			>
				<span
					aria-hidden="true"
					class="material-icons text-3xl text-fg-secondary"
					>broken_image</span
				>
				<p class="m-0 text-sm text-fg-secondary">
					{{ text.imageFailed }}
				</p>
				<button
					uiButton
					variant="secondary"
					size="sm"
					class="tap:min-h-[44px]"
					(click)="retryPreview(page)"
				>
					{{ text.tryAgain }}
				</button>
			</div>
			} @else {
			<ui-skeleton variant="rect" class="absolute inset-0" />
			<span class="sr-only">{{ text.preparingImage }}</span>
			}
			<figcaption
				class="absolute inset-x-0 bottom-0 flex items-center gap-1 bg-gradient-to-t from-scrim-strong to-transparent px-2 pb-2 pt-8 text-on-image"
			>
				<span class="min-w-0 flex-1 truncate text-sm font-semibold"
					>{{ page.label }}</span
				>
				<button
					uiIconButton
					variant="glass"
					[attr.aria-label]="page.downloadLabel"
					[attr.aria-busy]="pending || null"
					[disabled]="pending"
					(click)="download(page)"
				>
					<span aria-hidden="true" class="material-icons text-lg"
						>{{ pending ? "hourglass_top" : "download" }}</span
					>
				</button>
				@if (canShareFiles() && hasSeveralPages()) {
				<button
					uiIconButton
					variant="glass"
					[attr.aria-label]="page.shareLabel"
					[disabled]="!page.image.blob() || sharing()"
					(click)="sharePage(page)"
				>
					<span aria-hidden="true" class="material-icons text-lg"
						>ios_share</span
					>
				</button>
				}
			</figcaption>
		</figure>
		}
	</div>

	<div class="flex gap-2">
		@if (canShareFiles()) {
		<button
			uiButton
			variant="primary"
			class="min-w-0 flex-1 max-md:min-h-[44px] tap:min-h-[44px]"
			[disabled]="!isReady() || sharing()"
			[attr.aria-busy]="sharing() || null"
			(click)="shareImages()"
		>
			<span aria-hidden="true" class="material-icons text-base"
				>ios_share</span
			>
			{{ shareLabel() }}
		</button>
		}
		<button
			uiButton
			class="max-md:min-h-[44px] tap:min-h-[44px]"
			[variant]="canShareFiles() ? 'secondary' : 'primary'"
			[class.flex-1]="!canShareFiles()"
			(click)="copyLink()"
		>
			<span aria-hidden="true" class="material-icons text-base"
				>link</span
			>
			{{ text.copyLink }}
		</button>
	</div>
</div>
