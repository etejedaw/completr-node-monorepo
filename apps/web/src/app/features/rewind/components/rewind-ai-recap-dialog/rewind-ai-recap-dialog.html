<ui-dialog
	size="sm"
	eyebrow="Rewind"
	icon="auto_awesome"
	[heading]="heading()"
	subheading="We'll write it from your year. It can take up to a minute."
	(closed)="closed.emit()"
>
	<form
		id="rewind-ai-recap-form"
		class="flex flex-col gap-5"
		(submit)="$event.preventDefault(); submit()"
	>
		<section
			class="flex flex-col gap-4 rounded-card border border-premium/30 bg-premium/5 p-3 sm:p-4"
			aria-labelledby="rewind-add-ai-recap-heading"
			data-premium-zone
		>
			<app-rewind-ai-provider-notice
				headingId="rewind-add-ai-recap-heading"
			/>
			<app-rewind-ai-recap-switches
				[(includePrivateRuns)]="includePrivateRuns"
				[(includeNotes)]="includeNotes"
			/>
		</section>
		@if (addsPremiumStats()) {
		<ui-alert tone="info" icon="insights">
			Your premium stats will be added to this Rewind too.
		</ui-alert>
		}
	</form>

	<ng-container dialogFooter>
		<button uiButton type="button" variant="ghost" (click)="closed.emit()">
			Cancel
		</button>
		<button
			uiButton
			type="submit"
			variant="primary"
			form="rewind-ai-recap-form"
		>
			Write AI recap
		</button>
	</ng-container>
</ui-dialog>
