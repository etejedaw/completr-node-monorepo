<div class="flex items-center gap-1.5">
	<span
		aria-hidden="true"
		class="material-icons text-base leading-none text-premium"
		>workspace_premium</span
	>
	<span uiEyebrow tone="premium" [id]="headingId()">{{ heading() }}</span>
	@if (showProvider()) {
	<button
		uiIconButton
		type="button"
		size="sm"
		class="tap-area"
		aria-label="Who writes the AI recap"
		[attr.aria-controls]="headingId() + '-provider-notice'"
		[attr.aria-expanded]="open()"
		(click)="toggle()"
	>
		<span aria-hidden="true" class="material-icons text-base"
			>help_outline</span
		>
	</button>
	}
</div>
@if (showProvider() && open()) {
<p
	[id]="headingId() + '-provider-notice'"
	class="m-0 flex items-start gap-2 rounded-card border border-line bg-surface px-3 py-2.5 text-compact leading-relaxed text-fg-secondary"
>
	<span
		aria-hidden="true"
		class="material-icons shrink-0 text-base text-fg-muted"
		>smart_toy</span
	>
	<span>
		Your AI recap is written by DeepSeek, an external AI service. It
		receives this year's games, ratings, reviews and stats, never your email
		or username.
		<a
			routerLink="/privacy"
			fragment="sharing"
			target="_blank"
			rel="noopener"
			class="font-semibold text-brand hover:text-brand-hover"
			>How your data is used</a
		>
	</span>
</p>
}
