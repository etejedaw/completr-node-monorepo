@if (isGenerated()) {
<a
	data-cartridge
	[class]="liftingShellClass"
	[style.--tone]="tone()"
	[routerLink]="['/user', username(), 'rewind', summary().year]"
>
	<span class="block rounded-lg p-[3px]" [class]="toneLabelClass">
		<span class="flex flex-col overflow-hidden rounded-md bg-canvas">
			@if (artUrl(); as url) {
			<img
				data-cartridge-art
				class="block aspect-[16/10] w-full object-cover"
				alt=""
				loading="lazy"
				[src]="url | coverUrl: 640"
				(error)="onArtError()"
			/>
			} @else {
			<ng-container *ngTemplateOutlet="placeholderArt" />
			}
			<span [class]="titleStripClass">
				<ng-container *ngTemplateOutlet="yearText" />
				<app-rewind-persona-rank
					size="mini"
					[code]="summary().persona"
				/>
			</span>
		</span>
	</span>
	<span class="text-sm text-fg-secondary tabular-nums">{{ stats() }}</span>
	<ng-container *ngTemplateOutlet="grip" />
</a>
} @else if (blockMessage(); as message) {
<div data-cartridge [class]="shellClass" [style.--tone]="tone()">
	<span class="block rounded-lg p-[3px]" [class]="placeholderLabelClass">
		<span class="flex flex-col overflow-hidden rounded-md bg-canvas">
			<ng-container *ngTemplateOutlet="placeholderArt" />
			<span class="flex items-center px-3 py-2.5">
				<ng-container *ngTemplateOutlet="yearText" />
			</span>
		</span>
	</span>
	<span class="flex flex-col gap-1.5">
		<span
			class="inline-flex w-fit items-center gap-1.5 text-sm font-semibold text-fg"
		>
			<span aria-hidden="true" class="material-icons text-base"
				>lock_clock</span
			>
			{{ copy().notAvailable }}
		</span>
		<span class="text-sm text-fg-secondary text-pretty">{{ message }}</span>
	</span>
	<ng-container *ngTemplateOutlet="grip" />
</div>
} @else {
<button
	type="button"
	data-cartridge
	class="group"
	[class]="liftingShellClass"
	[style.--tone]="tone()"
	[attr.aria-label]="generateLabel()"
	[attr.aria-busy]="generation.isPending()"
	(click)="generation.open()"
>
	<span class="block rounded-lg p-[3px]" [class]="placeholderLabelClass">
		<span class="flex flex-col overflow-hidden rounded-md bg-canvas">
			<ng-container *ngTemplateOutlet="placeholderArt" />
			<span [class]="titleStripClass">
				<ng-container *ngTemplateOutlet="yearText" />
				<span
					class="inline-flex min-h-[44px] w-fit items-center gap-1.5 rounded-full bg-brand-solid px-3 text-sm font-semibold text-white transition-colors group-hover:bg-brand-solid-hover"
				>
					<span aria-hidden="true" class="material-icons text-base"
						>fast_rewind</span
					>
					{{ generation.isPending() ? copy().rewinding :
					copy().generate }}
				</span>
			</span>
		</span>
	</span>
	<span class="text-sm text-fg-secondary">{{ copy().readyToRewind }}</span>
	<ng-container *ngTemplateOutlet="grip" />
</button>
}
<ng-template #yearText>
	<span
		class="font-display text-3xl sm:text-4xl font-bold leading-none tracking-tight tabular-nums"
		[class]="yearFillClass"
		>{{ summary().year }}</span
	>
</ng-template>
<ng-template #placeholderArt>
	<span
		data-cartridge-placeholder
		aria-hidden="true"
		class="grid aspect-[16/10] w-full place-items-center bg-[repeating-linear-gradient(135deg,var(--color-surface)_0_10px,var(--color-surface-hover)_10px_20px)] font-display text-4xl font-bold text-fg-muted"
		>?</span
	>
</ng-template>
<ng-template #grip>
	<span aria-hidden="true" class="mt-auto flex justify-center gap-1.5 pt-1">
		@for (notch of gripNotches; track notch) {
		<span class="h-1.5 w-[22px] rounded-full bg-canvas"></span>
		}
	</span>
</ng-template>
@if (generation.isOpen()) {
<app-rewind-generate-dialog
	[username]="username()"
	[year]="summary().year"
	[rewind]="generation.latestRewind()"
	[premiumAccess]="premiumAccess()"
	[canWriteAiRecap]="summary().canWriteAiRecap"
	[pending]="generation.isPending()"
	[error]="generation.error()"
	(submitted)="generation.submit($event)"
	(closed)="generation.close()"
/>
}
