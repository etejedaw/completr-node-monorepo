<app-profile-collection-page
	heading="Favorites"
	icon="favorite"
	iconColor="text-nav-favorites"
	noun="favorite"
	privateTitle="These favorites are private"
	emptyTitle="No favorites yet"
	emptyText="They haven't picked their all-time favorite games yet."
	[username]="collection.username()"
	[posters]="collection.posters()"
	[total]="collection.total()"
	[itemCount]="collection.items().length"
	[visibleCount]="collection.visibleItems().length"
	[isLoading]="collection.isLoading()"
	[error]="collection.error()"
	[offset]="collection.offset()"
	[limit]="collection.limit"
	[(query)]="collection.query"
	(offsetChange)="collection.goToOffset($event)"
>
	<ol class="poster-grid list-none m-0 p-0">
		@for (entry of collection.visibleItems(); track entry.id; let rank =
		$index) {
		<li>
			<app-game-cover-card
				[game]="entry.game"
				[topLeftBadge]="'#' + (collection.offset() + rank + 1)"
			/>
		</li>
		}
	</ol>
</app-profile-collection-page>
