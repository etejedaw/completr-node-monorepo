<app-profile-collection-page
	heading="Reviews"
	icon="rate_review"
	iconColor="text-rating"
	noun="review"
	skeleton="cards"
	privateTitle="These reviews are private"
	emptyTitle="No reviews yet"
	emptyText="They haven't rated or reviewed any games yet."
	[username]="collection.username()"
	[posters]="collection.posters()"
	[total]="collection.total()"
	[itemCount]="collection.items().length"
	[visibleCount]="collection.visibleItems().length"
	[isLoading]="collection.isLoading()"
	[error]="collection.error()"
	[offset]="collection.offset()"
	[limit]="collection.limit"
	[(query)]="collection.query"
	(offsetChange)="collection.goToOffset($event)"
>
	<ul class="list-none m-0 p-0 grid gap-3 md:grid-cols-2">
		@for (review of collection.visibleItems(); track review.id) {
		<li>
			<app-review-card [review]="review" />
		</li>
		}
	</ul>
</app-profile-collection-page>
