@if (collection.error(); as reason) {
<app-profile-access-state
	[reason]="reason"
	[username]="collection.username()"
	privateTitle="This queue is private"
/>
} @else {
<app-library-hero heading="Up Next" [posters]="collection.posters()">
	<a
		heroEyebrow
		class="tap-area inline-flex items-center gap-1.5 text-[0.6875rem] font-semibold uppercase tracking-[0.2em] text-brand no-underline hover:text-brand-hover"
		[routerLink]="['/user', collection.username()]"
	>
		<span aria-hidden="true" class="material-icons text-sm"
			>arrow_back</span
		>
		{{ '@' + collection.username() }}'s profile
	</a>
	<p heroSubtitle class="m-0 mt-2 text-sm text-fg-secondary">
		<span class="font-semibold text-fg tabular-nums"
			>{{ collection.total() }}</span
		>
		{{ collection.total() === 1 ? 'game' : 'games' }} in their queue
	</p>
</app-library-hero>

<app-queue-browser
	manualLabel="Their order"
	noMatchesScope="their Up Next"
	[readonly]="true"
	[searchPlaceholder]="'Search ' + collection.username() + '\'s queue...'"
	[entries]="collection.visibleItems()"
	[queueIsEmpty]="collection.items().length === 0"
	[isLoading]="collection.isLoading()"
	[searchQuery]="collection.query()"
	[offset]="collection.offset()"
	[limit]="collection.limit"
	[total]="collection.total()"
	(searchChange)="collection.query.set($event)"
	(offsetChange)="collection.goToOffset($event)"
>
	<ng-template #emptyQueue>
		<ui-plain-empty-state
			icon="playlist_play"
			title="Nothing queued yet"
			[message]="'@' + collection.username() + ' hasn\'t lined up any games to play next.'"
		>
			<a
				uiButton
				variant="secondary"
				[routerLink]="['/user', collection.username()]"
				>Back to profile</a
			>
		</ui-plain-empty-state>
	</ng-template>
</app-queue-browser>
}
