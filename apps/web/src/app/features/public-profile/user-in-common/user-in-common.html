@if (!isLoggedIn()) {
<ui-empty-state
	icon="join_inner"
	title="Sign in to compare libraries"
	[hint]="'See which games you and @' + collection.username() + ' have in common.'"
>
	<div class="flex flex-wrap justify-center gap-2">
		<a uiButton variant="primary" routerLink="/login">Sign in</a>
		<a
			uiButton
			variant="secondary"
			[routerLink]="['/user', collection.username()]"
			>Back to profile</a
		>
	</div>
</ui-empty-state>
} @else {
<app-profile-collection-page
	heading="In common"
	icon="join_inner"
	noun="game"
	searchPlaceholder="Search games in common..."
	privateTitle="This part of their library is private"
	emptyTitle="Nothing in common yet"
	[emptyText]="'No games' + subtitleSuffix() + ' yet. Try the other comparison.'"
	[subtitleSuffix]="subtitleSuffix()"
	[username]="collection.username()"
	[posters]="collection.posters()"
	[total]="collection.total()"
	[itemCount]="collection.items().length"
	[visibleCount]="collection.visibleItems().length"
	[isLoading]="collection.isLoading()"
	[error]="collection.error()"
	[offset]="collection.offset()"
	[limit]="collection.limit"
	[(query)]="collection.query"
	(offsetChange)="collection.goToOffset($event)"
>
	<app-segmented-control
		collectionFilters
		label="Compare by"
		[options]="options"
		[value]="by()"
		(valueChange)="changeDimension($event)"
	/>
	<app-cover-grid>
		@for (game of collection.visibleItems(); track game.id) {
		<li><app-game-cover-card [game]="game" /></li>
		}
	</app-cover-grid>
</app-profile-collection-page>
}
