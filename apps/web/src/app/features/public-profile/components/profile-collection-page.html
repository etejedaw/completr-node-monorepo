@if (error(); as reason) {
<app-profile-access-state
	[reason]="reason"
	[username]="username()"
	[privateTitle]="privateTitle()"
/>
} @else {
<app-library-hero
	[backLink]="backLink()"
	[heading]="heading()"
	[posters]="posters()"
>
	<p
		heroSubtitle
		class="m-0 mt-2 flex flex-wrap items-center gap-x-1.5 gap-y-1 text-sm text-fg-secondary"
	>
		<span
			aria-hidden="true"
			class="material-icons text-lg"
			[class]="iconColor()"
			>{{ icon() }}</span
		>
		<span>
			<span class="font-semibold text-fg tabular-nums"
				>{{ total() }}</span
			>
			{{ total() === 1 ? noun() : noun() + 's' }}{{ subtitleSuffix() }}
			@if (platforms().length > 1) { · across
			<span class="font-semibold text-fg tabular-nums"
				>{{ platforms().length }}</span
			>
			platforms }
		</span>
	</p>
	<ng-content select="[collectionFilters]" />
	@if (platforms().length > 1) {
	<app-platform-filter
		[platforms]="platforms()"
		[total]="itemCount()"
		[(selected)]="platform"
	/>
	}
</app-library-hero>

@if (hasLoadFailed()) {
<ui-empty-state
	role="alert"
	icon="cloud_off"
	[title]="'Couldn\'t load the ' + heading().toLowerCase()"
	hint="Check your connection and try again."
>
	<button
		uiButton
		type="button"
		variant="secondary"
		class="tap:min-h-[44px]"
		(click)="retry.emit()"
	>
		<span aria-hidden="true" class="material-icons text-base">refresh</span>
		Try again
	</button>
</ui-empty-state>
} @else {
<app-library-page
	[state]="pageState()"
	[showToolbar]="isLoading() || itemCount() > 0"
	[skeleton]="skeleton()"
	[loadingLabel]="'Loading ' + heading()"
	noMatchesHint="Nothing on this page matches your search or platform."
	noMatchesClearLabel="Clear search & filter"
	[emptyIcon]="icon()"
	[emptyTitle]="emptyTitle()"
	[emptyHint]="emptyText()"
	[showPagination]="pageState() === 'ready'"
	[offset]="offset()"
	[limit]="limit()"
	[total]="total()"
	(cleared)="clearFilters()"
	(offsetChange)="offsetChange.emit($event)"
>
	<ng-template appLibraryPageToolbar>
		<ui-search-bar
			size="sm"
			class="flex-1 max-w-2xl"
			[placeholder]="searchPlaceholder() ?? 'Search ' + username() + '\'s ' + heading().toLowerCase() + '...'"
			[value]="query()"
			(valueChange)="query.set($event)"
		/>
		<ng-content select="[collectionToolbar]" />
	</ng-template>
	<ng-template appLibraryPageEmptyAction>
		<a uiButton variant="secondary" [routerLink]="['/user', username()]"
			>Back to profile</a
		>
	</ng-template>
	<ng-template appLibraryPageContent>
		<ng-content />
	</ng-template>
</app-library-page>
} }
