<div class="max-w-3xl mx-auto p-6 lg:p-8 max-md:px-4">
	<div class="flex items-center justify-between mb-6 gap-3">
		<h1
			class="font-display m-0 text-3xl md:text-4xl font-bold tracking-tight"
		>
			Franchises
		</h1>
		<button uiButton variant="primary" size="sm" (click)="openCreate()">
			New franchise
		</button>
	</div>

	@if (isLoading()) {
	<div class="text-center py-12 text-fg-muted text-sm">Loading...</div>
	} @else if (franchises().length === 0) {
	<div class="text-center py-12 text-fg-muted text-sm">
		No franchises yet. Create one above.
	</div>
	} @else {
	<ul class="list-none p-0 m-0 flex flex-col gap-2">
		@for (f of franchises(); track f.id) {
		<li class="bg-surface border border-line rounded-card p-4">
			<div class="flex items-start justify-between gap-3">
				<div class="min-w-0">
					<a
						[routerLink]="['/franchises', f.code]"
						class="font-semibold text-fg no-underline hover:text-brand"
						>{{ f.name }}</a
					>
					@if (f.description) {
					<p class="text-xs text-fg-muted mt-1 mb-0">
						{{ f.description }}
					</p>
					}
				</div>
				<div class="flex gap-1 shrink-0">
					<button
						uiIconButton
						size="sm"
						title="Edit"
						aria-label="Edit franchise"
						(click)="openEdit(f)"
					>
						<span
							aria-hidden="true"
							class="material-icons text-base"
							>edit</span
						>
					</button>
					<button
						uiIconButton
						size="sm"
						tone="danger"
						title="Delete"
						aria-label="Delete franchise"
						(click)="remove(f)"
					>
						<span
							aria-hidden="true"
							class="material-icons text-base"
							>delete</span
						>
					</button>
				</div>
			</div>
		</li>
		}
	</ul>
	}
</div>
