<app-auth-page
	eyebrow="Sign in"
	heading="Welcome back"
	subtitle="Pick up right where your backlog left off."
>
	@if (error()) {
	<ui-alert class="mb-5">{{ error() }}</ui-alert>
	}

	<form (submit)="onSubmit($event)" class="flex flex-col gap-5">
		<div>
			<label
				for="email"
				class="block mb-1.5 text-sm font-medium text-fg-secondary"
				>Email</label
			>
			<div class="relative">
				<span
					aria-hidden="true"
					class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-lg text-fg-muted pointer-events-none"
					>mail_outline</span
				>
				<input
					uiInput
					id="email"
					type="email"
					[formField]="form.email"
					placeholder="you@example.com"
					autocomplete="email"
					class="!pl-10 !py-3 !text-sm"
				/>
			</div>
		</div>

		<div>
			<div class="flex items-center justify-between gap-3 mb-1.5">
				<label
					for="password"
					class="text-sm font-medium text-fg-secondary"
					>Password</label
				>
				<a
					routerLink="/forgot-password"
					class="inline-flex items-center text-sm font-medium text-brand no-underline hover:text-brand-hover tap:min-h-[44px]"
					>Forgot password?</a
				>
			</div>
			<div class="relative">
				<span
					aria-hidden="true"
					class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-lg text-fg-muted pointer-events-none"
					>lock_outline</span
				>
				<input
					uiInput
					id="password"
					[type]="showPassword() ? 'text' : 'password'"
					[formField]="form.password"
					placeholder="Your password"
					autocomplete="current-password"
					class="!pl-10 !pr-11 tap:!pr-[48px] !py-3 !text-sm"
				/>
				<button
					uiIconButton
					size="lg"
					type="button"
					class="absolute right-1 top-1/2 -translate-y-1/2 tap:min-h-[44px] tap:min-w-[44px] tap:right-0"
					(click)="toggleShowPassword()"
					[attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
					[title]="showPassword() ? 'Hide password' : 'Show password'"
				>
					<span aria-hidden="true" class="material-icons text-lg"
						>{{ showPassword() ? 'visibility_off' : 'visibility'
						}}</span
					>
				</button>
			</div>
		</div>

		<button
			uiButton
			variant="primary"
			size="lg"
			[block]="true"
			type="submit"
			class="!py-3.5 mt-1"
			[disabled]="form().invalid() || isLoading()"
		>
			{{ isLoading() ? 'Signing in...' : 'Sign in' }} @if (!isLoading()) {
			<span aria-hidden="true" class="material-icons text-base"
				>arrow_forward</span
			>
			}
		</button>
	</form>

	<p class="m-0 mt-6 text-sm text-fg-muted">
		Don't have an account?{{ " " }}
		<a
			[href]="betaSignupUrl"
			class="inline-flex items-center gap-1 font-medium text-brand no-underline hover:text-brand-hover tap:min-h-[44px]"
			>Join the closed beta<span
				aria-hidden="true"
				class="material-icons text-base"
				>arrow_forward</span
			></a
		>
	</p>
</app-auth-page>
