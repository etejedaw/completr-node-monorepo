<app-library-hero heading="Settings" [posters]="heroPosters()">
	<span
		heroEyebrow
		class="text-[0.6875rem] font-semibold uppercase tracking-[0.2em] text-brand"
		>Account</span
	>
	@if (user(); as account) {
	<a
		heroActions
		uiButton
		variant="secondary"
		class="!bg-surface/70 backdrop-blur"
		[routerLink]="['/user', account.username]"
	>
		<span aria-hidden="true" class="material-icons text-base"
			>visibility</span
		>
		View public profile
	</a>
	}
</app-library-hero>

<app-library-toolbar class="lg:hidden">
	<app-settings-nav variant="chips" class="flex-1 min-w-0" />
</app-library-toolbar>

<div class="lg:mt-8 grid gap-8 lg:grid-cols-[15rem_minmax(0,1fr)]">
	<app-settings-nav
		variant="rail"
		class="hidden lg:block lg:sticky lg:top-[calc(var(--topbar-height)+1.5rem)] lg:self-start"
	/>
	<div class="min-w-0 max-w-3xl flex flex-col">
		<router-outlet />
	</div>
</div>
