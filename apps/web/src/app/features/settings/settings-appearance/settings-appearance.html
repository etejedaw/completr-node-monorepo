<div class="bg-surface border border-line rounded-card p-6">
	<h2 class="font-display m-0 mb-1 text-lg font-bold">Appearance</h2>
	<p class="text-xs text-fg-muted mb-5">Pick the look that fits your mood.</p>

	<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
		@for (theme of visibleThemes(); track theme.id) { @let active =
		current() === theme.id;
		<button
			type="button"
			class="relative text-left rounded-card border-2 cursor-pointer transition p-4 bg-input-bg overflow-hidden"
			[class.border-brand]="active"
			[class.ring-2]="active"
			[class.ring-brand]="active"
			[class.border-line]="!active"
			[class.hover:border-brand]="!active"
			[disabled]="saving() !== null"
			(click)="select(theme)"
		>
			@if (theme.tier === 'premium') {
			<ui-premium-badge
				class="absolute top-2 right-2"
				label="Premium theme"
			/>
			} @if (active) {
			<span
				class="absolute bottom-2 right-2 flex items-center justify-center w-6 h-6 rounded-full bg-brand text-white"
			>
				<span aria-hidden="true" class="material-icons text-sm"
					>check</span
				>
			</span>
			}

			<div
				class="flex items-end gap-1 h-12 mb-3 rounded-md overflow-hidden"
			>
				@for (color of theme.swatches; track color) {
				<div class="flex-1 h-full" [style.background]="color"></div>
				}
			</div>

			<div class="text-sm font-semibold text-fg">{{ theme.name }}</div>
			<div class="text-[0.75rem] text-fg-secondary mt-0.5">
				{{ theme.description }}
			</div>
		</button>
		}
	</div>
</div>
