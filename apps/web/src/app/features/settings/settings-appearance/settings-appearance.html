<app-settings-panel
	heading="Theme"
	headingId="settings-theme-heading"
	description="Changes apply right away and follow you to every device you sign in on."
>
	<div
		role="radiogroup"
		aria-labelledby="settings-theme-heading"
		class="grid gap-4 py-4 sm:grid-cols-2"
	>
		@for (theme of visibleThemes(); track theme.id) { @let active =
		current() === theme.id;
		<button
			type="button"
			role="radio"
			class="group relative flex flex-col text-left p-0 rounded-card border bg-input-bg overflow-hidden cursor-pointer transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-wait"
			[class]="active ? 'border-brand ring-1 ring-brand' : 'border-line hover:border-line-hover'"
			[attr.aria-checked]="active"
			[disabled]="saving() !== null"
			(click)="select(theme)"
		>
			<span
				aria-hidden="true"
				class="flex h-28 p-2.5 gap-2"
				[style.background]="theme.swatches[0]"
			>
				<span
					class="w-1/4 rounded-md flex flex-col gap-1.5 p-1.5"
					[style.background]="theme.swatches[1]"
				>
					<span
						class="h-1.5 w-3/4 rounded-full"
						[style.background]="theme.swatches[2]"
					></span>
					<span
						class="h-1 w-1/2 rounded-full opacity-40"
						[style.background]="theme.swatches[3]"
					></span>
					<span
						class="h-1 w-2/3 rounded-full opacity-40"
						[style.background]="theme.swatches[3]"
					></span>
				</span>
				<span class="flex-1 flex flex-col gap-2">
					<span
						class="h-2 w-1/2 rounded-full opacity-80"
						[style.background]="theme.swatches[3]"
					></span>
					<span class="flex-1 grid grid-cols-3 gap-1.5">
						@for (tile of previewTiles; track tile) {
						<span
							class="rounded-md"
							[style.background]="theme.swatches[1]"
						></span>
						}
					</span>
					<span
						class="self-start h-3 w-12 rounded-full"
						[style.background]="theme.swatches[2]"
					></span>
				</span>
			</span>
			<span class="flex items-start gap-3 p-4 border-t border-line">
				<span class="flex-1 min-w-0">
					<span
						class="flex items-center gap-2 text-sm font-semibold text-fg"
						>{{ theme.name }} @if (theme.tier === 'premium') {
						<ui-premium-badge size="sm" label="Premium theme" />
						}</span
					>
					<span
						class="block mt-0.5 text-xs text-fg-muted leading-relaxed"
						>{{ theme.description }}</span
					>
				</span>
				<span
					aria-hidden="true"
					class="shrink-0 w-6 h-6 inline-flex items-center justify-center rounded-full border transition"
					[class]="active ? 'bg-brand border-brand text-white' : 'border-line text-transparent'"
				>
					<span class="material-icons text-sm"
						>{{ saving() === theme.id ? 'more_horiz' : 'check'
						}}</span
					>
				</span>
			</span>
		</button>
		}
	</div>
</app-settings-panel>
