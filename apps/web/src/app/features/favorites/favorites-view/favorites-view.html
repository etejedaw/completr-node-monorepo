<div class="favorites-page">
	<div class="page-header">
		<h1>Favorites</h1>
		<span class="entry-count">{{ entries().length }} games</span>
	</div>

	@if (isLoading()) {
	<div class="loading">Loading...</div>
	} @else if (entries().length === 0) {
	<div class="empty">No favorites yet. Star a game from its detail page.</div>
	} @else {
	<div class="game-grid">
		@for (entry of entries(); track entry.id) {
		<div class="game-card">
			<a [routerLink]="['/games', entry.game.code]" class="card-link">
				@if (entry.game.backgroundUrl) {
				<img
					[src]="entry.game.backgroundUrl"
					[alt]="entry.game.title"
					class="game-cover"
				/>
				} @else {
				<div class="game-cover-placeholder"></div>
				}
				<span class="game-card-title">{{ entry.game.title }}</span>
			</a>
			<button
				class="btn-unfav"
				(click)="remove(entry)"
				title="Remove from favorites"
			>
				&times;
			</button>
		</div>
		}
	</div>
	}
</div>
