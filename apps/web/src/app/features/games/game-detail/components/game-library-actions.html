<div class="flex items-stretch gap-2">
	<div class="flex items-stretch gap-2 flex-1 sm:flex-none">
		@if (latestRun(); as run) {
		<button
			uiButton
			variant="secondary"
			size="lg"
			type="button"
			class="flex-1 sm:flex-none h-11 !rounded-card !bg-surface/70 backdrop-blur-md active:scale-[0.98]"
			[title]="'Open your ' + statusLabel(run.status).toLowerCase() + ' run'"
			(click)="openPrimary()"
		>
			<span
				class="inline-flex items-center gap-2"
				[class]="statusIconColor(run.status)"
			>
				<span aria-hidden="true" class="material-icons text-lg"
					>{{ statusIcon(run.status) }}</span
				>
				{{ statusLabel(run.status) }}
			</span>
			<span class="text-fg-muted">· {{ run.platform.abbreviation }}</span>
		</button>
		} @else {
		<button
			uiButton
			variant="primary"
			size="lg"
			type="button"
			class="flex-1 sm:flex-none h-11 !rounded-card shadow-lg shadow-brand/30 active:scale-[0.98]"
			(click)="openPrimary()"
		>
			<span aria-hidden="true" class="material-icons text-lg"
				>add_circle</span
			>
			Add to My Games
		</button>
		}
		<button
			uiButton
			variant="secondary"
			size="lg"
			type="button"
			class="shrink-0 h-11 w-11 !px-0 tap:min-w-[44px] !rounded-card backdrop-blur-md active:scale-95"
			[class]="(favorite() ? '!border-nav-favorites/50 !bg-nav-favorites/15 !text-nav-favorites' : '!bg-surface/70') + (variant() === 'full' ? ' md:w-auto md:!px-3.5' : '')"
			[disabled]="togglingFavorite()"
			[attr.aria-pressed]="favorite()"
			[attr.aria-label]="favorite() ? 'Remove from favorites' : 'Add to favorites'"
			[title]="favorite() ? 'Remove from favorites' : 'Add to favorites'"
			(click)="favoriteToggled.emit()"
		>
			<span aria-hidden="true" class="material-icons text-xl"
				>{{ favorite() ? 'favorite' : 'favorite_border' }}</span
			>
			@if (variant() === 'full') {
			<span aria-hidden="true" class="hidden md:inline">Favorite</span>
			}
		</button>
		@if (variant() === 'full') {
		<app-action-menu
			placement="hero"
			size="lg"
			label="More library actions"
			heading="Your library"
			[iconOnly]="true"
			[items]="libraryMenuItems()"
			(selected)="runLibraryAction($event)"
		/>
		}
	</div>
</div>
