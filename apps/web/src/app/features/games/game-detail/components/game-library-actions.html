<div
	class="flex items-stretch gap-2"
	[class.flex-col]="variant() === 'full'"
	[class.sm:flex-row]="variant() === 'full'"
	[class.sm:flex-wrap]="variant() === 'full'"
>
	<div class="flex items-stretch gap-2 flex-1 sm:flex-none">
		@if (latestRun(); as run) {
		<button
			uiButton
			variant="secondary"
			size="lg"
			type="button"
			class="flex-1 sm:flex-none h-11 !rounded-card !bg-surface/70 backdrop-blur-md active:scale-[0.98]"
			[title]="'Open your ' + statusLabel(run.status).toLowerCase() + ' run'"
			(click)="openPrimary()"
		>
			<span
				class="inline-flex items-center gap-2"
				[class]="statusIconColor(run.status)"
			>
				<span aria-hidden="true" class="material-icons text-lg"
					>{{ statusIcon(run.status) }}</span
				>
				{{ statusLabel(run.status) }}
			</span>
			<span class="text-fg-muted">· {{ run.platform.abbreviation }}</span>
		</button>
		} @else {
		<button
			uiButton
			variant="primary"
			size="lg"
			type="button"
			class="flex-1 sm:flex-none h-11 !rounded-card shadow-lg shadow-brand/30 active:scale-[0.98]"
			(click)="openPrimary()"
		>
			<span aria-hidden="true" class="material-icons text-lg"
				>add_circle</span
			>
			Add to My Games
		</button>
		}
		<button
			uiButton
			variant="secondary"
			size="lg"
			type="button"
			class="shrink-0 h-11 w-11 !px-0 tap:min-w-[44px] !rounded-card backdrop-blur-md active:scale-95"
			[class]="(favorite() ? '!border-nav-favorites/50 !bg-nav-favorites/15 !text-nav-favorites' : '!bg-surface/70') + (variant() === 'full' ? ' md:w-auto md:!px-3.5' : '')"
			[disabled]="togglingFavorite()"
			[attr.aria-pressed]="favorite()"
			[attr.aria-label]="favorite() ? 'Remove from favorites' : 'Add to favorites'"
			[title]="favorite() ? 'Remove from favorites' : 'Add to favorites'"
			(click)="favoriteToggled.emit()"
		>
			<span aria-hidden="true" class="material-icons text-xl"
				>{{ favorite() ? 'favorite' : 'favorite_border' }}</span
			>
			@if (variant() === 'full') {
			<span aria-hidden="true" class="hidden md:inline">Favorite</span>
			}
		</button>
	</div>

	@if (variant() === 'full') {
	<ul
		class="list-none m-0 p-0 grid grid-cols-4 gap-2 sm:flex sm:flex-wrap"
		aria-label="More library actions"
	>
		@for (action of secondaryActions(); track action.id) {
		<li class="flex">
			<button
				uiButton
				variant="secondary"
				type="button"
				class="flex-1 max-sm:flex-col h-16 sm:h-11 !px-2 sm:!px-3.5 !rounded-card backdrop-blur-md !text-[0.6875rem] sm:!text-sm !whitespace-normal active:scale-[0.97]"
				[class]="action.active ? '!bg-surface-hover !border-line-hover' : '!bg-surface/70 !text-fg-secondary hover:!text-fg'"
				[disabled]="action.disabled"
				[attr.aria-pressed]="action.active"
				(click)="runSecondary(action.id)"
			>
				<span
					aria-hidden="true"
					class="material-icons text-xl sm:text-lg"
					[class]="action.active ? action.accentClass : ''"
					>{{ action.active ? action.activeIcon : action.icon }}</span
				>
				<span class="leading-tight text-center"
					>{{ action.active ? action.activeLabel : action.label
					}}</span
				>
			</button>
		</li>
		}
	</ul>
	}
</div>
