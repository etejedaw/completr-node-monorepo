<ui-dialog
	heading="Add to your lists"
	eyebrow="Lists"
	icon="playlist_add"
	size="sm"
	[subheading]="gameTitle"
	[dismissible]="!state().saving"
	(closed)="close()"
>
	@if (myLists.length === 0) {
	<ui-plain-empty-state
		icon="playlist_add"
		title="No lists yet"
		message="Create your first one below."
		[compact]="true"
		[headingLevel]="3"
	/>
	} @else {
	<fieldset class="m-0 p-0 border-0">
		<legend class="sr-only">Lists that include {{ gameTitle }}</legend>
		<ul class="list-none m-0 p-0 -mx-2">
			@for (list of myLists; track list.id) {
			<li>
				<ui-checkbox
					class="!flex w-full min-h-[44px] px-2 rounded-card text-sm text-fg transition hover:bg-surface"
					[label]="list.name"
					[checked]="isChecked(list.id)"
					(checkedChange)="setSelected(list.id, $event)"
				>
					@if (!list.isPublic) {
					<span
						class="material-icons ml-auto text-sm text-fg-muted shrink-0"
						aria-label="Private"
						title="Private"
						>lock</span
					>
					}
				</ui-checkbox>
			</li>
			}
		</ul>
	</fieldset>
	}

	<div class="mt-4 pt-4 border-t border-line">
		<label for="new-list-name" uiFieldLabel>Or create a new list</label>
		<div class="flex gap-2">
			<input
				uiInput
				id="new-list-name"
				class="!flex-1 min-w-0"
				type="text"
				placeholder="New list name..."
				aria-describedby="new-list-hint"
				[value]="state().newListName"
				[disabled]="state().creatingNew"
				(input)="update({ newListName: $any($event.target).value })"
				(keydown.enter)="createNewList()"
			/>
			<button
				uiButton
				variant="secondary"
				class="shrink-0"
				[disabled]="!state().newListName.trim() || state().creatingNew"
				(click)="createNewList()"
			>
				{{ state().creatingNew ? "Creating..." : "Create" }}
			</button>
		</div>
		<p id="new-list-hint" class="m-0 mt-1.5 text-[0.6875rem] text-fg-muted">
			Public list with Metacritic + HowLongToBeat as sources.
		</p>
		@if (state().error) {
		<ui-alert class="mt-2">{{ state().error }}</ui-alert>
		}
	</div>

	<ng-container dialogFooter>
		<button
			uiButton
			variant="ghost"
			[disabled]="state().saving"
			(click)="close()"
		>
			Cancel
		</button>
		<button
			uiButton
			variant="primary"
			[disabled]="state().saving || myLists.length === 0"
			(click)="save()"
		>
			{{ state().saving ? "Saving..." : "Save" }}
		</button>
	</ng-container>
</ui-dialog>
