<ui-dialog
	heading="Add to your lists"
	eyebrow="Lists"
	size="sm"
	[subheading]="gameTitle"
	[dismissible]="!state().saving"
	(closed)="close()"
>
	@if (myLists.length === 0) {
	<div class="flex flex-col items-center text-center gap-2 py-6">
		<span aria-hidden="true" class="material-icons text-3xl text-fg-muted"
			>playlist_add</span
		>
		<p class="m-0 text-sm font-semibold text-fg">No lists yet</p>
		<p class="m-0 text-[0.8125rem] text-fg-muted">
			Create your first one below.
		</p>
	</div>
	} @else {
	<fieldset class="m-0 p-0 border-0">
		<legend class="sr-only">Lists that include {{ gameTitle }}</legend>
		<ul class="list-none m-0 p-0 -mx-2">
			@for (list of myLists; track list.id) {
			<li>
				<label
					class="flex items-center gap-3 min-h-[44px] px-2 rounded-card cursor-pointer transition hover:bg-surface"
				>
					<input
						type="checkbox"
						class="w-4 h-4 cursor-pointer accent-brand"
						[checked]="isChecked(list.id)"
						(change)="toggleSelection(list.id)"
					/>
					<span class="flex-1 text-sm text-fg truncate"
						>{{ list.name }}</span
					>
					@if (!list.isPublic) {
					<span
						class="material-icons text-sm text-fg-muted shrink-0"
						aria-label="Private"
						title="Private"
						>lock</span
					>
					}
				</label>
			</li>
			}
		</ul>
	</fieldset>
	}

	<div class="mt-4 pt-4 border-t border-line">
		<label
			for="new-list-name"
			class="block text-[0.6875rem] uppercase tracking-wider text-fg-muted mb-1.5"
			>Or create a new list</label
		>
		<div class="flex gap-2">
			<input
				uiInput
				id="new-list-name"
				class="!flex-1 min-w-0"
				type="text"
				placeholder="New list name..."
				aria-describedby="new-list-hint"
				[value]="state().newListName"
				[disabled]="state().creatingNew"
				(input)="update({ newListName: $any($event.target).value })"
				(keydown.enter)="createNewList()"
			/>
			<button
				uiButton
				variant="secondary"
				class="shrink-0 max-md:min-h-[44px]"
				[disabled]="!state().newListName.trim() || state().creatingNew"
				(click)="createNewList()"
			>
				{{ state().creatingNew ? "Creating..." : "Create" }}
			</button>
		</div>
		<p id="new-list-hint" class="m-0 mt-1.5 text-[0.6875rem] text-fg-muted">
			Public list with Metacritic + HowLongToBeat as sources.
		</p>
		@if (state().error) {
		<div
			role="alert"
			class="mt-2 py-1.5 px-3 bg-danger/10 border border-danger/20 rounded text-danger text-xs"
		>
			{{ state().error }}
		</div>
		}
	</div>

	<ng-container dialogFooter>
		<button
			uiButton
			variant="ghost"
			[disabled]="state().saving"
			(click)="close()"
		>
			Cancel
		</button>
		<button
			uiButton
			variant="primary"
			[disabled]="state().saving || myLists.length === 0"
			(click)="save()"
		>
			{{ state().saving ? "Saving..." : "Save" }}
		</button>
	</ng-container>
</ui-dialog>
