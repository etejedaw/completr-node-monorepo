<div class="flex flex-col gap-6">
	<app-game-filter-panel
		[allGenres]="allGenres()"
		[allPlatforms]="allPlatforms()"
		[(selectedGenres)]="selectedGenres"
		[(selectedPlatforms)]="selectedPlatforms"
		[(yearFrom)]="yearFrom"
		[(yearTo)]="yearTo"
	/>

	<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
		<app-filter-section label="Rating">
			<div class="grid grid-cols-2 gap-3">
				<div class="flex flex-col gap-1">
					<span
						id="browse-min-rating"
						class="text-[0.6875rem] text-fg-muted"
						><span class="sr-only">Rating, </span>Min</span
					>
					<app-star-rating
						ariaLabelledby="browse-min-rating"
						size="sm"
						[value]="minScore()"
						(ratingChange)="minScore.set($event)"
					/>
				</div>
				<div class="flex flex-col gap-1">
					<span
						id="browse-max-rating"
						class="text-[0.6875rem] text-fg-muted"
						><span class="sr-only">Rating, </span>Max</span
					>
					<app-star-rating
						ariaLabelledby="browse-max-rating"
						size="sm"
						[value]="maxScore()"
						(ratingChange)="maxScore.set($event)"
					/>
				</div>
			</div>
		</app-filter-section>

		<app-filter-section label="Hours to beat">
			<app-range-inputs
				label="Hours to beat"
				minPlaceholder="0"
				[step]="0.5"
				[(min)]="minDuration"
				[(max)]="maxDuration"
			/>
		</app-filter-section>

		<app-filter-section label="Type">
			<app-segmented-control
				label="Game type"
				[options]="typeOptions"
				[value]="typeValue()"
				(valueChange)="setType($event)"
			/>
		</app-filter-section>
	</div>

	@if (showClear() && activeCount() > 0) {
	<div class="flex justify-end pt-4 border-t border-line">
		<button uiButton variant="ghost" size="sm" (click)="cleared.emit()">
			<span aria-hidden="true" class="material-icons text-base"
				>filter_alt_off</span
			>
			Clear all filters
		</button>
	</div>
	}
</div>
