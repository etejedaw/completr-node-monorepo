<app-library-hero
	eyebrow="Guide"
	heading="How Completr works"
	[posters]="posters()"
>
	<p
		heroSubtitle
		class="m-0 mt-2 max-w-xl text-sm sm:text-base text-fg-secondary leading-relaxed"
	>
		Runs, the ratio, scores and privacy, explained in one page. Read it top
		to bottom or jump to what you need.
	</p>
	<button
		heroActions
		uiButton
		type="button"
		variant="glass"
		(click)="openTour()"
	>
		<span aria-hidden="true" class="material-icons text-base">tour</span>
		Take the quick tour
	</button>
</app-library-hero>

<app-library-toolbar class="lg:hidden">
	<app-page-toc
		path="/help"
		label="Guide sections"
		variant="chips"
		class="w-full min-w-0"
		[sections]="sections"
		[active]="scrollSpy.active()"
		(selected)="scrollSpy.scrollTo($event)"
	/>
</app-library-toolbar>

<div class="lg:grid lg:grid-cols-[12rem_minmax(0,1fr)] lg:gap-12 xl:gap-16">
	<aside class="hidden lg:block">
		<div class="sticky top-[calc(var(--topbar-height)+1.5rem)]">
			<app-page-toc
				path="/help"
				label="Guide sections"
				[sections]="sections"
				[active]="scrollSpy.active()"
				(selected)="scrollSpy.scrollTo($event)"
			/>
		</div>
	</aside>

	<div class="min-w-0 flex flex-col gap-16 sm:gap-20">
		<app-help-runs [scrollSpy]="scrollSpy" />
		<app-help-ratio [scrollSpy]="scrollSpy" />
		<app-help-scores [scrollSpy]="scrollSpy" />
		<app-help-statuses [scrollSpy]="scrollSpy" />
		<app-help-collection [scrollSpy]="scrollSpy" />
		<app-help-saved-views [scrollSpy]="scrollSpy" />
		<app-help-rewind [scrollSpy]="scrollSpy" />
		<app-help-privacy [scrollSpy]="scrollSpy" />
	</div>
</div>

<app-info-page-links current="help" />
<div
	aria-hidden="true"
	class="h-px"
	appInView
	(inViewChange)="scrollSpy.onEndInView($event)"
></div>
