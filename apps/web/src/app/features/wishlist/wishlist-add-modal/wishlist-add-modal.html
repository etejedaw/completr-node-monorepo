<ui-dialog
	eyebrow="Want to Get"
	size="md"
	[heading]="selectedGame() ? 'Pick a platform' : 'Add to Want to Get'"
	[subheading]="selectedGame() ? null : 'Search the catalog for a game you want'"
	[flush]="!selectedGame()"
	[dismissible]="!adding()"
	(closed)="onClose()"
>
	@if (selectedGame(); as game) {
	<app-selected-game-row
		class="mb-5"
		[game]="game"
		[autofocus]="true"
		(changeRequested)="backToSearch()"
	/>

	<app-wishlist-platform-choice
		[platforms]="game.platforms"
		[(selected)]="selectedPlatformId"
	/>
	} @else {
	<app-game-search-step
		emptyHint="Try another title, or check it isn't already in Want to Get."
		[results]="results()"
		[status]="search.status()"
		[onlineSearching]="search.forceSearching()"
		[autofocus]="returnedToSearch()"
		[(query)]="searchQuery"
		(picked)="pickGame($event)"
		(searchOnline)="search.searchOnline()"
	/>
	}

	<ng-container dialogFooter>
		@if (selectedGame(); as game) {
		<button
			uiButton
			variant="ghost"
			[disabled]="adding()"
			(click)="confirm(true)"
		>
			Skip
		</button>
		<button
			uiButton
			variant="primary"
			[disabled]="
				adding() || (game.platforms.length > 0 && !selectedPlatformId())
			"
			(click)="confirm(false)"
		>
			{{ adding() ? "Adding..." : "Add" }}
		</button>
		}
	</ng-container>
</ui-dialog>
