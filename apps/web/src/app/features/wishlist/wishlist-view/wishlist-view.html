<div>
	<div class="flex items-baseline gap-3 mb-5">
		<h1 class="text-3xl md:text-4xl font-bold tracking-tight font-display">Wishlist</h1>
		<span class="text-sm text-fg-muted">{{ total() }} games</span>
	</div>

	<ui-search-bar class="block mb-4 max-w-2xl" placeholder="Search by title..." [value]="searchQuery()" (valueChange)="onSearch($event)" />

	@if (isLoading()) {
		<div class="text-center py-12 text-fg-muted text-sm">Loading...</div>
	} @else if (entries().length === 0) {
		<div class="text-center py-12">
			<p class="empty-title">Your wishlist is empty</p>
			<p class="empty-hint">
				Games you want to obtain. Add them from the game's detail page —
				they live here until you actually have them.
			</p>
		</div>
	} @else {
		<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
			@for (entry of entries(); track entry.id) {
				<app-game-cover-card
					[game]="entry.game"
					[showRemove]="true"
					(remove)="remove(entry)"
				/>
			}
		</div>
	}

	<ui-pagination
		[offset]="offset()"
		[limit]="limit"
		[total]="total()"
		(offsetChange)="onOffsetChange($event)"
	/>
</div>
