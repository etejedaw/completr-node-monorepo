<app-library-hero heading="Want to Get" [posters]="heroPosters()">
	<span
		heroEyebrow
		class="text-[0.6875rem] font-semibold uppercase tracking-[0.2em] text-brand"
		>Library</span
	>
	<p
		heroSubtitle
		class="m-0 mt-2 flex items-center gap-1.5 text-sm text-fg-secondary"
	>
		<span
			class="font-semibold text-fg tabular-nums"
			[class.!text-premium]="isPremium()"
			>{{ total() }}</span
		>
		{{ total() === 1 ? 'game' : 'games' }} you want to get
		<ui-premium-badge
			*appPremiumOnly
			size="sm"
			interactive
			label="Premium perk: unlimited Want to Get"
			message="Your Want to Get list has no limit. Track every game you're after."
		/>
	</p>
	@if (isLoading() || allEntries().length > 0) {
	<button heroActions uiButton variant="primary" (click)="openAddModal()">
		<span aria-hidden="true" class="material-icons text-base">add</span>
		Add game
	</button>
	} @if (platformCounts().length > 1) {
	<app-platform-filter
		[platforms]="platformCounts()"
		[total]="allEntries().length"
		[(selected)]="selectedPlatform"
	/>
	}
</app-library-hero>

<app-library-page
	[state]="pageState()"
	[showToolbar]="isLoading() || allEntries().length > 0 || !!searchQuery().trim()"
	loadingLabel="Loading wishlist"
	noMatchesHint="Nothing in Want to Get matches your search or platform."
	noMatchesClearLabel="Clear search & filter"
	emptyIcon="redeem"
	emptyTitle="Nothing wanted yet"
	emptyHint="Games you'd like to acquire someday — physical copies, digital keys, anything you don't own yet. Different from Up Next (those are games you can play right now)."
	[offset]="offset()"
	[limit]="limit"
	[total]="total()"
	(cleared)="clearSearchAndFilter()"
	(offsetChange)="onOffsetChange($event)"
>
	<ng-template appLibraryPageToolbar>
		<ui-search-bar
			class="flex-1 max-w-2xl [&_input]:!py-2 [&_input]:!text-sm"
			placeholder="Search your wishlist..."
			ariaLabel="Search Want to Get"
			[value]="searchQuery()"
			(valueChange)="onSearch($event)"
		/>
	</ng-template>
	<ng-template appLibraryPageEmptyAction>
		<button uiButton variant="primary" (click)="openAddModal()">
			<span aria-hidden="true" class="material-icons text-base">add</span>
			Add game
		</button>
	</ng-template>
	<app-cover-grid *appLibraryPageContent [actionable]="true">
		@for (entry of entries(); track entry.id) {
		<li>
			<app-game-cover-card
				[game]="entry.game"
				[moodTags]="entry.moodTags"
				[topLeftBadge]="entry.platform?.abbreviation"
				[showFavorite]="true"
				[isFavorite]="isFavorite(entry.game.id)"
				[showWishlistToggle]="true"
				[inWishlist]="true"
				(favoriteToggle)="toggleFavorite(entry.game.id)"
				(wishlistToggle)="remove(entry)"
			/>
		</li>
		}
	</app-cover-grid>
</app-library-page>
