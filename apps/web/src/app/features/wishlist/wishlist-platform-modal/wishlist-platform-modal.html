<ui-dialog
	heading="Add to Want to Get"
	eyebrow="Want to Get"
	size="sm"
	[subheading]="gameTitle"
	[dismissible]="!saving()"
	(closed)="onClose()"
>
	<app-wishlist-platform-choice
		[platforms]="platforms"
		[(selected)]="selectedPlatformId"
	/>

	<ng-container dialogFooter>
		<button
			uiButton
			variant="ghost"
			[disabled]="saving()"
			(click)="confirm(true)"
		>
			Skip
		</button>
		<button
			uiButton
			variant="primary"
			[disabled]="saving() || (platforms.length > 0 && !selectedPlatformId())"
			(click)="confirm(false)"
		>
			{{ saving() ? "Adding..." : "Add" }}
		</button>
	</ng-container>
</ui-dialog>
