<app-library-hero heading="Up Next" [posters]="heroPosters()">
	<span
		heroEyebrow
		class="text-[0.6875rem] font-semibold uppercase tracking-[0.2em] text-brand"
		>Library</span
	>
	<p
		heroSubtitle
		class="m-0 mt-2 flex items-center gap-1.5 text-sm text-fg-secondary"
	>
		<span
			class="font-semibold text-fg tabular-nums"
			[class.!text-premium]="isPremium()"
			>{{ total() }}</span
		>
		{{ total() === 1 ? 'game' : 'games' }} in your queue
		<ui-premium-badge
			*appPremiumOnly
			size="sm"
			interactive
			label="Premium perk: unlimited Up Next"
			message="Your Up Next has no limit. Queue as many games as you like."
		/>
	</p>
	@if (isLoading() || entries().length > 0) {
	<button heroActions uiButton variant="primary" (click)="openAddModal()">
		<span aria-hidden="true" class="material-icons text-base">add</span>
		Add from library
	</button>
	}
</app-library-hero>

<app-queue-browser
	searchPlaceholder="Search your queue..."
	noMatchesScope="Up Next"
	[entries]="entries()"
	[queueIsEmpty]="entries().length === 0 && !searchQuery().trim()"
	[isLoading]="isLoading()"
	[searchQuery]="searchQuery()"
	[offset]="offset()"
	[limit]="limit"
	[total]="total()"
	[favoriteGameIds]="favoriteGameIds()"
	[updatingBacklogIds]="updatingStatusIds()"
	[savingOrder]="savingOrder()"
	[movingToTop]="movingToTop()"
	[(sortBy)]="sortBy"
	(searchChange)="onSearch($event)"
	(offsetChange)="onOffsetChange($event)"
	(saveOrder)="saveCurrentOrder($event)"
	(startPlaying)="requestStatusChange($event, 'playing')"
	(favoriteToggle)="toggleFavorite($event)"
	(remove)="remove($event)"
	(moveToTop)="moveToTop($event)"
	(moveUp)="moveUp($event)"
	(moveDown)="moveDown($event)"
	(entryMove)="moveEntry($event)"
>
	<ng-template #emptyQueue>
		<ui-plain-empty-state
			icon="playlist_play"
			title="Nothing queued yet"
			message="Line up the games you actually want to play next, in order. Pick titles you haven't started from your library."
		>
			<button uiButton variant="primary" (click)="openAddModal()">
				<span aria-hidden="true" class="material-icons text-base"
					>add</span
				>
				Add from library
			</button>
		</ui-plain-empty-state>
	</ng-template>
</app-queue-browser>

@if (pendingPlayEntry(); as pending) {
<ui-dialog
	eyebrow="Up Next"
	size="sm"
	[heading]="'Start playing ' + pending.backlog.game.title + '?'"
	(closed)="cancelPlayConfirmation()"
>
	<p class="m-0 mb-4 text-sm text-fg-secondary leading-relaxed">
		It will be marked as
		<span class="text-fg font-medium">Playing</span> and leave Up Next,
		which only holds games you haven't started.
	</p>
	<label class="flex flex-col gap-1.5">
		<span
			class="text-[0.625rem] font-semibold uppercase tracking-[0.16em] text-fg-muted"
			>Started on</span
		>
		<input
			uiInput
			type="date"
			[value]="pendingPlayStartedAt()"
			(input)="onPendingPlayStartedAtChange($any($event.target).value)"
		/>
	</label>
	<ng-container dialogFooter>
		<button uiButton variant="ghost" (click)="cancelPlayConfirmation()">
			Cancel
		</button>
		<button uiButton variant="primary" (click)="confirmPlay()">
			<span aria-hidden="true" class="material-icons text-base"
				>play_arrow</span
			>
			Start playing
		</button>
	</ng-container>
</ui-dialog>
}
