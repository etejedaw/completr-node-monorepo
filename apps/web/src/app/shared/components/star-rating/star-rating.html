<div
	class="flex items-center gap-2.5"
	(mouseleave)="onLeave()"
>
	<div
		class="flex"
		[class.gap-px]="size() === 'sm'"
		[class.gap-0.5]="size() !== 'sm'"
	>
		@for (star of stars; track star) {
			<span
				class="relative inline-block"
				[class.cursor-pointer]="!readonly()"
				[class.cursor-default]="readonly()"
				[class.w-6]="size() !== 'sm'"
				[class.h-6]="size() !== 'sm'"
				[class.w-3.5]="size() === 'sm'"
				[class.h-3.5]="size() === 'sm'"
			>
				@if (!readonly()) {
					<span
						class="absolute top-0 left-0 w-1/2 h-full z-10"
						(mouseenter)="onHalf(star)"
						(click)="onClick(star - 0.5)"
					></span>
					<span
						class="absolute top-0 right-0 w-1/2 h-full z-10"
						(mouseenter)="onFull(star)"
						(click)="onClick(star)"
					></span>
				}
				<span
					class="absolute inset-0 flex items-center justify-center pointer-events-none transition-colors leading-none"
					[class.text-xl]="size() !== 'sm'"
					[class.text-sm]="size() === 'sm'"
					[class.text-warning]="starState(star) === 'full'"
					[class.text-line-hover]="starState(star) === 'empty'"
					[style.background]="starState(star) === 'half' ? 'linear-gradient(90deg, var(--color-warning) 50%, var(--color-line-hover) 50%)' : null"
					[style.-webkit-background-clip]="starState(star) === 'half' ? 'text' : null"
					[style.background-clip]="starState(star) === 'half' ? 'text' : null"
					[style.-webkit-text-fill-color]="starState(star) === 'half' ? 'transparent' : null"
				>&#9733;</span>
			</span>
		}
	</div>
	@if (!readonly()) {
		<span class="flex items-center gap-1.5 min-w-[80px]">
			@if (displayValue() > 0) {
				<span class="text-[0.8125rem] font-semibold text-warning">{{ displayValue() }}</span>
			}
			@if (label()) {
				<span class="text-[0.6875rem] text-fg-muted uppercase tracking-wider">{{ label() }}</span>
			}
		</span>
	}
</div>
