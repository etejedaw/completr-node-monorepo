<div
	class="flex items-center gap-2.5"
	[class.readonly]="readonly()"
	(mouseleave)="onLeave()"
>
	<div
		class="flex"
		[class.gap-px]="size() === 'sm'"
		[class.gap-0.5]="size() !== 'sm'"
	>
		@for (star of stars; track star) {
			<span
				[class]="getStarClass(star)"
				class="relative inline-block cursor-pointer"
				[class.w-6]="size() !== 'sm'"
				[class.h-6]="size() !== 'sm'"
				[class.w-3.5]="size() === 'sm'"
				[class.h-3.5]="size() === 'sm'"
				[class.cursor-default]="readonly()"
			>
				@if (!readonly()) {
					<span
						class="absolute top-0 left-0 w-1/2 h-full z-10"
						(mouseenter)="onHalf(star)"
						(click)="onClick(star - 0.5)"
					></span>
					<span
						class="absolute top-0 right-0 w-1/2 h-full z-10"
						(mouseenter)="onFull(star)"
						(click)="onClick(star)"
					></span>
				}
				<span
					class="star-icon absolute inset-0 flex items-center justify-center pointer-events-none transition-colors"
					[class.text-xl]="size() !== 'sm'"
					[class.text-xs]="size() === 'sm'"
				>&#9733;</span>
			</span>
		}
	</div>
	@if (!readonly()) {
		<span class="flex items-center gap-1.5 min-w-[80px]">
			@if (displayValue > 0) {
				<span class="text-[0.8125rem] font-semibold text-warning">{{ displayValue }}</span>
			}
			@if (label) {
				<span class="text-[0.6875rem] text-fg-muted uppercase tracking-wider">{{ label }}</span>
			}
		</span>
	}
</div>
