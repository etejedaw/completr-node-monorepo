<button
	type="button"
	class="group/status tap-area relative inline-flex max-w-full rounded-full bg-transparent border-0 p-0 cursor-pointer transition disabled:opacity-50 disabled:cursor-not-allowed focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
	[ngpMenuTrigger]="menu"
	[ngpMenuTriggerDisabled]="usesSheet() || disabled()"
	ngpMenuTriggerPlacement="bottom-start"
	[ngpMenuTriggerOffset]="6"
	[disabled]="disabled()"
	[attr.aria-haspopup]="usesSheet() ? 'dialog' : 'menu'"
	[attr.aria-label]="triggerLabel()"
	[attr.aria-busy]="disabled() || null"
	(click)="onTriggerClick($event)"
>
	<app-backlog-status-badge
		class="rounded-full ring-1 ring-inset ring-line transition group-hover/status:ring-brand/50 group-data-[open]/status:ring-brand"
		[status]="status()"
		><span aria-hidden="true" class="material-icons -mr-1 text-sm"
			>arrow_drop_down</span
		></app-backlog-status-badge
	>
</button>

<ng-template #menu>
	<div
		ngpMenu
		[attr.aria-label]="heading()"
		class="fixed z-[1010] min-w-[11rem] max-w-[20rem] p-1.5 bg-sidebar border border-line rounded-card shadow-[0_24px_48px_-16px_rgba(0,0,0,0.75)] outline-none data-[enter]:animate-[uiFadeUp_140ms_ease-out]"
	>
		<div
			ngpMenuItemRadioGroup
			[ngpMenuItemRadioGroupValue]="status()"
			(ngpMenuItemRadioGroupValueChange)="chooseFromMenu($event)"
		>
			@for (option of options(); track option) {
			<button
				ngpMenuItemRadio
				type="button"
				class="w-full flex items-center gap-2.5 min-h-9 px-2.5 rounded bg-transparent border-0 text-left text-sm text-fg-secondary outline-none cursor-pointer hover:bg-surface-hover hover:text-fg focus-visible:bg-surface-hover focus-visible:text-fg data-[checked]:text-fg data-[checked]:font-medium"
				[ngpMenuItemRadioValue]="option"
			>
				<span
					aria-hidden="true"
					class="material-icons text-base shrink-0"
					[class]="iconColor(option)"
					>{{ icon(option) }}</span
				>
				<span class="flex-1 min-w-0 truncate">{{ label(option) }}</span>
				@if (option === status()) {
				<span
					aria-hidden="true"
					class="material-icons text-base text-brand"
					>check</span
				>
				}
			</button>
			}
		</div>
	</div>
</ng-template>

@if (sheetOpen()) {
<ui-bottom-sheet
	[heading]="heading()"
	[subheading]="subject()"
	(closed)="sheetOpen.set(false)"
>
	<ul class="list-none m-0 p-0 flex flex-col gap-1">
		@for (option of options(); track option) {
		<li>
			<button
				type="button"
				class="w-full min-h-14 flex items-center gap-3 px-4 rounded-card bg-transparent border border-transparent text-base font-medium text-fg text-left cursor-pointer transition active:bg-surface disabled:cursor-default"
				[class.!bg-brand-subtle]="option === status()"
				[class.!border-brand/30]="option === status()"
				[attr.aria-pressed]="option === status()"
				[disabled]="disabled()"
				(click)="chooseFromSheet(option)"
			>
				<span
					aria-hidden="true"
					class="material-icons text-2xl shrink-0"
					[class]="iconColor(option)"
					>{{ icon(option) }}</span
				>
				<span class="flex-1 min-w-0 truncate">{{ label(option) }}</span>
				@if (option === status()) {
				<span aria-hidden="true" class="material-icons text-brand"
					>check</span
				>
				}
			</button>
		</li>
		}
	</ul>
</ui-bottom-sheet>
}
