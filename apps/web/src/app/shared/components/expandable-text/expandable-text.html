<p
	#content
	[id]="contentId"
	class="text-fg-secondary text-sm leading-relaxed whitespace-pre-line m-0"
	[class.line-clamp-4]="!expanded() && lines() === 4"
	[class.line-clamp-6]="!expanded() && lines() === 6"
>
	{{ text() }}
</p>
@if (overflows()) {
<button
	type="button"
	uiButton
	variant="link"
	class="mt-2"
	[attr.aria-expanded]="expanded()"
	[attr.aria-controls]="contentId"
	(click)="toggle()"
>
	{{ expanded() ? 'Read less' : 'Read more' }}
	<span aria-hidden="true" class="material-icons text-base"
		>{{ expanded() ? 'expand_less' : 'expand_more' }}</span
	>
</button>
}
