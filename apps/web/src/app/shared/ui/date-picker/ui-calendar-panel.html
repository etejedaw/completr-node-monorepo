<div class="flex items-center gap-2">
	<button
		uiIconButton
		size="lg"
		type="button"
		ngpDatePickerPreviousMonth
		aria-label="Previous month"
	>
		<span aria-hidden="true" class="material-icons">chevron_left</span>
	</button>
	<h2
		ngpDatePickerLabel
		[id]="gridLabelId"
		class="m-0 flex-1 text-center font-display text-base font-semibold text-fg"
	>
		{{ monthLabel(focusedDay()) }}
	</h2>
	<button
		uiIconButton
		size="lg"
		type="button"
		ngpDatePickerNextMonth
		aria-label="Next month"
	>
		<span aria-hidden="true" class="material-icons">chevron_right</span>
	</button>
</div>

<table ngpDatePickerGrid class="w-full border-collapse table-fixed">
	<thead>
		<tr>
			@for (weekday of weekdays; track $index) {
			<th
				scope="col"
				[attr.abbr]="weekday.full"
				class="h-8 p-0 text-[0.6875rem] font-semibold uppercase tracking-[0.08em] text-fg-muted"
			>
				{{ weekday.short }}
			</th>
			}
		</tr>
	</thead>
	<tbody>
		<tr *ngpDatePickerRowRender>
			<td
				*ngpDatePickerCellRender="let date"
				ngpDatePickerCell
				class="p-0.5 text-center"
			>
				<button
					ngpDatePickerDateButton
					data-day
					type="button"
					[attr.aria-label]="dayLabel(date)"
					class="mx-auto flex size-[40px] tap:size-[44px] max-sm:size-[44px] items-center justify-center rounded-card border border-transparent bg-transparent text-sm tabular-nums text-fg-secondary cursor-pointer outline-none transition hover:bg-surface-hover hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-brand data-[outside-month]:text-fg-muted data-[today]:border-line-hover data-[today]:font-semibold data-[today]:text-fg data-[range-between]:!bg-brand-subtle data-[range-between]:!text-fg data-[selected]:!border-brand data-[selected]:!bg-brand-solid data-[selected]:font-semibold data-[selected]:!text-white disabled:cursor-not-allowed disabled:opacity-35 disabled:line-through disabled:hover:bg-transparent disabled:hover:text-fg-secondary"
				>
					{{ date.getDate() }}
				</button>
			</td>
		</tr>
	</tbody>
</table>
