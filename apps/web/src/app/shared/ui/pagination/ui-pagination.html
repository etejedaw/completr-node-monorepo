@if (total() > limit()) {
	<div
		ngpPagination
		[ngpPaginationPage]="currentPage()"
		[ngpPaginationPageCount]="totalPages()"
		(ngpPaginationPageChange)="onPageChange($event)"
		class="flex flex-wrap items-center justify-center gap-2 mt-5 pt-4 border-t border-line"
	>
		<button
			ngpPaginationFirst
			class="w-8 h-8 inline-flex items-center justify-center bg-input-bg border border-line rounded text-fg-secondary text-[0.8125rem] cursor-pointer transition disabled:opacity-40 disabled:cursor-not-allowed enabled:hover:border-brand enabled:hover:text-brand"
			title="First page"
			aria-label="First page"
		>
			<span class="material-icons text-base">first_page</span>
		</button>
		<button
			ngpPaginationPrevious
			class="w-8 h-8 inline-flex items-center justify-center bg-input-bg border border-line rounded text-fg-secondary text-[0.8125rem] cursor-pointer transition disabled:opacity-40 disabled:cursor-not-allowed enabled:hover:border-brand enabled:hover:text-brand"
			title="Previous page"
			aria-label="Previous page"
		>
			<span class="material-icons text-base">chevron_left</span>
		</button>

		<div class="hidden sm:flex items-center gap-1">
			@for (p of pages(); track $index) {
				@if (p === '...') {
					<span class="w-8 h-8 inline-flex items-center justify-center text-fg-muted text-[0.8125rem]">…</span>
				} @else {
					<button
						ngpPaginationButton
						[ngpPaginationButtonPage]="p"
						class="min-w-8 h-8 px-2 inline-flex items-center justify-center border rounded text-[0.8125rem] font-medium cursor-pointer transition"
						[class.bg-brand]="p === currentPage()"
						[class.border-brand]="p === currentPage()"
						[class.text-white]="p === currentPage()"
						[class.bg-input-bg]="p !== currentPage()"
						[class.border-line]="p !== currentPage()"
						[class.text-fg-secondary]="p !== currentPage()"
						[class.hover:border-brand]="p !== currentPage()"
						[class.hover:text-brand]="p !== currentPage()"
					>
						{{ p }}
					</button>
				}
			}
		</div>

		<span class="sm:hidden text-[0.8125rem] text-fg-muted px-2">
			{{ currentPage() }} / {{ totalPages() }}
		</span>

		<button
			ngpPaginationNext
			class="w-8 h-8 inline-flex items-center justify-center bg-input-bg border border-line rounded text-fg-secondary text-[0.8125rem] cursor-pointer transition disabled:opacity-40 disabled:cursor-not-allowed enabled:hover:border-brand enabled:hover:text-brand"
			title="Next page"
			aria-label="Next page"
		>
			<span class="material-icons text-base">chevron_right</span>
		</button>
		<button
			ngpPaginationLast
			class="w-8 h-8 inline-flex items-center justify-center bg-input-bg border border-line rounded text-fg-secondary text-[0.8125rem] cursor-pointer transition disabled:opacity-40 disabled:cursor-not-allowed enabled:hover:border-brand enabled:hover:text-brand"
			title="Last page"
			aria-label="Last page"
		>
			<span class="material-icons text-base">last_page</span>
		</button>

		<span class="text-[0.8125rem] text-fg-muted ml-2">{{ start() }}–{{ end() }} of {{ total() }}</span>
	</div>
}
