<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				font-family: "Inter", system-ui, sans-serif;
				color: #f4f4f6;
				background: #0a0a0c;
				overflow: hidden;
				-webkit-font-smoothing: antialiased;
			}
			.frame {
				position: relative;
				width: 100%;
				height: 100%;
				padding: 80px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				overflow: hidden;
			}
			.glow {
				position: absolute;
				width: 900px;
				height: 900px;
				border-radius: 50%;
				filter: blur(120px);
				opacity: 0.45;
				pointer-events: none;
				background: radial-gradient(circle, #8b5cf6 0%, transparent 60%);
				top: -300px;
				left: 50%;
				transform: translateX(-50%);
			}
			.brand {
				position: relative;
				z-index: 1;
				display: flex;
				align-items: center;
				gap: 16px;
			}
			.brand-logo {
				width: 64px;
				height: 64px;
				border-radius: 16px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: "Sora", sans-serif;
				font-weight: 800;
				font-size: 30px;
				color: white;
				background: linear-gradient(135deg, #8b5cf6, #6d28d9);
				box-shadow: 0 12px 32px -8px rgba(139, 92, 246, 0.55);
			}
			.brand-name {
				font-family: "Sora", sans-serif;
				font-weight: 700;
				font-size: 48px;
				letter-spacing: -0.02em;
			}
			.content {
				position: relative;
				z-index: 1;
				max-width: 880px;
			}
			.badge {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 8px 16px;
				border-radius: 999px;
				font-size: 14px;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.12em;
				background: rgba(139, 92, 246, 0.18);
				color: #c4a8ff;
				border: 1px solid rgba(139, 92, 246, 0.4);
				margin-bottom: 28px;
			}
			.badge-dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: #8b5cf6;
			}
			h1 {
				font-family: "Sora", sans-serif;
				font-weight: 800;
				font-size: 88px;
				line-height: 1;
				letter-spacing: -0.025em;
				margin-bottom: 28px;
			}
			h1 .accent {
				background: linear-gradient(135deg, #8b5cf6, #c4a8ff);
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			.subtitle {
				font-size: 28px;
				line-height: 1.4;
				color: #b4b4be;
				max-width: 800px;
			}
			.footer {
				position: relative;
				z-index: 1;
				display: flex;
				align-items: center;
				justify-content: space-between;
				font-size: 18px;
				color: #71717a;
			}
			.footer-tag {
				display: inline-flex;
				align-items: center;
				gap: 10px;
			}
			.footer-tag strong {
				color: #b4b4be;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<div class="frame">
			<div class="glow"></div>

			<div class="brand">
				<div class="brand-logo">C</div>
				<div class="brand-name">Completr</div>
			</div>

			<div class="content">
				<div class="badge">
					<span class="badge-dot"></span>
					Beta privada
				</div>
				<h1>
					Tu backlog,<br />
					<span class="accent">ordenado.</span>
				</h1>
				<p class="subtitle">
					Tracker de videojuegos para llevar el control de tu backlog y
					decidir qué jugar a continuación.
				</p>
			</div>

			<div class="footer">
				<span class="footer-tag"
					>Catálogo respaldado por <strong>RAWG</strong></span
				>
				<span>completr.app</span>
			</div>
		</div>
	</body>
</html>
