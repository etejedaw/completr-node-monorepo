# captures the first "es" or "en" tag in preference order, e.g. "fr-FR,en-US;q=0.8,es;q=0.5" -> "en"
map $http_accept_language $accept_language_first_known {
    default "";
    "~*^(?:[^,]*,)*?\s*(?<first_known>es|en)(?:-[a-z0-9]+)*\s*(?:;[^,]*)?(?:,|$)" $first_known;
}

map $accept_language_first_known $preferred_locale {
    ~*^es es;
    default en;
}

# takes the locale from paths like "/en/whatever"
map $uri $not_found_locale {
    "~^/(?<path_locale>es|en)(?:/|$)" $path_locale;
    default $preferred_locale;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$preferred_locale/;
    }

    # legacy unprefixed pages, e.g. "/privacy" or "/changelog/2/"
    location ~ ^/(?:privacy|changelog|gracias)(?:/.*)?$ {
        include /etc/nginx/security-headers.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$preferred_locale$request_uri;
    }

    location ~ ^/(changelog|privacy)\.json$ {
        include /etc/nginx/security-headers.conf;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ^~ /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        expires 1d;
        add_header Cache-Control "public";
    }

    error_page 404 /$not_found_locale/404/index.html;
}
