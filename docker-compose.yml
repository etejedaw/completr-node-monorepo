services:
  postgres:
    image: postgres:bookworm
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=toor
      - POSTGRES_DB=postgres
  pgadmin:
    image: elestio/pgadmin
    restart: unless-stopped
    ports:
      - 80:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@postgres.com
      - PGADMIN_DEFAULT_PASSWORD=toor
    depends_on:
      - postgres
